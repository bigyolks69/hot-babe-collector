// Compact collection strip for death / win overlays
// Bold red X: pen-stroke draw — stroke1 then stroke2, ~0.15s each, no delay, then hold
const LOST_X_STROKE = 0.15;
function drawLostBabeX(x, y, w, h, t) {
  const inset = Math.max(3, w * 0.12);
  const x0 = x + inset, y0 = y + inset;
  const x1 = x + w - inset, y1 = y + h - inset;
  ctx.save();
  ctx.strokeStyle = "#ff2030";
  ctx.lineWidth = Math.max(3, Math.min(8, w * 0.14));
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  // Stroke 1 grows TL → BR
  const a = Math.max(0, Math.min(1, t / LOST_X_STROKE));
  if (a > 0) {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0 + (x1 - x0) * a, y0 + (y1 - y0) * a);
    ctx.stroke();
  }
  // Stroke 2 grows TR → BL after stroke 1 finishes
  const b = Math.max(0, Math.min(1, (t - LOST_X_STROKE) / LOST_X_STROKE));
  if (b > 0) {
    ctx.beginPath();
    ctx.moveTo(x1, y0);
    ctx.lineTo(x1 + (x0 - x1) * b, y0 + (y1 - y0) * b);
    ctx.stroke();
  }
  ctx.restore();
}

function layoutMiniCollection(panelW, maxPanelH) {
  const cols = 6, rows = 2;
  const gapX = 8, gapY = 8;
  const padX = 14, padTop = 28, padBot = 12;
  const gridW = panelW - padX * 2;
  let cw = (gridW - gapX * (cols - 1)) / cols;
  let ch = cardHeight(cw);
  let contentH = padTop + rows * ch + (rows - 1) * gapY + padBot;
  if (maxPanelH && contentH > maxPanelH) {
    // Shrink uniformly so 2 rows fit without squashing
    const maxCh = (maxPanelH - padTop - padBot - (rows - 1) * gapY) / rows;
    ch = maxCh;
    cw = cardWidth(ch);
    contentH = padTop + rows * ch + (rows - 1) * gapY + padBot;
  }
  return { cols, rows, gapX, gapY, padX, padTop, padBot, cw, ch, contentH };
}

function drawMiniCollection(opts) {
  opts = opts || {};
  const panelX = opts.x != null ? opts.x : 100;
  const panelY = opts.y != null ? opts.y : 175;
  const panelW = opts.w != null ? opts.w : W - 200;
  const maxH = opts.maxH != null ? opts.maxH : (H - panelY - 20);
  const lostId = opts.lostId || null;
  const lostPrevCount = opts.lostPrevCount || 0;
  const animT = opts.animT != null ? opts.animT : 0;
  const animDur = opts.animDur != null ? opts.animDur : 2.2;

  const L = layoutMiniCollection(panelW, maxH);
  const panelH = L.contentH;

  // Center grid horizontally if cards shrank below full width
  const gridW = L.cols * L.cw + (L.cols - 1) * L.gapX;
  const gridOriginX = panelX + (panelW - gridW) / 2;

  ctx.fillStyle = "rgba(12,8,22,0.88)";
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,90,154,0.55)";
  ctx.lineWidth = 2;
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.stroke();

  const unique = Object.keys(collection).filter(k => collection[k] > 0).length;
  ctx.fillStyle = "#ffb0d0";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Babes", panelX + 14, panelY + 20);
  ctx.fillStyle = "#fff";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText(unique + " / " + CHAR_DEFS.length + " owned", panelX + panelW - 14, panelY + 20);

  for (let i = 0; i < CHAR_DEFS.length; i++) {
    const col = i % L.cols, row = Math.floor(i / L.cols);
    const x = gridOriginX + col * (L.cw + L.gapX);
    const y = panelY + L.padTop + row * (L.ch + L.gapY);
    const char = CHAR_DEFS[i];
    const count = collection[char.id] || 0;
    const isLost = lostId && char.id === lostId;
    const cw = L.cw, ch = L.ch;

    ctx.save();
    if (isLost) {
      // Keep babe colored as pre-loss; pen-stroke red X draws in (~0.15s × 2)
      const displayCount = count > 0 ? count : (lostPrevCount > 1 ? lostPrevCount - 1 : null);
      drawCard(char, x, y, cw, ch, {
        locked: false,
        count: displayCount,
        showRarity: false,
      });
      drawLostBabeX(x, y, cw, ch, animT);
    } else {
      drawCard(char, x, y, cw, ch, {
        locked: count === 0,
        count: count > 0 ? count : null,
        showRarity: false,
      });
    }
    ctx.restore();
  }
  return { panelH, cw: L.cw, ch: L.ch, ratio: L.cw / L.ch };
}

function drawDead() {
  // Solid black — same stage as the cry beat; layout unchanged on top
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ff6b8a";
  ctx.font = "bold 32px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Ouch!", W / 2, 48);
  const unique = ownedUniqueCount(collection);
  ctx.fillStyle = "#ffb0d0";
  ctx.font = "13px sans-serif";
  ctx.fillText("Babes owned: " + unique + "/" + BABE_POOL.length, W / 2, 72);

  if (loseAnim && loseAnim.name) {
    ctx.fillStyle = "#ffe66d";
    ctx.font = "bold 20px sans-serif";
    ctx.fillText("LOST: " + loseAnim.name, W / 2, 98);
    ctx.fillStyle = "#bbb";
    ctx.font = "12px sans-serif";
    ctx.fillText("A random babe was taken from your collection", W / 2, 118);
  } else {
    ctx.fillStyle = "#ccc";
    ctx.font = "14px sans-serif";
    ctx.fillText("No babes to lose… this time.", W / 2, 100);
  }

  // Gallery-style grid (rarity→name), auto-scrolled to lost babe
  const list = sortedBabeList();
  const cols = 6;
  const cw = 92, ch = cardHeight(cw), gapX = 12, gapY = 10;
  const panelX = 48, panelY = 132;
  const panelW = W - 96;
  const panelH = H - panelY - 40;
  const gridW = cols * cw + (cols - 1) * gapX;
  const startX = panelX + (panelW - gridW) / 2;
  const rows = Math.ceil(list.length / cols);
  const contentH = rows * ch + (rows - 1) * gapY;
  const maxScroll = Math.max(0, contentH - panelH + 8);

  let focusIdx = loseAnim && loseAnim.lostId
    ? list.findIndex(b => b.id === loseAnim.lostId) : -1;
  if (deathGridScroll < 0) {
    if (focusIdx >= 0) {
      const row = Math.floor(focusIdx / cols);
      const rowY = row * (ch + gapY);
      deathGridScroll = Math.max(0, Math.min(maxScroll, rowY - (panelH - ch) / 2));
    } else {
      deathGridScroll = 0;
    }
  }
  deathGridScroll = Math.max(0, Math.min(maxScroll, deathGridScroll));

  ctx.fillStyle = "rgba(12,8,22,0.88)";
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,90,154,0.5)";
  ctx.lineWidth = 2;
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.stroke();

  ctx.save();
  ctx.beginPath();
  ctx.rect(panelX + 4, panelY + 4, panelW - 8, panelH - 8);
  ctx.clip();

  for (let i = 0; i < list.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = startX + col * (cw + gapX);
    const y = panelY + 10 + row * (ch + gapY) - deathGridScroll;
    if (y + ch < panelY || y > panelY + panelH) continue;
    const babe = list[i];
    const count = collection[babe.id] || 0;
    const isLost = loseAnim && loseAnim.lostId === babe.id;
    if (isLost) {
      const displayCount = count > 0 ? count : (loseAnim.lostPrevCount > 1 ? loseAnim.lostPrevCount - 1 : null);
      drawCard(babe, x, y, cw, ch, {
        locked: false,
        count: displayCount,
      });
      drawLostBabeX(x, y, cw, ch, loseAnim.t);
    } else {
      drawCard(babe, x, y, cw, ch, {
        locked: count === 0,
        count: count > 0 ? count : null,
      });
    }
  }
  ctx.restore();

  ctx.fillStyle = "#aaa";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Respawning at checkpoint…", W / 2, H - 14);
}

    ctx.fillStyle = "#fff";
    ctx.font = "14px sans-serif";
    ctx.fillText(
      "Babe drops " + winStats.coins + "/" + winStats.coinsMax +
      "   ·   Babes " + winStats.unique + "/" + BABE_POOL.length +
      "   ·   Pulls " + winStats.total,
      W / 2, 102
    );
  }

  ctx.fillStyle = "#ffb0d0";
  ctx.font = "bold 16px sans-serif";
  ctx.fillText("Babes gained this run", W / 2, 140);

  const gained = (winStats && winStats.gained) ? winStats.gained : [];
  if (!gained.length) {
    ctx.fillStyle = "#888";
    ctx.font = "14px sans-serif";
    ctx.fillText("No babes collected this run — next time!", W / 2, 220);
  } else {
    const cw = 72, ch = cardHeight(cw), gap = 12;
    const totalW = gained.length * cw + (gained.length - 1) * gap;
    // Scrollable row if too wide
    const maxW = W - 80;
    const scrollMax = Math.max(0, totalW - maxW);
    if (winStats._gScroll == null) winStats._gScroll = 0;
    if (justPressed["arrowleft"] || justPressed["a"]) winStats._gScroll = Math.max(0, winStats._gScroll - 80);
    if (justPressed["arrowright"] || justPressed["d"]) winStats._gScroll = Math.min(scrollMax, winStats._gScroll + 80);
    const origin = (W - Math.min(totalW, maxW)) / 2 - winStats._gScroll;
    ctx.save();
    ctx.beginPath();
    ctx.rect(40, 160, W - 80, ch + 40);
    ctx.clip();
    for (let i = 0; i < gained.length; i++) {
      const babe = babeById(gained[i]);
      if (!babe) continue;
      const x = origin + i * (cw + gap);
      drawCard(babe, x, 168, cw, ch, { showRarity: false, max: isMaxed(babe.id) });
    }
    ctx.restore();
    if (scrollMax > 0) {
      ctx.fillStyle = "#888";
      ctx.font = "11px sans-serif";
      ctx.fillText("← → scroll", W / 2, 168 + ch + 28);
    }
  }

  ctx.fillStyle = "#ffe66d";
  ctx.font = "bold 16px sans-serif";
  ctx.textAlign = "center";
  if (fin) ctx.fillText(isTouch ? "Tap to play again from Level 1" : "Press Enter to play again from Level 1", W / 2, H - 48);
  else ctx.fillText(isTouch ? "Tap to continue to Level " + (levelNum + 1) : "Press Enter to continue to Level " + (levelNum + 1) + "  ·  R to replay", W / 2, H - 48);
  ctx.fillStyle = "#aaa";
  ctx.font = "13px sans-serif";
  ctx.fillText(isTouch ? "Open Collection to view your babes" : "Press C to view full babe gallery", W / 2, H - 26);
}

function frame(dt) {
  if (congrats) {
    congrats.t += dt;
    if (Object.keys(justPressed).length) dismissCongrats();
    else if (congrats.t >= CONGRATS_DUR) dismissCongrats(true);
    for (const k in justPressed) delete justPressed[k]; // the dismissing press does nothing else
  } else if (performance.now() - congratsClosedAt < 120) {
    for (const k in justPressed) delete justPressed[k]; // tap-dismiss on a touch button: swallow its press
  }
  const frozen = !!congrats;
  frameInner(frozen ? 0 : dt);
  if (congrats) drawCongrats(dt);
}

function drawCongrats(dt) {
  const c = congrats, t = c.t;
  const a = Math.min(1, t / 0.35) * (t > CONGRATS_DUR - 0.5 ? Math.max(0, (CONGRATS_DUR - t) / 0.5) : 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = "rgba(12,4,26,0.72)";
  ctx.fillRect(0, 0, W, H);
  // sparkles + drifting confetti
  for (const sp of c.sparks) {
    sp.y += sp.vy * dt; if (sp.y > H + 8) { sp.y = -8; sp.x = Math.random() * W; }
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 3 + sp.p));
    ctx.globalAlpha = a * tw;
    ctx.fillStyle = `hsl(${(sp.hue + t * 60) % 360}, 100%, 75%)`;
    const r = sp.s;
    ctx.fillRect(sp.x - r, sp.y - 0.5, r * 2, 1.5);
    ctx.fillRect(sp.x - 0.5, sp.y - r, 1.5, r * 2);
  }
  ctx.globalAlpha = a;
  // panel
  const pw = 760, ph = 250, px = (W - pw) / 2, py = (H - ph) / 2 - 10;
  const pop = 1 + 0.06 * Math.max(0, 1 - t / 0.35);
  ctx.translate(W / 2, py + ph / 2); ctx.scale(pop, pop); ctx.translate(-W / 2, -(py + ph / 2));
  const bg = ctx.createLinearGradient(px, py, px + pw, py + ph);
  bg.addColorStop(0, "#3a0f4f"); bg.addColorStop(1, "#5a1640");
  ctx.fillStyle = bg;
  roundRect(px, py, pw, ph, 18); ctx.fill();
  const bd = ctx.createLinearGradient(px, py, px + pw, py);
  for (let i = 0; i <= 6; i++) bd.addColorStop(i / 6, `hsl(${(i * 60 + t * 120) % 360}, 100%, 65%)`);
  ctx.strokeStyle = bd; ctx.lineWidth = 4;
  roundRect(px, py, pw, ph, 18); ctx.stroke();
  // text (exact copy, split over two lines)
  const split = CONGRATS_TEXT.indexOf("Life");
  ctx.textAlign = "center";
  ctx.shadowColor = "rgba(255,90,154,0.8)"; ctx.shadowBlur = 16;
  ctx.fillStyle = "#ffe66d";
  ctx.font = "bold 32px sans-serif";
  ctx.fillText(CONGRATS_TEXT.slice(0, split).trim(), W / 2, py + 62);
  ctx.fillStyle = "#ff8ec8";
  ctx.font = "bold 28px sans-serif";
  ctx.fillText(CONGRATS_TEXT.slice(split), W / 2, py + 104);
  ctx.shadowBlur = 0;
  // all 30 babes as tiny 3:4 faces
  const cw = 20, chh = cardHeight(cw), gap = 3, rowW = BABE_POOL.length * (cw + gap) - gap;
  let x0 = W / 2 - rowW / 2;
  BABE_POOL.forEach((b, i) => {
    const bob = Math.sin(t * 4 + i * 0.5) * 3;
    drawCard(b, x0 + i * (cw + gap), py + 128 + bob, cw, chh, { iconOnly: true });
  });
  ctx.fillStyle = "#fff";
  ctx.font = "bold 15px sans-serif";
  ctx.fillText("All " + BABE_POOL.length + " babes collected", W / 2, py + 188);
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "13px sans-serif";
  ctx.fillText(isTouch ? "Tap to continue" : "Press any key to continue", W / 2, py + 220);
  // time bar
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.fillRect(px + 40, py + ph - 14, pw - 80, 3);
  ctx.fillStyle = "#ffe66d";
  ctx.fillRect(px + 40, py + ph - 14, (pw - 80) * Math.max(0, 1 - t / CONGRATS_DUR), 3);
  ctx.restore();
}

function frameInner(dt) {
  if (justPressed["m"]) { ensureAudio(); setMuted(!muted); }
  if (state === "title") {
    drawTitle();
    if ((justPressed[" "] || justPressed["enter"]) && (heroSprites.ready || heroSprites.failed)) {
      startLevel(progress.level);
      ensureAudio();
    }
    return;
  }

  if (state === "collection") {
    if (slot) updateSlot(dt);
    updateParticles(dt);
    drawBackground();
    drawWorld();
    drawHUD();
    if (slot) drawSlot();
    drawCollection();
    if (justPressed["c"] || (justPressed["escape"] && !gallery.selected)) {
      gallery.selected = null;
      state = collectionReturn; // back to play, or to the win panel it was opened from
    }
    return;
  }

  if (state === "win") {
    if (slot) updateSlot(dt);
    updateParticles(dt);
    drawBackground();
    drawWorld();
    drawHUD();
    if (slot) drawSlot();
    drawWin();
    if (justPressed["enter"] || justPressed[" "]) winContinue();
    else if (justPressed["r"]) startLevel(winStats && winStats.final ? 1 : levelNum); // replay
    if (justPressed["c"]) openCollection();
    return;
  }

  // update — gameplay + slot overlay run together
  updateParticles(dt);
  updateHudTray(dt);
  if (slot) updateSlot(dt);
  if (state === "play") {
    updatePlay(dt);
    if (justPressed["c"] && state === "play") openCollection();
  } else if (state === "dying") {
    updateDying(dt);
  } else if (state === "dead") {
    updateDead(dt);
  }

  // draw
  if (state === "dying") {
    drawDyingCry(); // black + zoomed cry; hide world/HUD
  } else if (state === "dead") {
    drawDead(); // black stage + Ouch layout
  } else {
    drawBackground();
    drawWorld();
    drawHUD();
  }
  // Slot overlay stays on top (including over death) so the roll remains visible
  if (slot) drawSlot();
}

// Debug: stitched whole-level overview (rows of 150 tiles) — used for docs/screenshots only
function renderLevelOverview(n) {
  const def = LEVELS[(n || levelNum) - 1];
  const L = buildLevel(def, DIFFICULTY[def.id] || DIFFICULTY[1]);
  const th = LEVEL_THEMES[def.theme];
  const S = 6, ROW = 150, rows = Math.ceil(L.width / ROW), rowH = LEVEL_H * S, top = 34, gapY = 22;
  const cv = document.createElement("canvas");
  cv.width = ROW * S + 40; cv.height = top + rows * (rowH + gapY) + 10;
  const g = cv.getContext("2d");
  g.fillStyle = "#120a1e"; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = "#ffe66d"; g.font = "bold 15px sans-serif";
  g.fillText(def.name + " overview — " + L.width + " tiles (" + L.width * TILE + "px), " + L.checkpoints.length + " checkpoints, " +
    L.picks.length + " babe drops, " + L.enemySlots.length + " enemies, speed x" + L.diff.enemySpeed, 20, 22);
  for (let r = 0; r < rows; r++) {
    const ox = 20 - r * ROW * S, oy = top + r * (rowH + gapY);
    g.save();
    g.beginPath(); g.rect(20, oy, ROW * S, rowH); g.clip();
    const sky = g.createLinearGradient(0, oy, 0, oy + rowH);
    sky.addColorStop(0, th.sky[0]); sky.addColorStop(1, th.sky[2]);
    g.fillStyle = sky; g.fillRect(20, oy, ROW * S, rowH);
    for (const p of L.plats) {
      g.fillStyle = th.dirt; g.fillRect(ox + p.x * S, oy + p.y * S, p.w * S, p.h * S);
      g.fillStyle = th.grass; g.fillRect(ox + p.x * S, oy + p.y * S, p.w * S, 2);
    }
    for (const [tx, ty] of L.picks) { g.fillStyle = "#ff5a9a"; g.fillRect(ox + tx * S + 1, oy + ty * S, 5, 7); g.fillStyle = "#ffe66d"; g.fillRect(ox + tx * S + 3, oy + ty * S + 2, 1, 3); }
    for (const e of L.enemySlots) { g.fillStyle = e.type === "hopper" ? "#7cff8a" : "#ff4a4a"; g.fillRect(ox + e.x * S, oy + (e.y - 1) * S + 1, 5, 5); }
    for (const c of L.checkpoints) { const cx = ox + c.x / TILE * S; g.fillStyle = "#fff"; g.fillRect(cx, oy + 11 * S, 1, 4 * S); g.fillStyle = "#ff8ec8"; g.fillRect(cx + 1, oy + 11 * S, 7, 5); }
    const gx = ox + L.goal.x / TILE * S; g.fillStyle = "#ffe66d"; g.fillRect(gx, oy + 12 * S, 2, 3 * S); g.fillRect(gx + 2, oy + 12 * S, 8, 6);
    g.restore();
    g.fillStyle = "#aaa"; g.font = "10px sans-serif";
    for (let t = r * ROW; t <= Math.min(L.width, (r + 1) * ROW); t += 25) g.fillText(String(t), ox + t * S, oy + rowH + 12);
  }
  g.fillStyle = "#ddd"; g.font = "11px sans-serif";
  g.fillText("pink = babe drop · red = walker · green = hopper · flag = checkpoint · gold = goal", 20, cv.height - 4);
  return cv.toDataURL("image/png");
}

// ---------- Main loop ----------
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  frame(dt);
  // clear justPressed at end of frame
  for (const k in justPressed) delete justPressed[k];
  requestAnimationFrame(loop);
}

// Fit canvas
function fit() {
  // Letterbox: scale canvas to fit while keeping 16:9 game aspect
  const r = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cssW = Math.max(1, Math.floor(W * r));
  const cssH = Math.max(1, Math.floor(H * r));
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  positionMuteBtn();
}
window.addEventListener("resize", () => { fit(); });
fit();

loadLevel(progress.level);
resetLevel(true);
state = "title";
preloadHeroSprites().then(ok => {
  if (!ok) console.warn("[HBC] Hero sprites failed to load — using drawn fallback");
});
preloadCardArt().then(() => {
  console.log("[HBC] card art ready");
}).catch(e => console.warn("[HBC] card art preload", e));
loadBgm();
preloadCryAudio().then(() => {
  console.log("[HBC] cry audio ready", { oneshot: cryAudio.oneshotUrl, loop: cryAudio.loopUrl, webaudio: !!cryAudio.oneshotBuf });
}).catch(e => console.warn("[HBC] cry audio preload", e));
requestAnimationFrame(loop);

// Expose for headless testing
window.__HBC = {
  getHero: () => heroSprites,
  getPlayerSize: () => ({ w: player.w, h: player.h, sw: HERO_SW, sh: HERO_SH }),
  setDebugHeroPose: (p) => { debugHeroPose = p; },
  getState: () => state,
  setState: (s) => { state = s; },
  getPlayer: () => player,
  getCoins: () => coins,
  getEnemies: () => enemies,
  getHearts: () => hearts,
  getCollection: () => collection,
  getSlot: () => slot,
  getSlotQueue: () => slotQueue,
  getCallouts: () => callouts.map(c => ({ text: c.text, t: c.t, dur: c.dur, y: c.y, alpha: calloutAlpha(c) })),
  getCalloutTiming: () => ({ fadeIn: CALLOUT_IN, hold: CALLOUT_HOLD, fadeOut: CALLOUT_OUT }),
  // Debug: force the next pull(s) to a specific babe / tier (tier data is untouched)
  forcePull: (id) => { if (!babeById(id)) return false; debugPulls.push(id); return true; },
  setDebugRarity: (tier) => { debugRarity = tier || null; },
  grantBabe: (id, n) => { if (!babeById(id)) return false; collection[id] = clampCount((collection[id] || 0) + (n || 1)); saveCollection(collection); noteAcquired(id); return true; },
  // grant one of every babe except `exceptId` (then pull that one to complete the set for real)
  grantAll: (exceptId) => { for (const b of BABE_POOL) if (b.id !== exceptId && !(collection[b.id] > 0)) { collection[b.id] = 1; noteAcquired(b.id); } saveCollection(collection); return ownedUniqueCount(collection); },
  resetCompleteFlag: () => { collectionCompleteFlag = false; try { localStorage.removeItem(COMPLETE_KEY); } catch (e) {} },
  getCongrats: () => congrats && { t: congrats.t, text: CONGRATS_TEXT },
  isCollectionComplete: () => collectionCompleteFlag,
  getRecent: () => recentBabes.slice(),
  getTrayIds: () => recentBabes.filter(id => (collection[id] || 0) > 0).slice(0, HUD_SLOTS).reverse(),
  getLevel: () => ({ num: levelNum, name: level.name, width: level.width, diff: level.diff, pits: level.pits,
    platforms: platforms.map(p => ({ ...p })), checkpoints: checkpoints.map(c => ({ ...c })), goal: { ...goal },
    picks: level.picks.slice(), enemySlots: level.enemySlots.map(e => ({ ...e })), checkpointIdx,
    TILE, LEVEL_H, physics: { GRAV, MOVE_ACC, MOVE_MAX, FRICTION, JUMP_V, JUMP_CUT, PLAYER_W, PLAYER_H } }),
  getLevelDefs: () => LEVELS.map(d => d.id),
  getProgress: () => ({ ...progress }),
  getBgm: () => ({ mode: bgm.mode, url: bgm.url, wanted: bgm.wanted, starts: bgm.starts, playing: !!bgm.src || !!(bgm.html && !bgm.html.paused),
    loop: bgm.src ? bgm.src.loop : (bgm.html ? bgm.html.loop : null), loopStart: bgm.loopStart, loopEnd: bgm.loopEnd,
    duration: bgm.buf ? bgm.buf.duration : null, pos: bgmPosition(), ctx: actx && actx.state, ctxTime: actx && actx.currentTime,
    musicGain: bgm.gain ? bgm.gain.gain.value : null, master: masterGain ? masterGain.gain.value : null, muted }),
  // measure output level after masterGain (what the speakers get) and of the music bus alone
  audioLevels: () => {
    if (!actx) return null;
    const mk = (node) => { const a = actx.createAnalyser(); a.fftSize = 2048; node.connect(a); return a; };
    if (!window.__hbcAn) window.__hbcAn = { out: mk(masterGain), music: bgm.gain ? mk(bgm.gain) : null };
    if (!window.__hbcAn.music && bgm.gain) window.__hbcAn.music = mk(bgm.gain);
    const rms = (a) => { if (!a) return null; const d = new Float32Array(a.fftSize); a.getFloatTimeDomainData(d); let s = 0; for (const v of d) s += v * v; return Math.sqrt(s / d.length); };
    return { out: rms(window.__hbcAn.out), music: rms(window.__hbcAn.music) };
  },
  // test-only: jump the playhead close to the loop end to watch the wrap (does not count as a start)
  bgmJumpNearEnd: (sec) => { if (!bgm.src) return false; const old = bgm.src; const src = actx.createBufferSource(); src.buffer = bgm.buf; src.loop = true; src.loopStart = bgm.loopStart; src.loopEnd = bgm.loopEnd; src.connect(bgm.gain); bgm.offset = bgm.loopEnd - (sec || 1); bgm.t0 = actx.currentTime; src.start(0, bgm.offset); bgm.src = src; old.stop(); old.disconnect(); return true; },
  teleport: (x, y) => { player.x = x; player.y = y; player.vx = 0; player.vy = 0; player.prevX = x; player.prevY = y; cameraX = Math.max(0, Math.min(x - W * 0.38, LEVEL_W * TILE - W)); },
  renderOverview: (n) => renderLevelOverview(n),
  getMaxCopies: () => MAX_COPIES,
  isMaxed: (id) => isMaxed(id),
  getPullable: () => pullableBabes().map(b => b.id),
  rollMany: (n) => { const m = {}; for (let i = 0; i < n; i++) { const b = rollCharacter(); const k = b ? b.id : "(none)"; m[k] = (m[k] || 0) + 1; } return m; },
  setCount: (id, n) => { if (!babeById(id)) return false; const c = clampCount(n); if (c > 0) collection[id] = c; else delete collection[id]; saveCollection(collection); return true; },
  getArtCache: () => { let ok = 0, loading = 0, failed = 0, bytes = 0; const bad = [];
    for (const [u, v] of IMG_CACHE) { if (v === "loading") loading++; else if (imgOk(v)) { ok++; bytes += v.naturalWidth * v.naturalHeight * 4; } else { failed++; bad.push(u); } }
    return { ok, loading, failed, bad, decodedMB: +(bytes / 1048576).toFixed(1) }; },
  babeArtUrls: (id) => { const b = babeById(id); if (!b) return null; const out = ["sm", "md", "lg"].map(k => babeArtUrl(b, k));
    if (b.rarity === "ultra") for (const k of ["sm", "md", "lg"]) for (let i = 0; i < animFrameCount("ultra", k); i++) out.push(ultraFrameUrl(b, k, i));
    return out; },
  getTierCounts: () => BABE_POOL.reduce((m, b) => (m[b.rarity] = (m[b.rarity] || 0) + 1, m), {}),
  getCardAspect: () => CARD_ASPECT,
  getCardImgs: () => cardImgs,
  forceSlotResult: (id) => {
    const babe = babeById(id);
    if (!babe || isMaxed(id)) return false; // never plant a maxed babe
    // Plant a finished-looking roll that awards this babe
    const strip = [];
    for (let i = 0; i < 24; i++) strip.push(CHAR_DEFS[i % CHAR_DEFS.length]);
    strip.push(babe);
    for (let i = 0; i < 4; i++) strip.push(CHAR_DEFS[i % CHAR_DEFS.length]);
    slot = {
      strip, result: babe, targetIndex: 24,
      startOffset: 0, offset: 24, elapsed: 1.2, duration: 1.2,
      done: true, revealT: 0,
    };
    return true;
  },
  getCardLayouts: () => {
    const slot = { w: 72 * 0.7, h: cardHeight(72 * 0.7) };
    const collection = { w: 100, h: cardHeight(100) };
    const title = { w: 90, h: cardHeight(90) };
    const world = { w: 15, h: cardHeight(15) };
    const death = { w: 140, h: cardHeight(140) };
    const win = { w: 72, h: cardHeight(72) };
    const hud = { w: 28, h: cardHeight(28) };
    return {
      aspect: CARD_ASPECT,
      poolSize: BABE_POOL.length,
      slot: { ...slot, ratio: slot.w / slot.h },
      collection: { ...collection, ratio: collection.w / collection.h },
      title: { ...title, ratio: title.w / title.h },
      worldPickup: { ...world, ratio: world.w / world.h },
      miniDeath: { ...death, ratio: death.w / death.h },
      miniWin: { ...win, ratio: win.w / win.h },
      hudLive: { w: HUD_CW, h: cardHeight(HUD_CW), ratio: HUD_CW / cardHeight(HUD_CW) },
    };
  },
  getLoseAnim: () => loseAnim,
  getDeathCry: () => deathCry,
  getCryAudio: () => ({
    playing: cryAudio.playing,
    startedAt: cryAudio.startedAt,
    ready: cryAudio.ready,
    oneshotUrl: cryAudio.oneshotUrl,
    hasBuf: !!cryAudio.oneshotBuf,
    muted,
  }),
  stopDeathCry,
  playDeathCry,
  setMuted,
  setLoseAnimT: (v) => { if (loseAnim) loseAnim.t = v; },
  getLostXStroke: () => LOST_X_STROKE,
  getCenteredCard: () => {
    if (!slot) return null;
    const idx = Math.round(slot.offset);
    return slot.strip[idx] || null;
  },
  startPlay: (n) => { startLevel(n || levelNum); },
  forceCoin: () => {
    const c = coins.find(x => !x.collected);
    if (c) { player.x = c.x - 4; player.y = c.y - player.h + 4; }
  },
  triggerCoin: () => {
    const c = coins.find(x => !x.collected);
    if (!c) return false;
    c.collected = true;
    onCoinCollected();
    return true;
  },
  openCollection: () => { gallery.selected = null; openCollection(); },
  setGallerySelected: (id) => { gallery.selected = id; state = "collection"; },
  setGalleryFilter: (f) => { gallery.filter = f; gallery.scroll = 0; },
  getGallery: () => gallery,
  getBabePool: () => BABE_POOL,
  getRunGained: () => runGained,
  getHudTray: () => hudTray,
  focusHudOnBabe: (id) => focusHudOnBabe(id),
};
