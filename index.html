// Floating 1-tile ledges are one-way: walk/jump through from below/side, land from above.
function isOneWayPlat(p) { return p.y < GROUND_Y && p.h === 1; }

function solidAt(px, py, pw, ph, mode) {
  // mode "land" includes one-way tops when falling; otherwise skip one-way (no side/ceiling block)
  const land = mode === "land";
  for (const p of platforms) {
    const x = p.x * TILE, y = p.y * TILE, w = p.w * TILE, h = p.h * TILE;
    if (!(px < x + w && px + pw > x && py < y + h && py + ph > y)) continue;
    if (isOneWayPlat(p)) {
      if (!land) continue;
      return { x, y, w, h, oneWay: true };
    }
    return { x, y, w, h, oneWay: false };
  }
  return null;
}

function resolvePlayer(dt) {
  const prevBottom = player.y + player.h;
  player.x += player.vx * dt;
  let hit = solidAt(player.x, player.y, player.w, player.h);
  if (hit) {
    if (player.vx > 0) player.x = hit.x - player.w;
    else if (player.vx < 0) player.x = hit.x + hit.w;
    player.vx = 0;
  }
  player.y += player.vy * dt;
  player.onGround = false;
  if (player.vy >= 0) {
    hit = solidAt(player.x, player.y, player.w, player.h, "land");
    if (hit && (!hit.oneWay || prevBottom <= hit.y + 6)) {
      player.y = hit.y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
  } else {
    hit = solidAt(player.x, player.y, player.w, player.h);
    if (hit) { player.y = hit.y + hit.h; player.vy = 0; }
  }
  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > LEVEL_W * TILE) { player.x = LEVEL_W * TILE - player.w; player.vx = 0; }
}

function groundUnder(px, feetY) {
  // Thin probe just below feet — true if a platform would catch a landing
  return !!solidAt(px, feetY, player.w, 6);
}

/** Platform top near feet supporting [x,x+w]; prefers the highest (smallest Y) match. */
function platformTopNear(x, w, feetY) {
  let best = null;
  for (const p of platforms) {
    const px = p.x * TILE, py = p.y * TILE, pw = p.w * TILE;
    const overlap = Math.min(x + w, px + pw) - Math.max(x, px);
    if (overlap < 6) continue;
    if (py >= feetY - 4 && py <= feetY + 48) {
      if (best == null || py < best) best = py;
    }
  }
  if (best == null) {
    for (const p of platforms) {
      const px = p.x * TILE, py = p.y * TILE, pw = p.w * TILE;
      const overlap = Math.min(x + w, px + pw) - Math.max(x, px);
      if (overlap < 6) continue;
      if (Math.abs(py - feetY) <= 8) {
        if (best == null || py < best) best = py;
      }
    }
  }
  return best;
}

function hurtPlayer(fromX) {
  if (invuln > 0 || player.stompGrace > 0 || state !== "play") return;
  hearts--;
  invuln = 1.4;
  player.flash = 1.4;
  // Bounce away from the enemy: horizontal knockback + small upward pop
  let dir = (player.x + player.w / 2 < fromX) ? -1 : 1;
  const feet = player.y + player.h;
  const probe = 56; // ~1.75 tiles ahead
  const awayHasGround = groundUnder(player.x + dir * probe, feet) ||
    groundUnder(player.x + dir * probe, feet + TILE);
  const towardHasGround = groundUnder(player.x - dir * probe, feet) ||
    groundUnder(player.x - dir * probe, feet + TILE);
  // Avoid knocking the player straight into a pit (unfair death loop near edges)
  let kb = 290;
  if (!awayHasGround) {
    if (towardHasGround) dir = -dir;
    else { dir = 0; kb = 0; } // pit both ways — just pop up in place
  }
  player.vx = dir * kb;
  player.vy = -280;
  player.onGround = false;
  player.stun = 0.25; // brief loss of control so knockback reads
  player.jumpBuf = 0;
  sfx.hit();
  spawnParticles(player.x + player.w/2, player.y + player.h/2, "#ff4466", 10);
  if (hearts <= 0) {
    onHeartsZero();
  }
}

function seatPlayerForDeathCry() {
  player.vx = 0;
  player.vy = 0;
  player.stun = 0;
  player.flash = 0;
  player.jumpBuf = 0;
  player.fromStomp = false;
  // Snap onto solid ground underfoot so the cry reads clearly (pit path already parked at checkpoint)
  const top = platformTopNear(player.x, player.w, player.y + player.h);
  if (top != null) {
    player.y = top - player.h;
    player.onGround = true;
  }
  // Keep camera locked on him
  cameraX = Math.max(0, Math.min(player.x - W * 0.38, LEVEL_W * TILE - W));
}

function onHeartsZero() {
  // Single clean event — ignore re-entry while already dying or on Ouch screen
  if (state === "dying" || state === "dead") return;
  // Lose one random *already owned* babe now (pending unrevealed roll is not owned yet).
  const owned = Object.keys(collection).filter(k => collection[k] > 0);
  let lostName = null;
  let lostId = null;
  let lostPrevCount = 0;
  if (owned.length) {
    const id = owned[Math.floor(Math.random() * owned.length)];
    lostPrevCount = collection[id];
    collection[id]--;
    if (collection[id] <= 0) delete collection[id];
    saveCollection(collection);
    const ch = CHAR_DEFS.find(c => c.id === id);
    lostName = ch ? ch.name : id;
    lostId = id;
    sfx.lose();
  }
  seatPlayerForDeathCry();
  // ~1.5s black-screen zoomed cry before Ouch; enemies frozen, no input, no re-hit
  deathCry = {
    t: 0, dur: 1.5, lostName, lostId, lostPrevCount,
    animT: 0, animStarted: false, cryStarted: false,
  };
  loseAnim = null;
  invuln = 99; // belt-and-suspenders vs any stray collision
  if (lostId) focusHudOnBabe(lostId);
  deathGridScroll = -1;
  state = "dying";
}

function beginOuchScreen() {
  stopDeathCry();
  if (!deathCry) {
    state = "dead";
    loseAnim = { t: 0, name: null, lostId: null, lostPrevCount: 0, dur: 2.2 };
    return;
  }
  loseAnim = {
    t: 0,
    name: deathCry.lostName,
    lostId: deathCry.lostId,
    lostPrevCount: deathCry.lostPrevCount,
    dur: 2.2,
  };
  deathCry = null;
  state = "dead";
}

function updateDying(dt) {
  if (!deathCry) { beginOuchScreen(); return; }
  deathCry.t += dt;
  player.vx = 0;
  player.vy = 0;
  // Start cry audio + dead-anim frame 0 exactly when black cry screen begins (after white flash hold)
  if (!deathCry.cryStarted && deathCry.t >= DEATH_FLASH_HOLD) {
    deathCry.cryStarted = true;
    deathCry.animStarted = true;
    deathCry.animT = 0;
    playDeathCry();
  }
  if (deathCry.animStarted) deathCry.animT += dt;
  maybeStartCryLoop(); // only if somehow past 1.5s
  // Enemies frozen (no update) — cannot re-hit
  if (deathCry.t >= deathCry.dur) beginOuchScreen();
}

/** Full-screen black + zoomed cry loop (integer scale, crisp). */
function drawDyingCry() {
  const t = deathCry ? deathCry.t : 0;
  // Phase 1: solid white flash (covers everything)
  if (t < DEATH_FLASH_HOLD) {
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, W, H);
    return;
  }
  // Phase 2+: black + cry, with optional white fade overlay
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  const fr = heroFrameForState();
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  const dw = HERO_SW * DEATH_CRY_SCALE;
  const dh = HERO_SH * DEATH_CRY_SCALE;
  const dx = Math.floor((W - dw) / 2);
  const dy = Math.floor((H - dh) / 2);
  if (fr.img) {
    ctx.drawImage(fr.img, fr.sx, fr.sy, fr.sw, fr.sh, dx, dy, dw, dh);
  } else {
    ctx.fillStyle = "#6ec8ff";
    ctx.fillRect(dx + dw * 0.25, dy + dh * 0.2, dw * 0.5, dh * 0.7);
  }
  ctx.restore();
  // White fade into black cry (~0.1s); folded into the same 1.5s window
  const fadeT = t - DEATH_FLASH_HOLD;
  if (fadeT < DEATH_FLASH_FADE) {
    ctx.fillStyle = "#fff";
    ctx.globalAlpha = 1 - fadeT / DEATH_FLASH_FADE;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*220,
      vy: (Math.random()-0.8)*260,
      life: 0.4 + Math.random()*0.5,
      color, size: 2 + Math.random()*3
    });
  }
}

// Post-roll callout ("NEW! <name> · Common", "★ RARE DUPE x2 — <name>", …)
// Pop in, hold at full opacity, then fade smoothly to 0.
const CALLOUT_IN = 0.2;    // pop-in (unchanged)
const CALLOUT_HOLD = 1.4;  // full opacity: old ~0.4s visible time + 1.0s
const CALLOUT_OUT = 0.45;  // smooth fade-out
const CALLOUT_H = 36, CALLOUT_GAP = 6;
// Callouts sit where the roll panel was; if a (queued) roll is on screen they
// slide just below the panel so the next roll never hides them.
function calloutBaseY() {
  return slot ? SLOT_PANEL_Y + SLOT_PANEL_H + 8 : 56;
}
function addCallout(text, color) {
  callouts.push({ text, color, t: 0, dur: CALLOUT_IN + CALLOUT_HOLD + CALLOUT_OUT, y: null });
}
function calloutAlpha(c) {
  if (c.t < CALLOUT_IN) return c.t / CALLOUT_IN;
  const fadeStart = CALLOUT_IN + CALLOUT_HOLD;
  if (c.t <= fadeStart) return 1;
  const u = Math.min(1, (c.t - fadeStart) / CALLOUT_OUT);
  return 1 - u * u * (3 - 2 * u); // smoothstep 1 → 0
}

function beginSlotRoll(forcedResult) {
  // Precompute result and plant it at targetIndex BEFORE spinning.
  // Offset eases exactly to that index — no end snap/swap.
  const result = forcedResult || rollCharacter();
  if (!result) { addCallout("All babes maxed out!", "#ffe66d"); return false; }
  // Start streaming the result's slot-size art now so it's animated when it lands
  if (result.rarity === "ultra") warmUltra(result, "md"); else img(babeArtUrl(result, "md"));
  const targetIndex = 24;
  const strip = [];
  // Filler: babes still in the pool (fall back to everyone when few remain, so the strip looks full)
  const avail = pullableBabes();
  const filler = avail.length >= 4 ? avail : CHAR_DEFS;
  const others = filler.filter(b => b.id !== result.id);
  for (let i = 0; i < targetIndex; i++) {
    // keep approach cards visually distinct from the result
    const src = i > targetIndex - 4 && others.length ? others : filler;
    strip.push(src[Math.floor(Math.random() * src.length)]);
  }
  strip.push(result);
  for (let i = 0; i < 4; i++) {
    strip.push(filler[Math.floor(Math.random() * filler.length)]);
  }
  slot = {
    strip,
    result,
    targetIndex,
    startOffset: 0,
    offset: 0,
    elapsed: 0,
    duration: 1.2,
    done: false,
    revealT: 0,
  };
  sfx.coin();
  return true;
}

// Coin pickup: start a roll, or queue if one is already playing. Gameplay never pauses.
function onCoinCollected() {
  if (slot) {
    slotQueue++;
    sfx.coin();
  } else if (!pullableBabes().length) {
    addCallout("All babes maxed out!", "#ffe66d"); // no roll
    sfx.coin();
  } else {
    beginSlotRoll();
  }
}

function finishSlot() {
  if (!slot) return;
  const id = slot.result.id;
  const prev = collection[id] || 0;
  collection[id] = clampCount(prev + 1);
  const nowMax = collection[id] >= MAX_COPIES;
  const maxTag = nowMax ? " MAX" : "";
  saveCollection(collection);
  noteAcquired(id); // dupes move to newest too
  runGained.push(id);
  focusHudOnBabe(id);
  const rar = rarityOf(id);
  const nm = slot.result.name;
  if (prev === 0) {
    if (rar.id === "ultra") {
      addCallout("✦ ULTRA RARE! NEW! " + nm, "#ffd24a");
      spawnParticles(W / 2, 120, "#ffd24a", 24);
      spawnParticles(W / 2, 120, "#ff7ab8", 12);
    } else if (rar.id === "rare") {
      addCallout("★ RARE! NEW! " + nm, "#7ec8ff");
      spawnParticles(W / 2, 120, "#7ec8ff", 14);
    } else {
      addCallout("NEW! " + nm + " · Common", "#ffe66d");
    }
    sfx.new();
  } else {
    const n = collection[id];
    if (rar.id === "ultra") addCallout("✦ ULTRA RARE DUPE x" + n + maxTag + " — " + nm, "#ffd24a");
    else if (rar.id === "rare") addCallout("★ RARE DUPE x" + n + maxTag + " — " + nm, "#9ad0ff");
    else addCallout("DUPE x" + n + maxTag + " — " + nm + " · Common", nowMax ? "#ffe66d" : "#9ad0ff");
  }
  slot = null;
  checkCollectionComplete(); // shows the celebration right after the completing roll
  // Chain queued rolls immediately (even over death/win overlays — player earned them);
  // while the celebration is up they wait and resume when it's dismissed
  if (slotQueue > 0 && !congrats) {
    slotQueue--;
    // If that was the last babe in the pool, the queued pickups have nothing left to roll
    if (!beginSlotRoll()) slotQueue = 0;
  }
}


// ---------- Gacha Machine Demon (Level 3 boss) ----------
// 3 HP. Attacks telegraph clearly; the glowing crank is only stompable while it "jams"
// after an attack (smoke + "OUT OF ORDER"). Hit → stunned recovery (cyan flash) before hostile.
// Death resets HP + clears minions/projectiles
// and parks the player at the arena entrance. Defeat → shake → rare-or-better slot pull → final win.
const BOSS_HP = 3;
const BOSS_W = 4 * TILE;   // 128
const BOSS_H = 6 * TILE;   // 192
const BOSS_CRANK_W = 28, BOSS_CRANK_H = 28;
const BOSS_BEAM_WARN = 0.6, BOSS_BEAM_FIRE = 0.55, BOSS_BEAM_FIRE_LOW = 0.2;
const BOSS_COIN_N = [3, 4, 5];     // coins per spit by phase (1–3)
const BOSS_MINION_N = [2, 3, 4];
const BOSS_VULN = [1.6, 1.35, 1.15];
const BOSS_HIT_STUN = 1.15; // post-stomp recovery before hostile again
const BOSS_IDLE = [1.1, 0.85, 0.65];
const BOSS_ATTACKS = ["beam", "coins", "minions"];

let boss = null; // null outside Level 3

function makeBoss() {
  if (!level || !level.boss) return null;
  const arenaL = level.arenaLeft != null ? level.arenaLeft : checkpoints[Math.min(1, checkpoints.length - 1)].x;
  const arenaR = LEVEL_W * TILE;
  const floor = GROUND_Y * TILE;
  // Sit on the right half of the arena, facing left toward the entrance
  const x = arenaL + Math.floor((arenaR - arenaL - BOSS_W) * 0.62);
  const y = floor - BOSS_H;
  const caps = [];
  for (let i = 0; i < 14; i++) {
    const b = BABE_POOL[i % BABE_POOL.length];
    caps.push({ id: b.id, a: Math.random() * Math.PI * 2, r: 10 + Math.random() * 28,
      sp: 1.2 + Math.random() * 1.6, bob: Math.random() * 6.28, col: ["#ff6ab0", "#7ec8ff", "#ffe66d", "#b48cff", "#7dff9a"][i % 5] });
  }
  return {
    x, y, w: BOSS_W, h: BOSS_H, hp: BOSS_HP, maxHp: BOSS_HP,
    phase: 0, // hits taken
    mode: "idle", modeT: 0, nextAtk: 0,
    locked: false, arenaL, arenaR,
    crank: { ox: 18, oy: BOSS_H - 70, w: BOSS_CRANK_W, h: BOSS_CRANK_H }, // relative to boss
    beam: null, // { y, warn, fire, high }
    coins: [],  // projectiles
    minions: [],
    caps, t: 0, shake: 0, flash: 0, grin: 0,
    wallPlats: [], // temporary solid walls that close the arena
    rewardPending: false, defeated: false,
  };
}

function bossPhase() { return Math.min(2, boss ? boss.phase : 0); }
function bossCrankRect() {
  const c = boss.crank;
  return { x: boss.x + c.ox, y: boss.y + c.oy, w: c.w, h: c.h };
}
function resetBossFight() {
  if (!boss) return;
  // Clear fight-only state; keep position / arena / caps
  boss.hp = BOSS_HP; boss.phase = 0; boss.mode = "idle"; boss.modeT = 0; boss.nextAtk = 0;
  boss.beam = null; boss.coins = []; clearBossMinions();
  boss.shake = 0; boss.flash = 0; boss.grin = 0; boss.rewardPending = false; boss.defeated = false; boss.domeBroken = false;
  for (const c of boss.caps) { c.falling = false; delete c.wx; delete c.wy; delete c.vx; delete c.vy; }
  // Remove the temporary walls so the next entry re-locks cleanly
  if (boss.wallPlats.length) {
    platforms = platforms.filter(p => !boss.wallPlats.includes(p));
    boss.wallPlats = [];
  }
  boss.locked = false;
  // Goal stays inactive until a fresh defeat
  if (goal) goal.active = false;
}

function lockBossArena() {
  if (!boss || boss.locked) return;
  boss.locked = true;
  // Solid wall just left of the arena entrance (and a matching right wall past the goal)
  const left = { x: (boss.arenaL / TILE) - 1, y: 0, w: 1, h: GROUND_Y + 1 };
  const right = { x: LEVEL_W - 1, y: 0, w: 1, h: GROUND_Y + 1 };
  boss.wallPlats = [left, right];
  platforms.push(left, right);
  addCallout("GACHA DEMON!", "#ff5ec8");
  sfx.win();
}

function pickBossAttack() {
  // Prefer attacks the player hasn't just seen; escalate mix by phase
  const opts = BOSS_ATTACKS.slice();
  if (boss.lastAtk) {
    const i = opts.indexOf(boss.lastAtk);
    if (i >= 0 && opts.length > 1) opts.splice(i, 1);
  }
  return opts[Math.floor(Math.random() * opts.length)];
}

function beginBossAttack(kind) {
  boss.lastAtk = kind; boss.mode = kind; boss.modeT = 0;
  if (kind === "beam") {
    // Low beam ≈ ankle height (jump over); high beam ≈ jump apex height (stay on ground)
    const high = Math.random() < 0.5;
    const y = high ? GROUND_Y * TILE - 118 : GROUND_Y * TILE - 12;
    boss.beam = { y, high, warn: BOSS_BEAM_WARN, fire: 0, active: false, fireDur: high ? BOSS_BEAM_FIRE : BOSS_BEAM_FIRE_LOW };
    boss.grin = 0.8;
  } else if (kind === "coins") {
    const n = BOSS_COIN_N[bossPhase()];
    boss.coins = [];
    for (let i = 0; i < n; i++) {
      const cx = boss.x + 20, cy = boss.y + 90;
      const tx = player.x + player.w / 2 + (i - (n - 1) / 2) * 50;
      const dx = tx - cx, dy = (GROUND_Y * TILE - 20) - cy;
      // Arc: give an upward launch so travel time is ~0.9–1.1s
      const t = 0.95 + i * 0.08;
      boss.coins.push({ x: cx, y: cy, w: 14, h: 14, vx: dx / t, vy: dy / t - 0.5 * GRAV * t, life: 2.4, spin: Math.random() * 6 });
    }
    boss.grin = 0.6;
  } else if (kind === "minions") {
    clearBossMinions();
    const n = BOSS_MINION_N[bossPhase()];
    const sp = (level && level.diff && level.diff.enemySpeed) || 1;
    const minX = boss.arenaL + 8, maxX = boss.x - 8;
    for (let i = 0; i < n; i++) {
      const hop = i % 2 === 1; // alternate Mini Oni walker / Mochi Slime hopper
      const mxTile = (boss.arenaL + 40 + i * 70) / TILE;
      const e = enemyOnPlat(hop ? "hopper" : "walker", mxTile, GROUND_Y, hop ? 26 : 28, hop ? 26 : 28, {
        vx: (hop ? 40 : 55 + bossPhase() * 10) * sp,
        dir: Math.random() < 0.5 ? -1 : 1,
        minX, maxX,
        hopT: hop ? Math.random() * 0.4 : 0,
        hopEvery: hop ? (0.95 - bossPhase() * 0.08) / sp : 1.1,
        bossMinion: true,
      });
      // Clamp into the arena walk band
      e.x = Math.max(minX, Math.min(maxX - e.w, e.x));
      e.prevX = e.x; e.prevY = e.y;
      enemies.push(e);
      boss.minions.push(e);
    }
    boss.grin = 0.5;
  }
}

function clearBossMinions() {
  if (!boss) return;
  for (const m of boss.minions) { m.alive = false; m.squishT = 99; }
  boss.minions = [];
  // Drop spent boss-minion corpses from the shared enemies list
  enemies = enemies.filter(e => !e.bossMinion);
}

function beginBossVulnerable() {
  boss.mode = "vulnerable"; boss.modeT = 0;
  boss.beam = null;
  boss.flash = BOSS_VULN[bossPhase()];
  addCallout("OUT OF ORDER!", "#ffe66d");
}

function hitBoss() {
  if (!boss || boss.mode !== "vulnerable") return false;
  boss.hp--; boss.phase++;
  boss.shake = 0.7;
  player.vy = STOMP_V_HELD; player.fromStomp = true; player.stompGrace = 0.4;
  player.onGround = false; player.jumpBuf = 0;
  // Nudge off the crank so we don't re-land on the cabinet
  player.vx = (player.x + player.w / 2 < boss.x + boss.w / 2 ? -1 : 1) * 180;
  sfx.stomp();
  spawnParticles(boss.x + boss.w / 2, boss.y + boss.h / 2, "#5ef0ff", 18);
  spawnParticles(boss.x + boss.w / 2, boss.y + 40, "#ffffff", 12);
  clearBossMinions();
  boss.coins = []; boss.beam = null;
  if (boss.hp <= 0) beginBossDefeat();
  else {
    // Stunned recovery: no contact damage / no attacks; cyan-white flash, then idle telegraph
    boss.mode = "stunned"; boss.modeT = 0; boss.flash = BOSS_HIT_STUN; boss.grin = 0;
    addCallout("Gacha jammed! ×" + (BOSS_HP - boss.hp), "#5ef0ff");
  }
  return true;
}

function beginBossDefeat() {
  boss.mode = "defeat"; boss.modeT = 0; boss.defeated = true;
  boss.shake = 2.2; boss.beam = null; boss.coins = [];
  boss.domeBroken = true;
  for (const c of boss.caps) {
    c.falling = true;
    c.wx = boss.x + boss.w / 2 + Math.cos(c.a) * c.r;
    c.wy = boss.y + 50 + Math.sin(c.a * 0.9) * (c.r * 0.55);
    c.vx = (Math.random() - 0.5) * 420;
    c.vy = -220 - Math.random() * 320;
    c.spin = (Math.random() - 0.5) * 10;
  }
  clearBossMinions();
  for (let i = 0; i < 28; i++) {
    spawnParticles(boss.x + 20 + Math.random() * 90, boss.y + 30 + Math.random() * 80,
      ["#ff6ab0", "#7ec8ff", "#ffe66d", "#fff", "#b48cff"][i % 5], 1);
  }
  addCallout("GACHA DEMON DOWN!", "#ffe66d");
  sfx.win();
}

function finishBossDefeat() {
  // Burst the dome; award a guaranteed Rare-or-better pull, then unlock the goal
  for (let i = 0; i < 20; i++) spawnParticles(boss.x + 20 + Math.random() * 90, boss.y + 20 + Math.random() * 60, ["#ff6ab0", "#7ec8ff", "#ffe66d", "#b48cff"][i % 4], 1);
  boss.mode = "done"; boss.rewardPending = true;
  const reward = rollRareOrBetter();
  if (reward) {
    if (slot) slotQueue++;
    else beginSlotRoll(reward);
  } else {
    addCallout("All babes maxed out!", "#ffe66d");
  }
  goal.active = true;
}

function updateBoss(dt) {
  if (!boss) return;
  boss.t += dt;
  if (boss.shake > 0) boss.shake -= dt;
  if (boss.grin > 0) boss.grin -= dt;
  if (boss.flash > 0) boss.flash -= dt;
  for (const c of boss.caps) {
    if (c.falling) {
      c.vy += GRAV * 0.85 * dt; c.wx += c.vx * dt; c.wy += c.vy * dt; c.spin = (c.spin || 0) + dt * 8;
      c.vx *= (1 - 0.4 * dt);
    } else { c.a += c.sp * dt; c.bob += dt * 3; }
  }

  // Lock when the player crosses the arena entrance
  if (!boss.locked && !boss.defeated && player.x + player.w / 2 >= boss.arenaL + 8) lockBossArena();
  if (!boss.locked) return;

  // Camera lock to the arena
  const camMin = boss.arenaL, camMax = Math.max(camMin, boss.arenaR - W);
  cameraX = Math.max(camMin, Math.min(camMax, cameraX));

  // Soft clamp the player inside the walls (walls are solid too)
  if (player.x < boss.arenaL) { player.x = boss.arenaL; if (player.vx < 0) player.vx = 0; }

  // Projectiles
  for (let i = boss.coins.length - 1; i >= 0; i--) {
    const c = boss.coins[i];
    c.vy += GRAV * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.life -= dt; c.spin += dt * 8;
    if (c.life <= 0 || c.y > (LEVEL_H + 2) * TILE) { boss.coins.splice(i, 1); continue; }
    if (aabb(player, c) && invuln <= 0) { hurtPlayer(c.x); boss.coins.splice(i, 1); }
  }

  // Boss minions live in `enemies` (walker/hopper AI + stomp rules). Keep the ref list tidy.
  boss.minions = boss.minions.filter(m => m.alive || (m.squishT != null && m.squishT < ENEMY_SQUISH_SHOW));

  // Beam
  if (boss.beam) {
    const b = boss.beam;
    if (b.warn > 0) { b.warn -= dt; if (b.warn <= 0) { b.active = true; b.fire = b.fireDur != null ? b.fireDur : BOSS_BEAM_FIRE; } }
    else if (b.fire > 0) {
      b.fire -= dt;
      // Hurt if overlapping the beam strip (full arena width, 14 px tall)
      const strip = { x: boss.arenaL, y: b.y, w: boss.arenaR - boss.arenaL, h: 14 };
      if (aabb(player, strip)) hurtPlayer(player.x + player.w / 2);
      if (b.fire <= 0) boss.beam = null;
    }
  }

  // Weak-point stomp while vulnerable
  if (boss.mode === "vulnerable") {
    const crank = bossCrankRect();
    if (aabb(player, crank)) {
      const prevPB = (player.prevY != null ? player.prevY : player.y) + player.h;
      if (prevPB <= crank.y + 10 && player.vy >= 0) hitBoss();
    }
  } else if (boss.mode !== "defeat" && boss.mode !== "done" && boss.mode !== "stunned") {
    // Body contact hurts (not stomping the body — only the crank is a weak point)
    if (aabb(player, boss) && invuln <= 0 && player.stompGrace <= 0) hurtPlayer(boss.x + boss.w / 2);
  }

  // State machine
  boss.modeT += dt;
  const ph = bossPhase();
  if (boss.mode === "idle") {
    if (boss.modeT >= (boss.nextAtk || BOSS_IDLE[ph])) beginBossAttack(pickBossAttack());
  } else if (boss.mode === "beam") {
    if (!boss.beam) beginBossVulnerable();
  } else if (boss.mode === "coins") {
    if (boss.coins.length === 0 && boss.modeT > 0.5) beginBossVulnerable();
  } else if (boss.mode === "minions") {
    // Must clear all spawned minions (long failsafe only)
    const allDead = boss.minions.length === 0 || boss.minions.every(m => !m.alive);
    if ((allDead && boss.modeT > 0.6) || boss.modeT > 45) beginBossVulnerable();
  } else if (boss.mode === "stunned") {
    if (boss.modeT >= BOSS_HIT_STUN) { boss.mode = "idle"; boss.modeT = 0; boss.nextAtk = 0.6; boss.flash = 0; }
  } else if (boss.mode === "vulnerable") {
    if (boss.modeT >= BOSS_VULN[ph]) { boss.mode = "idle"; boss.modeT = 0; boss.nextAtk = 0.3; }
  } else if (boss.mode === "defeat") {
    if (boss.modeT >= 1.6) finishBossDefeat();
  } else if (boss.mode === "done") {
    // Wait for the reward roll to finish, then let the player reach the unlocked goal
  }
}

function drawBoss() {
  if (!boss) return;
  const sk = boss.shake > 0 ? (Math.random() - 0.5) * 10 * Math.min(1, boss.shake) : 0;
  const bx = Math.round(boss.x + sk), by = Math.round(boss.y + sk * 0.4);
  // Body cabinet
  const body = ctx.createLinearGradient(bx, by + 50, bx + boss.w, by + boss.h);
  body.addColorStop(0, "#2a1040"); body.addColorStop(0.5, "#5a1a6a"); body.addColorStop(1, "#1a0a30");
  ctx.fillStyle = body;
  roundRect(bx + 8, by + 48, boss.w - 16, boss.h - 48, 10); ctx.fill();
  ctx.strokeStyle = (boss.mode === "stunned") ? "#5ef0ff" : "#ff5ec8"; ctx.lineWidth = 3;
  roundRect(bx + 8, by + 48, boss.w - 16, boss.h - 48, 10); ctx.stroke();
  if (boss.mode === "stunned") {
    const pulse = 0.25 + 0.2 * Math.abs(Math.sin(boss.t * 14));
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    roundRect(bx + 8, by + 48, boss.w - 16, boss.h - 48, 10); ctx.fill();
    // Smoke while recovering
    for (let i = 0; i < 5; i++) {
      const sx = bx + 24 + i * 20 + Math.sin(boss.t * 4 + i) * 5;
      const sy = by + 36 - ((boss.modeT * 40 + i * 10) % 55);
      ctx.fillStyle = `rgba(200,230,255,${0.4 - i * 0.05})`;
      ctx.beginPath(); ctx.arc(sx, sy, 7 + (i % 3), 0, Math.PI * 2); ctx.fill();
    }
  }
  // Neon trim stripes
  ctx.fillStyle = "#5ef0ff"; ctx.fillRect(bx + 14, by + 56, boss.w - 28, 4);
  ctx.fillStyle = "#ffe66d"; ctx.fillRect(bx + 14, by + boss.h - 18, boss.w - 28, 4);
  // Glass dome (intact) or shattered wreck on defeat
  const dx = bx + boss.w / 2, dy = by + 58, rx = 46, ry = 52;
  const wrecked = !!(boss.domeBroken || boss.mode === "defeat" || boss.mode === "done");
  if (!wrecked) {
    ctx.beginPath(); ctx.ellipse(dx, dy, rx, ry, 0, Math.PI, 0); ctx.closePath();
    ctx.fillStyle = "rgba(180,220,255,0.22)"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.ellipse(dx, dy, rx - 2, ry - 2, 0, Math.PI, 0); ctx.closePath(); ctx.clip();
    for (const c of boss.caps) {
      const px = dx + Math.cos(c.a) * c.r;
      const py = dy - 8 + Math.sin(c.a * 0.9) * (c.r * 0.55) + Math.sin(c.bob) * 3;
      ctx.fillStyle = c.col;
      ctx.beginPath(); ctx.ellipse(px, py, 9, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1; ctx.stroke();
      const babe = babeById(c.id);
      if (babe) drawCard(babe, px - 7.5, py - 10, 15, 20, { iconOnly: true });
    }
    ctx.restore();
  } else {
    ctx.strokeStyle = "rgba(180,220,255,0.55)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(dx, dy + 8, rx, ry * 0.35, 0, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = "rgba(90,40,120,0.5)";
    ctx.beginPath(); ctx.ellipse(dx, dy + 10, rx - 4, 10, 0, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 7; i++) {
      const ang = -Math.PI + (i / 6) * Math.PI;
      const sx = dx + Math.cos(ang) * (20 + i * 4);
      const sy = dy - 10 + Math.sin(ang) * 18 + (i % 3) * 6;
      ctx.fillStyle = `rgba(200,230,255,${0.35 + (i % 3) * 0.1})`;
      ctx.beginPath();
      ctx.moveTo(sx, sy); ctx.lineTo(sx + 10, sy + 14); ctx.lineTo(sx - 8, sy + 12);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(bx + 18, by + 70, boss.w - 36, 8);
    ctx.fillStyle = "#3a2030";
    roundRect(bx + 20, by + 150, 36, 22, 4); ctx.fill();
    for (const c of boss.caps) {
      if (!c.falling || c.wy > GROUND_Y * TILE + 40) continue;
      ctx.save(); ctx.translate(c.wx, c.wy); ctx.rotate(c.spin || 0);
      ctx.fillStyle = c.col;
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1; ctx.stroke();
      const babe = babeById(c.id);
      if (babe) drawCard(babe, -7.5, -10, 15, 20, { iconOnly: true });
      ctx.restore();
    }
  }
  // Demon face (stunned = cyan/white, vulnerable = dim, else hostile red)
  const stunned = boss.mode === "stunned";
  const eyeY = by + 100, eyeOpen = wrecked ? 2 : ((boss.mode === "vulnerable" || stunned) ? 3 : 6);
  ctx.fillStyle = wrecked ? "#442233" : stunned ? "#5ef0ff" : boss.mode === "vulnerable" ? "#888" : "#ff3a5a";
  ctx.beginPath(); ctx.ellipse(bx + 40, eyeY, 8, eyeOpen, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx + boss.w - 40, eyeY, 8, eyeOpen, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffe66d";
  ctx.fillRect(bx + 37, eyeY - 2, 4, 4); ctx.fillRect(bx + boss.w - 43, eyeY - 2, 4, 4);
  // Horns
  ctx.fillStyle = "#b48cff";
  ctx.beginPath(); ctx.moveTo(bx + 22, by + 70); ctx.lineTo(bx + 14, by + 48); ctx.lineTo(bx + 32, by + 62); ctx.fill();
  ctx.beginPath(); ctx.moveTo(bx + boss.w - 22, by + 70); ctx.lineTo(bx + boss.w - 14, by + 48); ctx.lineTo(bx + boss.w - 32, by + 62); ctx.fill();
  // Coin-slot grin
  ctx.fillStyle = "#1a0a20";
  const grinW = 36 + (boss.grin > 0 ? 10 : 0);
  roundRect(bx + boss.w / 2 - grinW / 2, by + 120, grinW, 14, 4); ctx.fill();
  ctx.fillStyle = "#ffe66d";
  for (let i = 0; i < 5; i++) ctx.fillRect(bx + boss.w / 2 - grinW / 2 + 4 + i * 7, by + 123, 3, 8);
  // Stubby arms
  ctx.fillStyle = "#6a2a80";
  roundRect(bx - 6, by + 130, 18, 40, 6); ctx.fill();
  roundRect(bx + boss.w - 12, by + 130, 18, 40, 6); ctx.fill();
  // Crank / weak point
  const cr = bossCrankRect();
  const vuln = boss.mode === "vulnerable";
  const stun = boss.mode === "stunned";
  ctx.fillStyle = stun ? "#ffffff" : vuln ? "#ffe66d" : "#ff5ec8";
  ctx.beginPath(); ctx.arc(cr.x + cr.w / 2 + sk, cr.y + cr.h / 2, cr.w / 2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = vuln ? "#fff" : "#5ef0ff"; ctx.lineWidth = vuln ? 3 : 2; ctx.stroke();
  ctx.fillStyle = "#2a1040";
  ctx.fillRect(cr.x + cr.w / 2 - 3 + sk, cr.y + 4, 6, cr.h - 8);
  ctx.fillRect(cr.x + 4 + sk, cr.y + cr.h / 2 - 3, cr.w - 8, 6);
  if (vuln) {
    ctx.fillStyle = "rgba(255,230,109,0.35)";
    ctx.beginPath(); ctx.arc(cr.x + cr.w / 2 + sk, cr.y + cr.h / 2, cr.w / 2 + 6 + Math.sin(boss.t * 10) * 2, 0, Math.PI * 2); ctx.fill();
    // Smoke puffs
    for (let i = 0; i < 4; i++) {
      const sx = bx + 30 + i * 22 + Math.sin(boss.t * 3 + i) * 4;
      const sy = by + 40 - (boss.modeT * 30 + i * 8) % 50;
      ctx.fillStyle = `rgba(180,180,200,${0.35 - (sy < by ? 0.2 : 0)})`;
      ctx.beginPath(); ctx.arc(sx, sy, 8 + i, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#ffe66d"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("OUT OF ORDER", bx + boss.w / 2, by + 160);
  }
  if (stun) {
    ctx.fillStyle = "#5ef0ff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("STUNNED", bx + boss.w / 2, by + 160);
  }
  // Nameplate
  ctx.fillStyle = "rgba(0,0,0,0.55)"; roundRect(bx + 16, by + boss.h - 36, boss.w - 32, 18, 4); ctx.fill();
  ctx.fillStyle = stun ? "#5ef0ff" : "#ff8ec8"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("GACHA MACHINE DEMON", bx + boss.w / 2, by + boss.h - 23);

  // Beam telegraph / fire
  if (boss.beam) {
    const b = boss.beam;
    if (b.warn > 0) {
      ctx.strokeStyle = `rgba(255,90,200,${0.4 + 0.5 * Math.sin(boss.t * 20)})`;
      ctx.setLineDash([8, 6]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(boss.arenaL, b.y + 7); ctx.lineTo(boss.arenaR, b.y + 7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#ff8ec8"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "left";
      ctx.fillText(b.high ? "↓ STAY LOW" : "↑ JUMP!", boss.arenaL + 12, b.y - 6);
    } else if (b.active) {
      const g = ctx.createLinearGradient(boss.arenaL, b.y, boss.arenaR, b.y);
      g.addColorStop(0, "#ff4ad2"); g.addColorStop(0.5, "#fff"); g.addColorStop(1, "#5ef0ff");
      ctx.fillStyle = g; ctx.fillRect(boss.arenaL, b.y, boss.arenaR - boss.arenaL, 14);
      ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fillRect(boss.arenaL, b.y + 4, boss.arenaR - boss.arenaL, 6);
    }
  }
  // Coin projectiles
  for (const c of boss.coins) {
    ctx.save(); ctx.translate(c.x + 7, c.y + 7); ctx.rotate(c.spin);
    ctx.fillStyle = "#ffe66d"; ctx.beginPath(); ctx.ellipse(0, 0, 7, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#c4a020"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = "#c4a020"; ctx.font = "bold 9px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("¥", 0, 3); ctx.restore();
  }
  // Minions are drawn with the normal enemy pass (Mini Oni / Mochi Slime).
}

function drawBossHud() {
  if (!boss || !boss.locked || boss.mode === "done") return;
  const bw = 320, bh = 18, bx = W / 2 - bw / 2, by = 42;
  ctx.fillStyle = "rgba(0,0,0,0.55)"; roundRect(bx - 4, by - 16, bw + 8, bh + 22, 8); ctx.fill();
  ctx.fillStyle = "#ff8ec8"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("GACHA DEMON", W / 2, by - 3);
  ctx.fillStyle = "rgba(255,255,255,0.15)"; roundRect(bx, by, bw, bh, 6); ctx.fill();
  const pct = Math.max(0, boss.hp / boss.maxHp);
  const hg = ctx.createLinearGradient(bx, by, bx + bw, by);
  hg.addColorStop(0, "#ff4ad2"); hg.addColorStop(1, "#ffe66d");
  ctx.fillStyle = hg; roundRect(bx, by, bw * pct, bh, 6); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1;
  roundRect(bx, by, bw, bh, 6); ctx.stroke();
}


// ---------- Update ----------
function updatePlay(dt) {
  if (player.stun > 0) player.stun -= dt;
  if (player.stompGrace > 0) player.stompGrace -= dt;

  // movement (disabled briefly while stunned so knockback reads)
  if (player.stun <= 0) {
    let move = 0;
    if (keys["arrowleft"] || keys["a"]) move -= 1;
    if (keys["arrowright"] || keys["d"]) move += 1;
    if (move !== 0) {
      player.vx += move * MOVE_ACC * dt;
      player.facing = move;
    } else {
      const fr = FRICTION * dt;
      if (Math.abs(player.vx) <= fr) player.vx = 0;
      else player.vx -= Math.sign(player.vx) * fr;
    }
    player.vx = Math.max(-MOVE_MAX, Math.min(MOVE_MAX, player.vx));

    // jump buffer / coyote
    if (justPressed[" "] || justPressed["arrowup"] || justPressed["w"]) {
      player.jumpBuf = JUMP_BUF;
    }
    if (player.onGround) player.coyote = COYOTE;
    else player.coyote -= dt;
    player.jumpBuf -= dt;

    if (player.jumpBuf > 0 && player.coyote > 0) {
      player.vy = JUMP_V;
      player.onGround = false;
      player.coyote = 0;
      player.jumpBuf = 0;
      sfx.jump();
    }
    // variable jump height — never cut an active stomp bounce until apex
    const jumpHeld = keys[" "] || keys["arrowup"] || keys["w"];
    if (player.fromStomp && player.vy >= 0) player.fromStomp = false;
    if (!jumpHeld && player.vy < 0 && !player.fromStomp) {
      player.vy *= JUMP_CUT;
    }
  } else {
    // Stunned: light air drag only; do not clamp to MOVE_MAX (preserves knockback)
    player.jumpBuf = 0;
    player.coyote = 0;
    player.vx *= (1 - Math.min(1, 1.2 * dt));
  }

  player.vy += GRAV * dt;
  if (player.vy > 900) player.vy = 900;
  resolvePlayer(dt);

  // Pit / cliff: one deliberate full wipe — all hearts gone, lose one card, then checkpoint respawn.
  // Guarded by state !== "play" inside onHeartsZero path (state flips to "dead" immediately) so no multi-trigger.
  if (player.y > (LEVEL_H + 2) * TILE) {
    hearts = 0;
    player.vx = 0;
    player.vy = 0;
    // Park at checkpoint immediately so we are not still "in the pit" next frame
    const cp = checkpoints[checkpointIdx];
    player.x = cp.x;
    player.y = cp.y - player.h;
    sfx.hit();
    onHeartsZero();
    return;
  }

  // checkpoints
  for (let i = checkpointIdx + 1; i < checkpoints.length; i++) {
    if (player.x + player.w/2 >= checkpoints[i].x) checkpointIdx = i;
  }

  // coins (bob + collect; multiple hits while rolling are queued)
  for (const c of coins) {
    if (c.collected) continue;
    c.bob += dt * 3;
    if (aabb(player, c)) {
      c.collected = true;
      spawnParticles(c.x + 8, c.y + 10, "#ffd24a", 8);
      onCoinCollected();
    }
  }

  // enemies — gravity + ledge turns (never float mid-air)
  for (const e of enemies) {
    if (!e.alive) { if (e.squishT != null) e.squishT += dt; continue; }
    e.prevX = e.x;
    e.prevY = e.y;
    e.animT = (e.animT || 0) + dt;

    if (e.type === "flyer") updateFlyer(e, dt);
    else {
    if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
    if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }

    const feetY = e.y + e.h;
    const aheadX = e.dir > 0 ? e.x + e.w - 2 : e.x - 4;
    const aheadTop = platformTopNear(aheadX, 6, feetY);
    if (aheadTop == null || Math.abs(aheadTop - feetY) > 10) e.dir *= -1;

    e.x += e.vx * e.dir * dt;
    if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
    if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }

    e.vy = (e.vy || 0) + GRAV * dt * (e.type === "hopper" ? 0.85 : 1);
    e.y += e.vy * dt;

    const top = platformTopNear(e.x, e.w, e.y + e.h);
    const onGround = top != null && (e.y + e.h) >= top - 1 && (e.y + e.h) <= top + 18 && e.vy >= 0;
    if (e.type === "hopper") {
      if (onGround && !e.grounded) e.landT = SLIME_LAND; // just touched down → brief squash
      if (e.landT > 0) e.landT -= dt;
      e.grounded = onGround;
    }
    if (onGround) {
      e.y = top - e.h;
      e.vy = 0;
      if (e.type === "hopper") {
        e.hopT = (e.hopT || 0) + dt;
        if (e.hopT > (e.hopEvery || 1.1)) { e.vy = -520; e.hopT = 0; }
      }
    }
    } // walker / hopper

    if (!aabb(player, e)) continue;

    // Stomp if player was/is above (prev feet vs prev enemy top), even if enemy jumps up
    const STOMP_TOL = 8;
    const prevPlayerBottom = (player.prevY != null ? player.prevY : player.y) + player.h;
    const prevEnemyTop = e.prevY != null ? e.prevY : e.y;
    const fromAbove = prevPlayerBottom <= prevEnemyTop + STOMP_TOL;
    // Vertical-dominant overlap with player clearly above (hopper jump-into-feet)
    const playerAbove = player.y + player.h <= e.y + e.h * 0.55 && player.y < e.y;
    const stomping = fromAbove || playerAbove;

    if (stomping) {
      e.alive = false;
      e.squishT = 0; // show the squished frame briefly
      player.y = e.y - player.h;
      player.onGround = false;
      const jumpHeld = keys[" "] || keys["arrowup"] || keys["w"];
      player.vy = jumpHeld ? STOMP_V_HELD : STOMP_V;
      player.stompGrace = 0.12;
      player.fromStomp = true;
      player.jumpBuf = 0;
      sfx.stomp();
      spawnParticles(e.x + e.w/2, e.y + e.h/2, e.type === "hopper" ? "#7dff9a" : e.type === "flyer" ? "#b48cff" : "#ff8a5b", 12);
    } else {
      hurtPlayer(e.x + e.w/2);
    }
  }

  player.prevY = player.y;
  player.prevX = player.x;

  // Boss (Level 3) — runs before the camera so it can lock the view
  if (boss) updateBoss(dt);

  // goal (boss levels keep it inactive until the fight is won)
  if (goal.active !== false && aabb(player, goal)) {
    state = "win";
    const final = levelNum >= LEVELS.length;
    if (final) { progress.level = 1; progress.beatGame = true; }
    else progress.level = levelNum + 1; // next session picks up at the next level
    saveProgress(progress);
    winStats = {
      level: levelNum, final,
      unique: ownedUniqueCount(collection),
      total: totalPulls(collection),
      coins: coins.filter(c => c.collected).length,
      coinsMax: coins.length,
      gained: runGained.slice(),
    };
    sfx.win();
  }

  if (invuln > 0) invuln -= dt;
  if (player.flash > 0) player.flash -= dt;
  player.anim += dt * (Math.abs(player.vx) > 20 ? 10 : 4);

  // camera (boss lock overrides the follow when the arena is sealed)
  if (!(boss && boss.locked && !boss.defeated)) {
    const target = player.x - W * 0.38;
    cameraX += (target - cameraX) * Math.min(1, 6 * dt);
    cameraX = Math.max(0, Math.min(cameraX, LEVEL_W * TILE - W));
  } else {
    const camMin = boss.arenaL, camMax = Math.max(camMin, boss.arenaR - W);
    cameraX = Math.max(camMin, Math.min(camMax, cameraX));
  }
}

// Flyer: horizontal patrol + sine bob. When the player is near and below it hovers in place for a
// short tell (fast flap, red eyes), dives gently toward them (never below head height on its floor),
// holds, rises back and cools down. Stomp from above = kill + bounce; any other touch hurts.
function updateFlyer(e, dt) {
  e.t += dt;
  e.flap += dt * (e.mode === "tell" ? 22 : 9);
  const pcx = player.x + player.w / 2, ecx = e.x + e.w / 2;
  const near = Math.abs(pcx - ecx) < FLY_RANGE && player.y + player.h / 2 > e.y + e.h / 2 && hearts > 0;
  if (e.cool > 0) e.cool -= dt;
  e.modeT += dt;
  if (e.mode === "patrol") { if (near && e.cool <= 0) { e.mode = "tell"; e.modeT = 0; } }
  else if (e.mode === "tell") { if (e.modeT >= FLY_TELL) { e.mode = "dive"; e.modeT = 0; } }
  else if (e.mode === "dive") { if (e.swoop >= FLY_SWOOP - 0.5 || (!near && e.modeT > 0.3)) { e.mode = "hold"; e.modeT = 0; } }
  else if (e.mode === "hold") { if (e.modeT >= FLY_HOLD) { e.mode = "rise"; e.modeT = 0; } }
  else if (e.mode === "rise") { if (e.swoop <= 0.5) { e.swoop = 0; e.mode = "patrol"; e.cool = FLY_COOL; } }
  const diving = e.mode === "dive" || e.mode === "hold";
  const want = diving ? Math.min(FLY_SWOOP, Math.max(0, (player.y + player.h / 2) - (e.baseY + e.h / 2))) : 0;
  const rate = e.mode === "dive" ? FLY_DIVE_V : FLY_RISE_V;
  e.swoop += Math.sign(want - e.swoop) * Math.min(Math.abs(want - e.swoop), rate * dt);
  let vx = e.vx * e.dir;
  if (e.mode === "tell") vx = 0;
  else if (diving) { const d = pcx - ecx; vx = Math.sign(d) * Math.min(e.vx, Math.abs(d) * 3); if (d) e.dir = Math.sign(d); }
  e.x += vx * dt;
  if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
  if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }
  e.y = e.baseY + Math.sin(e.t * 2.4) * FLY_BOB + e.swoop;
  e.vy = dt > 0 ? (e.y - e.prevY) / dt : 0;
}

// 13x10 pixel bat-drone, 2 flap frames (2px per pixel). W wing, w wing edge, B body, b belly, E eye, F fang
const FLYER_FRAMES = [
  ["w...........w",
   "Ww.........wW",
   "WWw.BBBBB.wWW",
   ".WWBBBBBBBWW.",
   "..BBEBBBEBB..",
   "..BBBbbbBBB..",
   "...BBbbbBB...",
   "....BFBFB....",
   ".............",
   "............."],
  [".............",
   ".............",
   "....BBBBB....",
   "...BBBBBBB...",
   ".wBBEBBBEBBw.",
   "WWBBBbbbBBBWW",
   "Ww.BBbbbBB.wW",
   "w...BFBFB...w",
   ".............",
   "............."],
];
// Frame for the walker (oni) / hopper (slime) from its current state
function enemyFrame(e) {
  const t = e.animT || 0;
  if (e.type === "walker") {
    const sp = (level && level.diff.enemySpeed) || 1;
    if (Math.abs(e.vx) > 5) return "oni_walk_" + (Math.floor(t / (ONI_WALK_FRAME / sp)) % 4);
    return "oni_idle_" + (Math.floor(t / ONI_IDLE_FRAME) % 2);
  }
  // hopper
  if (e.grounded) {
    if ((e.landT || 0) > 0 || (e.hopT || 0) > (e.hopEvery || 1.1) - SLIME_PREHOP) return "slime_squash";
    return "slime_idle_" + (Math.floor(t / SLIME_IDLE_FRAME) % 2);
  }
  if (e.vy < -50) return "slime_rise";
  return "slime_fall";
}
function drawEnemySprite(e, name) {
  const im = ENEMY_IMG[name];
  if (!imgOk(im)) return false;
  const dx = Math.round(e.x + e.w / 2 - 16), dy = Math.round(e.y + e.h - 32);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (e.dir < 0) { ctx.translate(dx + 32, dy); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0, 32, 32); }
  else ctx.drawImage(im, dx, dy, 32, 32);
  ctx.restore();
  return true;
}

function drawFlyer(e) {
  const tell = e.mode === "tell";
  const pal = { W: "#5a3fb0", w: "#c3adff", B: "#8f6cf2", b: "#c9b8ff", E: tell ? "#ff4a6a" : "#5fe8ff", F: "#ffffff" };
  const frame = FLYER_FRAMES[Math.floor(e.flap) % 2];
  const shake = tell ? (Math.floor(e.modeT * 40) % 2 ? 1 : -1) : 0;
  const ox = Math.round(e.x) + shake, oy = Math.round(e.y);
  for (let r = 0; r < frame.length; r++) {
    const row = frame[r];
    for (let c = 0; c < row.length; c++) {
      const col = pal[row[c]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(ox + c * 2, oy + r * 2, 2, 2);
    }
  }
}

function updateSlot(dt) {
  if (!slot) return;
  if (!slot.done) {
    slot.elapsed += dt;
    const t = Math.min(1, slot.elapsed / slot.duration);
    // Ease-out cubic on POSITION so we land exactly on targetIndex (the pre-planted result)
    const ease = 1 - Math.pow(1 - t, 3);
    const prev = Math.floor(slot.offset + 1e-9);
    slot.offset = slot.startOffset + (slot.targetIndex - slot.startOffset) * ease;
    if (Math.floor(slot.offset + 1e-9) !== prev) sfx.tick();
    if (t >= 1) {
      slot.offset = slot.targetIndex;
      slot.done = true;
      slot.revealT = 0;
    }
  } else {
    slot.revealT += dt;
    if (slot.revealT > 0.275) finishSlot(); // half of previous 0.55s reveal hold
  }
}

function updateDead(dt) {
  if (!loseAnim) { state = "play"; resetAfterDeath(); return; }
  loseAnim.t += dt;
  if (loseAnim.t >= loseAnim.dur) {
    loseAnim = null;
    resetAfterDeath();
    state = "play";
  }
}

function resetAfterDeath() {
  hearts = 3;
  invuln = 1.5;
  deathCry = null;
  stopDeathCry();
  const cp = checkpoints[checkpointIdx];
  player.x = cp.x; player.y = cp.y - player.h;
  player.vx = 0; player.vy = 0;
  player.stun = 0;
  player.stompGrace = 0;
  player.fromStomp = false;
  player.prevX = player.x; player.prevY = player.y;
  syncRecent(); // a babe lost down to 0 leaves the tray now
  // Respawn coins AND enemies at original positions/state (same as level start)
  coins = makeCoins();
  enemies = makeEnemies();
  // Boss fight: reset HP / clear minions & coins; player is already parked at the arena entrance CP
  if (boss) resetBossFight();
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 600*dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = callouts.length - 1; i >= 0; i--) {
    callouts[i].t += dt;
    if (callouts[i].t >= callouts[i].dur) callouts.splice(i, 1);
  }
  // Layout: newest on top, older ones stacked beneath; ease toward target slot
  const baseY = calloutBaseY();
  for (let i = callouts.length - 1, k = 0; i >= 0; i--, k++) {
    const c = callouts[i];
    const ty = baseY + k * (CALLOUT_H + CALLOUT_GAP);
    c.y = c.y == null ? ty : c.y + (ty - c.y) * Math.min(1, 12 * dt);
  }
}

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------- Draw ----------
function drawBackground() {
  // sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const th = (level && level.theme) || LEVEL_THEMES.dusk;
  g.addColorStop(0, th.sky[0]);
  g.addColorStop(0.5, th.sky[1]);
  g.addColorStop(1, th.sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Neon city-pop skyline (Level 3) — drawn behind the hills as a far parallax layer
  if (th.neon) {
    const px = cameraX * 0.25;
    const signs = th.signs || ["#ff4ad2", "#5ef0ff", "#ffe66d"];
    for (let i = -1; i < 14; i++) {
      const bx = ((i * 110 - px) % (W + 220) + W + 220) % (W + 220) - 80;
      const bh = 60 + (i * 37) % 90, by = H - 130 - bh;
      ctx.fillStyle = "#1a0a28"; ctx.fillRect(bx, by, 70, bh + 40);
      // Windows
      for (let wy = by + 8; wy < by + bh; wy += 14)
        for (let wx = bx + 8; wx < bx + 60; wx += 14) {
          const on = ((Math.floor(performance.now() / 400) + i * 3 + wx) % 7) !== 0;
          ctx.fillStyle = on ? signs[(i + wx) % signs.length] : "#2a1538";
          ctx.globalAlpha = on ? 0.85 : 0.35;
          ctx.fillRect(wx, wy, 8, 8);
        }
      ctx.globalAlpha = 1;
      // Blinking rooftop sign
      if ((i + Math.floor(performance.now() / 350)) % 5 !== 0) {
        ctx.fillStyle = signs[i % signs.length];
        ctx.fillRect(bx + 10, by - 10, 40, 8);
        ctx.fillStyle = "#fff"; ctx.font = "bold 7px sans-serif"; ctx.textAlign = "left";
        ctx.fillText(["LOVE", "NEON", "POP", "GACHA", "CITY"][i % 5], bx + 12, by - 3);
      }
    }
  }

  // parallax hills
  ctx.fillStyle = th.hills;
  for (let i = 0; i < 8; i++) {
    const hx = ((i * 280) - cameraX * 0.2) % (W + 300) - 80;
    ctx.beginPath();
    ctx.ellipse(hx + 120, H - 40, 160, 70, 0, 0, Math.PI*2);
    ctx.fill();
  }
  // stars
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  for (let i = 0; i < 40; i++) {
    const sx = ((i * 97) * 13 - cameraX * 0.05) % W;
    const sy = (i * 37) % (H * 0.55);
    ctx.fillRect(sx, sy, 2, 2);
  }
}

function drawWorld() {
  ctx.save();
  ctx.translate(-Math.floor(cameraX), 0);

  // platforms (only those on screen — levels are ~3x longer now)
  const th = level.theme;
  const viewL = cameraX - 64, viewR = cameraX + W + 64;
  for (const p of platforms) {
    const x = p.x*TILE, y = p.y*TILE, w = p.w*TILE, h = p.h*TILE;
    if (x + w < viewL || x > viewR) continue;
    // dirt body
    ctx.fillStyle = th.dirt;
    ctx.fillRect(x, y, w, h);
    // grass top
    ctx.fillStyle = th.grass;
    ctx.fillRect(x, y, w, 8);
    // pixel edge
    ctx.fillStyle = th.edge;
    for (let i = 0; i < w; i += 8) ctx.fillRect(x + i, y + 8, 6, 3);
    // bricks hint on tall
    if (h > TILE) {
      ctx.fillStyle = "rgba(0,0,0,0.15)";
      for (let ty = y + TILE; ty < y + h; ty += TILE) {
        ctx.fillRect(x, ty, w, 2);
        for (let tx = x; tx < x + w; tx += TILE) ctx.fillRect(tx, ty, 2, TILE);
      }
    }
  }

  // checkpoints flags
  for (let i = 0; i < checkpoints.length; i++) {
    const c = checkpoints[i];
    const active = i <= checkpointIdx;
    ctx.fillStyle = "#ddd";
    ctx.fillRect(c.x, c.y - 48, 4, 48);
    ctx.fillStyle = active ? "#ff5a9a" : "#888";
    ctx.beginPath();
    ctx.moveTo(c.x + 4, c.y - 48);
    ctx.lineTo(c.x + 28, c.y - 36);
    ctx.lineTo(c.x + 4, c.y - 24);
    ctx.fill();
  }

  // coins — mystery cardback (Iris A5), bob + sparkle
  for (const c of coins) {
    if (c.collected || c.x + c.w < viewL || c.x > viewR) continue;
    const by = c.y + Math.sin(c.bob) * 4;
    const cx = Math.floor(c.x), cy = Math.floor(by);
    const cw = Math.floor(c.w), ch = Math.floor(c.h);
    const back = cardImgs.mystery.sm || cardImgs.mystery.md;
    if (!drawCardBitmap(back, cx, cy, cw, ch, false)) {
      const g = ctx.createLinearGradient(cx, cy, cx, cy + ch);
      g.addColorStop(0, "#6b3a8a");
      g.addColorStop(1, "#2a1040");
      roundRect(cx, cy, cw, ch, 3);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.fillStyle = "#ffd24a";
      ctx.font = "bold 9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("?", cx + cw / 2, cy + ch / 2 + 3);
    }
    // sparkle
    const sp = (Math.sin(c.bob * 2) + 1) * 0.5;
    ctx.globalAlpha = 0.35 + sp * 0.55;
    ctx.fillStyle = "#fff";
    ctx.fillRect(cx + cw - 4, cy + 2, 2, 2);
    ctx.fillRect(cx + 2, cy + ch * 0.4, 2, 2);
    ctx.globalAlpha = 1;
  }

  // enemies
  for (const e of enemies) {
    if (e.x + e.w < viewL || e.x > viewR) continue;
    if (!e.alive) {
      if (e.squishT != null && e.squishT < ENEMY_SQUISH_SHOW && e.type !== "flyer")
        drawEnemySprite(e, e.type === "walker" ? "oni_squished" : "slime_squished");
      continue;
    }
    if (e.type === "flyer") {
      drawFlyer(e);
    } else if (drawEnemySprite(e, enemyFrame(e))) {
      // sprite drawn
    } else if (e.type === "walker") {
      ctx.fillStyle = "#e85d4c";
      roundRect(e.x, e.y, e.w, e.h, 4);
      ctx.fill();
      // eyes
      ctx.fillStyle = "#fff";
      ctx.fillRect(e.x + 6 + (e.dir>0?8:0), e.y + 8, 6, 6);
      ctx.fillRect(e.x + 16 + (e.dir>0?8:0), e.y + 8, 6, 6);
      ctx.fillStyle = "#111";
      ctx.fillRect(e.x + 8 + (e.dir>0?8:0), e.y + 10, 3, 3);
      ctx.fillRect(e.x + 18 + (e.dir>0?8:0), e.y + 10, 3, 3);
      // feet
      ctx.fillStyle = "#a03028";
      ctx.fillRect(e.x + 2, e.y + e.h - 4, 8, 4);
      ctx.fillRect(e.x + e.w - 10, e.y + e.h - 4, 8, 4);
    } else {
      // hopper — green blob with spring
      ctx.fillStyle = "#5dcf6a";
      ctx.beginPath();
      ctx.ellipse(e.x + e.w/2, e.y + e.h/2, e.w/2, e.h/2 * (e.vy < -50 ? 1.15 : 0.9), 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(e.x + 8, e.y + 10, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x + 18, e.y + 10, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#111";
      ctx.fillRect(e.x + 8, e.y + 10, 3, 3);
      ctx.fillRect(e.x + 18, e.y + 10, 3, 3);
    }
  }

  // Neon rooftop props (AC units + water tanks) along the ground
  if (level && level.theme && level.theme.neon) {
    for (let tx = Math.floor(viewL / TILE); tx < Math.ceil(viewR / TILE); tx++) {
      if (tx % 7 === 3) {
        const x = tx * TILE + 4, y = GROUND_Y * TILE - 18;
        ctx.fillStyle = "#4a3a60"; ctx.fillRect(x, y, 22, 18);
        ctx.fillStyle = "#5ef0ff"; ctx.fillRect(x + 3, y + 3, 6, 4); ctx.fillRect(x + 12, y + 3, 6, 4);
      } else if (tx % 11 === 5) {
        const x = tx * TILE + 6, y = GROUND_Y * TILE - 28;
        ctx.fillStyle = "#6a7a90"; ctx.beginPath(); ctx.arc(x + 12, y + 14, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#8aa0b8"; ctx.fillRect(x + 8, y - 4, 8, 10);
      }
    }
  }

  // Boss
  if (boss) drawBoss();

  // goal flag (hidden until active on boss levels)
  if (goal.active === false) { /* sealed until the demon falls */ }
  else {
  ctx.fillStyle = "#eee";
  ctx.fillRect(goal.x, goal.y, 5, goal.h);
  ctx.fillStyle = "#ffd24a";
  ctx.beginPath();
  ctx.moveTo(goal.x + 5, goal.y);
  ctx.lineTo(goal.x + 40, goal.y + 16);
  ctx.lineTo(goal.x + 5, goal.y + 32);
  ctx.fill();
  ctx.fillStyle = "#ff5a9a";
  ctx.beginPath();
  ctx.arc(goal.x + 2, goal.y, 6, 0, Math.PI*2);
  ctx.fill();
  }

  // player (pixel hero or fallback shapes)
  drawPlayer();

  // particles in world space
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}


// Bottom-right mini tray: only owned babes, newest acquisition on the right, at most 5.
function drawHudLiveBabes() {
  if (state !== "play" && state !== "dead" && state !== "dying") return;
  const lostId = state === "dead" && loseAnim ? loseAnim.lostId : null;
  // newest-first, owned (keep a just-lost babe visible during the Ouch screen for her X)
  const recent = recentBabes.filter(id => (collection[id] || 0) > 0 || id === lostId).slice(0, HUD_SLOTS);
  const list = recent.slice().reverse().map(babeById).filter(Boolean); // oldest → newest (left → right)
  const n = list.length;
  const cw = HUD_CW, ch = cardHeight(cw), gap = HUD_GAP;
  const pad = 8, counterH = 16;
  const unique = ownedUniqueCount(collection);
  const label = "Babes " + unique + "/" + BABE_POOL.length;
  ctx.font = "bold 11px sans-serif";
  const cardsW = n ? n * cw + (n - 1) * gap : 0;
  const panelW = pad * 2 + Math.max(cardsW, Math.ceil(ctx.measureText(label).width));
  const panelH = pad + counterH + (n ? ch + pad : 0);
  const margin = 10;
  // Touch: lift tray above on-screen jump; portrait needs less canvas-space lift (letterbox absorbs chrome)
  const portrait = window.innerHeight > window.innerWidth;
  const lift = isTouch ? (portrait ? 78 : 130) : 18;
  const panelX = W - panelW - margin;
  const panelY = H - panelH - lift - (n ? 0 : ch + pad);
  const step = cw + gap;

  ctx.save();
  ctx.globalAlpha = 0.78;
  ctx.fillStyle = "rgba(12,8,22,0.78)";
  roundRect(panelX, panelY, panelW, panelH, 8);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,90,154,0.45)";
  ctx.lineWidth = 1.5;
  roundRect(panelX, panelY, panelW, panelH, 8);
  ctx.stroke();
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = "#ffb0d0";
  ctx.textAlign = "left";
  ctx.fillText(label, panelX + pad, panelY + 13);

  if (n) {
    const viewX = panelX + panelW - pad - cardsW; // right-aligned
    const viewY = panelY + pad + counterH;
    ctx.save();
    ctx.beginPath();
    ctx.rect(panelX + 2, viewY - 2, panelW - 4, ch + 4);
    ctx.clip();
    const slide = step * Math.max(0, 1 - (performance.now() - (hudTray.slideAt || -1e9)) / 200);
    for (let i = 0; i < n; i++) {
      const babe = list[i];
      const isNewest = i === n - 1;
      const x = viewX + i * step + slide;
      const y = viewY;
      const count = collection[babe.id] || 0;
      const isLost = babe.id === lostId;
      ctx.globalAlpha = isNewest && slide > 0 ? 0.95 * (1 - slide / step) : 0.95;
      if (isLost) {
        const displayCount = count > 0 ? count : (loseAnim.lostPrevCount > 1 ? loseAnim.lostPrevCount - 1 : null);
        drawCard(babe, x, y, cw, ch, { iconOnly: true, count: displayCount && displayCount > 1 ? displayCount : null });
        drawLostBabeX(x, y, cw, ch, loseAnim.t);
      } else {
        // 15x20 face crops (nearest-neighbour), dupe count, no MAX tag in the tray
        drawCard(babe, x, y, cw, ch, { iconOnly: true, count: count > 1 ? count : null });
      }
      if (hudTray.highlightId === babe.id && hudTray.highlightT > 0) {
        const pulse = 0.5 + 0.5 * Math.sin((0.55 - hudTray.highlightT) * 20);
        ctx.strokeStyle = `rgba(255,230,109,${0.55 + 0.45 * pulse})`;
        ctx.lineWidth = 2;
        roundRect(x - 1, y - 1, cw + 2, ch + 2, 5);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawSlot() {
  // Overlay only — no screen dimming; world keeps rendering underneath
  // Panel height is 70% of the original 150px; cards scale uniformly (3:4)
  const panelY = SLOT_PANEL_Y;
  const panelH = SLOT_PANEL_H; // 105
  const scale = 0.7;
  ctx.fillStyle = "rgba(20,10,30,0.92)";
  roundRect(40, panelY, W - 80, panelH, 12);
  ctx.fill();
  ctx.strokeStyle = "#ff5a9a";
  ctx.lineWidth = 2.5;
  roundRect(40, panelY, W - 80, panelH, 12);
  ctx.stroke();

  ctx.fillStyle = "#ffb0d0";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(slot.done ? "★ YOU GOT ★" : "✦ ROLLING… ✦", W/2, panelY + 18);

  if (slotQueue > 0) {
    ctx.fillStyle = "#ffe66d";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("Queue +" + slotQueue, W - 56, panelY + 18);
  }

  // card window — width derived from height via CARD_ASPECT
  const cw = 72 * scale;           // 50.4
  const ch = cardHeight(cw);       // exact 3:4
  const gap = 14 * scale;
  const centerX = W/2;
  const cy = panelY + 26;
  const viewW = cw * 5 + gap * 4;
  const vx = centerX - viewW/2;

  ctx.save();
  ctx.beginPath();
  ctx.rect(vx - 3, cy - 3, viewW + 6, ch + 6);
  ctx.clip();

  const base = slot.offset;
  for (let i = -3; i <= 3; i++) {
    const idx = Math.floor(base) + i;
    if (idx < 0 || idx >= slot.strip.length) continue;
    const frac = base - Math.floor(base);
    const cx = centerX + (i - frac) * (cw + gap) - cw/2;
    const char = slot.strip[idx];
    drawCard(char, cx, cy, cw, ch, { glow: slot.done && idx === slot.targetIndex ? 1 : 0 });
  }
  ctx.restore();

  // center highlight frame
  ctx.strokeStyle = "#ffe66d";
  ctx.lineWidth = 2.5;
  roundRect(centerX - cw/2 - 3, cy - 3, cw + 6, ch + 6, 8);
  ctx.stroke();

  if (slot.done) {
    const rar = rarityOf(slot.result.id);
    ctx.fillStyle = rar.color;
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(slot.result.name + " — " + rar.label, W/2, panelY + panelH - 8);
  }
}

function sortedBabeList() {
  return BABE_POOL.slice().sort((a, b) => {
    const rd = rarityRank(a.id) - rarityRank(b.id);
    if (rd !== 0) return rd;
    return a.name.localeCompare(b.name);
  });
}

function focusHudOnBabe(id) {
  if (!id) return;
  hudTray.highlightId = id;
  hudTray.highlightT = 0.55;

  if (hudTray.highlightT > 0) hudTray.highlightT -= dt;

function galleryFilteredList() {
  let list = BABE_POOL.slice();
  const f = gallery.filter;
  if (f === "owned") list = list.filter(b => (collection[b.id] || 0) > 0);
  else if (f === "missing") list = list.filter(b => !(collection[b.id] > 0));
  else if (f === "common" || f === "rare" || f === "ultra") {
    list = list.filter(b => b.rarity === f);
  }
  list.sort((a, b) => {
    const rd = rarityRank(a.id) - rarityRank(b.id);
    if (rd !== 0) return rd;
    return a.name.localeCompare(b.name);
  });
  return list;
}

function galleryResetBtn() {
  // Top-right of the gallery — only reset entry point (P key removed)
  return { x: W - 168, y: 12, w: 150, h: 36 };
}
function handleGalleryClick(sx, sy) {
  // Reset-confirm popup buttons (mobile) take priority over the gallery underneath
  if (resetConfirm) {
    const L = resetConfirmLayout();
    const hit = (b) => sx >= b.x && sx <= b.x + b.w && sy >= b.y && sy <= b.y + b.h;
    if (hit(L.resetBtn)) confirmResetCollection();
    else if (hit(L.cancelBtn)) cancelResetConfirm();
    return;
  }
  // Gallery "Reset" button
  const rb = galleryResetBtn();
  if (sx >= rb.x && sx <= rb.x + rb.w && sy >= rb.y && sy <= rb.y + rb.h) {
    openResetConfirm();
    return;
  }
  // Filter tabs
  const tabY = 56, tabH = 28, tabGap = 6;
  const labels = GALLERY_FILTERS;
  let tx = 40;
  for (const lab of labels) {
    const label = galleryFilterLabel(lab);
    ctx.font = "bold 11px sans-serif";
    const tw = Math.max(54, ctx.measureText(label).width + 16);
    if (sx >= tx && sx <= tx + tw && sy >= tabY && sy <= tabY + tabH) {
      gallery.filter = lab;
      gallery.scroll = 0;
      gallery.selected = null;
      return;
    }
    tx += tw + tabGap;
  }
  // Page buttons
  if (sx >= W - 120 && sx <= W - 70 && sy >= H - 42 && sy <= H - 14) {
    gallery.scroll = Math.max(0, gallery.scroll - 160);
    return;
  }
  if (sx >= W - 60 && sx <= W - 10 && sy >= H - 42 && sy <= H - 14) {
    gallery.scroll += 160;
    return;
  }
  // Detail close
  if (gallery.selected) {
    if (sx >= W / 2 - 40 && sx <= W / 2 + 40 && sy >= H - 50 && sy <= H - 22) {
      gallery.selected = null;
      return;
    }
  }
  // Grid hit
  const list = galleryFilteredList();
  const cols = 5;
  const cw = 100, ch = cardHeight(cw), gapX = 16, gapY = 14;
  const gridW = cols * cw + (cols - 1) * gapX;
  const startX = (W - gridW) / 2;
  const startY = 100 - gallery.scroll;
  for (let i = 0; i < list.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = startX + col * (cw + gapX);
    const y = startY + row * (ch + gapY);
    if (sx >= x && sx <= x + cw && sy >= y && sy <= y + ch) {
      gallery.selected = list[i].id;
      return;
    }
  }
}

function updateGalleryInput() {
  if (justPressed["arrowleft"] || justPressed["a"]) gallery.scroll = Math.max(0, gallery.scroll - 120);
  if (justPressed["arrowright"] || justPressed["d"]) gallery.scroll += 120;
  if (justPressed["arrowup"] || justPressed["w"]) gallery.scroll = Math.max(0, gallery.scroll - 80);
  if (justPressed["arrowdown"] || justPressed["s"]) gallery.scroll += 80;
  if (justPressed["pageup"]) gallery.scroll = Math.max(0, gallery.scroll - 220);
  if (justPressed["pagedown"]) gallery.scroll += 220;
  // number keys 1-7 for filters
  for (let i = 0; i < GALLERY_FILTERS.length; i++) {
    if (justPressed[String(i + 1)]) {
      gallery.filter = GALLERY_FILTERS[i];
      gallery.scroll = 0;
      gallery.selected = null;
    }
  }
  if (justPressed["escape"] && gallery.selected) {
    gallery.selected = null;
    justPressed["escape"] = false; // consume so we don't close gallery
  }
}
