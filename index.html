<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ff5a9a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='32' fill='white'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<title>Hot Babe Collector — Big Salty Gaming Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1020;
    font-family: "Segoe UI", system-ui, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;

    inset: 0;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #120818;
  }
  canvas#game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;

  #touch {
    display: none;
    position: absolute;
    inset: 0;

  #touch.show { display: block; }
  .tbtn {
    position: absolute;
    pointer-events: auto;

    border: 3px solid rgba(255,255,255,0.30); /* ~70% transparent outline */
    color: rgba(255,255,255,0.30); /* ~70% transparent glyph */

    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: none;

    user-select: none;

    background: rgba(255,120,180,0.28);
    border-color: rgba(255,255,255,0.45);
    color: rgba(255,255,255,0.55);

  #tLeft  { left: max(16px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom)); }

    touch-action: none;

<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="touch">
    <button type="button" class="tbtn" id="tLeft" aria-label="Left">◀</button>
    <button type="button" class="tbtn" id="tRight" aria-label="Right">▶</button>

  </div>
  <button type="button" id="fsBtn" aria-label="Fullscreen">⛶ Full</button>
  <div id="rotateHint">
    <h2>Rotate your phone</h2>
    <p>Hot Babe Collector plays best in landscape. Rotate for bigger controls — or tap below to play in portrait anyway.</p>
    <button type="button" id="playPortrait">Play in portrait</button>

<script>
"use strict";

// ============================================================
// Hot Babe Collector — Big Salty Gaming Studio
// Prototype: self-contained Canvas 2D platformer
// ============================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

// ---------- Tiny WebAudio SFX (no files) ----------
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function ensureAudio() {
  if (!actx) actx = new AudioCtx();
  if (actx.state === "suspended") actx.resume();
}
function beep(freq, dur, type, vol, slide) {
  try {
    ensureAudio();
    const t0 = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (_) {}
}
const sfx = {
  jump:  () => beep(420, 0.12, "square", 0.07, 280),
  coin:  () => { beep(880, 0.08, "square", 0.06); setTimeout(() => beep(1175, 0.12, "square", 0.05), 60); },
  tick:  () => beep(600 + Math.random() * 400, 0.03, "triangle", 0.035),
  hit:   () => beep(160, 0.25, "sawtooth", 0.09, 60),
  stomp: () => beep(200, 0.1, "square", 0.07, 80),
  lose:  () => { beep(300, 0.2, "sawtooth", 0.08, 100); setTimeout(() => beep(150, 0.3, "sawtooth", 0.07, 50), 180); },
  win:   () => { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.18, "square", 0.06), i*120)); },
  new:   () => { beep(700, 0.1, "square", 0.06); setTimeout(() => beep(1050, 0.2, "square", 0.06), 100); },
};

// ---------- Babe pool (data-driven; grow by appending entries) ----------
const RARITIES = [
  { id: "common",    label: "Common",    color: "#9aa0a6", weight: 50, order: 0 },
  { id: "rare",      label: "Rare",      color: "#4ea1ff", weight: 28, order: 1 },
  { id: "epic",      label: "Epic",      color: "#c06bff", weight: 15, order: 2 },
  { id: "legendary", label: "Legendary", color: "#ffb020", weight: 7,  order: 3 },
];
const RARITY_ORDER = Object.fromEntries(RARITIES.map(r => [r.id, r.order]));

// Placeholder babe defs: { id, name, rarity, hue, shape } — art hooks later via optional `art`
const BABE_POOL = [
  // Original 12
  { id: "ruby",    name: "Ruby",    rarity: "common",    hue: 0,   shape: "hourglass" },
  { id: "luna",    name: "Luna",    rarity: "common",    hue: 220, shape: "star" },
  { id: "jade",    name: "Jade",    rarity: "common",    hue: 140, shape: "diamond" },
  { id: "nova",    name: "Nova",    rarity: "common",    hue: 40,  shape: "circle" },
  { id: "kira",    name: "Kira",    rarity: "rare",      hue: 300, shape: "heart" },
  { id: "mira",    name: "Mira",    rarity: "rare",      hue: 180, shape: "hourglass" },
  { id: "suki",    name: "Suki",    rarity: "rare",      hue: 25,  shape: "star" },
  { id: "zara",    name: "Zara",    rarity: "epic",      hue: 330, shape: "diamond" },
  { id: "ivy",     name: "Ivy",     rarity: "epic",      hue: 110, shape: "heart" },
  { id: "vex",     name: "Vex",     rarity: "epic",      hue: 270, shape: "circle" },
  { id: "aurora",  name: "Aurora",  rarity: "legendary", hue: 50,  shape: "star" },
  { id: "sol",     name: "Sol",     rarity: "legendary", hue: 15,  shape: "hourglass" },
  // +18 placeholders
  { id: "cleo",    name: "Cleo",    rarity: "common",    hue: 340, shape: "circle" },
  { id: "daisy",   name: "Daisy",   rarity: "common",    hue: 55,  shape: "star" },
  { id: "ember",   name: "Ember",   rarity: "common",    hue: 18,  shape: "diamond" },
  { id: "faye",    name: "Faye",    rarity: "common",    hue: 200, shape: "heart" },
  { id: "gigi",    name: "Gigi",    rarity: "common",    hue: 160, shape: "hourglass" },
  { id: "haze",    name: "Haze",    rarity: "common",    hue: 250, shape: "circle" },
  { id: "iris",    name: "Iris",    rarity: "common",    hue: 275, shape: "star" },
  { id: "juno",    name: "Juno",    rarity: "common",    hue: 95,  shape: "diamond" },
  { id: "nyx",     name: "Nyx",     rarity: "rare",      hue: 265, shape: "hourglass" },
  { id: "opal",    name: "Opal",    rarity: "rare",      hue: 190, shape: "circle" },
  { id: "piper",   name: "Piper",   rarity: "rare",      hue: 35,  shape: "heart" },
  { id: "quill",   name: "Quill",   rarity: "rare",      hue: 210, shape: "star" },
  { id: "raven",   name: "Raven",   rarity: "rare",      hue: 285, shape: "diamond" },
  { id: "sage",    name: "Sage",    rarity: "epic",      hue: 125, shape: "circle" },
  { id: "tess",    name: "Tess",    rarity: "epic",      hue: 10,  shape: "hourglass" },
  { id: "uma",     name: "Uma",     rarity: "epic",      hue: 310, shape: "star" },
  { id: "wren",    name: "Wren",    rarity: "legendary", hue: 175, shape: "heart" },
  { id: "yuki",    name: "Yuki",    rarity: "legendary", hue: 205, shape: "diamond" },
];
// Alias for older call sites
const CHAR_DEFS = BABE_POOL;

function babeById(id) { return BABE_POOL.find(b => b.id === id) || null; }
function rarityOf(id) {
  const c = babeById(id);
  return RARITIES.find(r => r.id === (c ? c.rarity : "common"));
}
function rarityRank(id) { return RARITY_ORDER[(babeById(id) || {}).rarity] || 0; }

function rollCharacter() {
  const total = RARITIES.reduce((s, r) => s + r.weight, 0);
  let n = Math.random() * total;
  let rarity = RARITIES[0];
  for (const r of RARITIES) { n -= r.weight; if (n <= 0) { rarity = r; break; } }
  const pool = BABE_POOL.filter(c => c.rarity === rarity.id);
  return pool[Math.floor(Math.random() * pool.length)];
}

function ownedUniqueCount(col) {
  return Object.keys(col).filter(k => col[k] > 0 && babeById(k)).length;
}
function totalPulls(col) {
  return Object.values(col).reduce((s, n) => s + n, 0);
}

// ---------- localStorage collection (v1 counts map; v2 wraps same map) ----------
const SAVE_KEY = "hbc_collection_v1";
const SAVE_KEY_V2 = "hbc_collection_v2";
function loadCollection() {
  try {
    const v2 = localStorage.getItem(SAVE_KEY_V2);
    if (v2) {
      const obj = JSON.parse(v2);
      if (obj && typeof obj === "object" && obj.counts && typeof obj.counts === "object") return obj.counts;
    }
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return {};
    const obj = JSON.parse(raw);
    // migrate v1 → v2 quietly
    if (obj && typeof obj === "object") {
      try { localStorage.setItem(SAVE_KEY_V2, JSON.stringify({ v: 2, counts: obj })); } catch {}
      return obj;
    }
    return {};
  } catch { return {}; }
}
function saveCollection(col) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(col)); // keep v1 readable
    localStorage.setItem(SAVE_KEY_V2, JSON.stringify({ v: 2, counts: col }));
  } catch {}
}

// ---------- Input ----------
const keys = Object.create(null);
const justPressed = Object.create(null);
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["arrowup","arrowdown","arrowleft","arrowright"," ","w","a","s","d","c","r","escape","enter"].includes(k) || e.code === "Space") {
    e.preventDefault();
  }
  const code = e.code === "Space" ? " " : k;
  if (!keys[code]) justPressed[code] = true;
  keys[code] = true;
  ensureAudio();
});
window.addEventListener("keyup", e => {
  const code = e.code === "Space" ? " " : e.key.toLowerCase();
  keys[code] = false;
});
window.addEventListener("wheel", e => {
  if (state !== "collection") return;
  e.preventDefault();
  gallery.scroll += e.deltaY;
}, { passive: false });
// ---------- Mobile / pointer helpers ----------
const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
const touchEl = document.getElementById("touch");
const fsBtn = document.getElementById("fsBtn");
const rotateHint = document.getElementById("rotateHint");
let allowPortraitPlay = false;
let gallerySwipeY0 = null;
let gallerySwipeScroll0 = 0;

function canvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (W / Math.max(1, rect.width)),
    y: (clientY - rect.top) * (H / Math.max(1, rect.height)),
  };
}

function handleCanvasTap(sx, sy) {
  ensureAudio();
  if (state === "title") {
    resetLevel(true);
    state = "play";
    return;
  }
  if (state === "win") {
    resetLevel(true);
    state = "play";
    return;
  }
  if (state === "collection") {
    handleGalleryClick(sx, sy);
  }
}

canvas.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  const { x, y } = canvasCoords(e.clientX, e.clientY);
  if (state === "collection") handleGalleryClick(x, y);
  else if (state === "title" || state === "win") handleCanvasTap(x, y);
});

canvas.addEventListener("touchstart", e => {
  if (!e.changedTouches.length) return;
  e.preventDefault();
  ensureAudio();
  const touch = e.changedTouches[0];
  const { x, y } = canvasCoords(touch.clientX, touch.clientY);
  if (state === "collection") {
    gallerySwipeY0 = touch.clientY;
    gallerySwipeScroll0 = gallery.scroll;
    // defer click to touchend unless swipe
    canvas._tapX = x; canvas._tapY = y; canvas._didSwipe = false;
  } else {
    handleCanvasTap(x, y);
  }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
  if (state !== "collection" || gallerySwipeY0 == null) return;
  e.preventDefault();
  const touch = e.changedTouches[0] || e.touches[0];
  if (!touch) return;
  const dy = gallerySwipeY0 - touch.clientY; // finger up → content up
  if (Math.abs(dy) > 8) canvas._didSwipe = true;
  gallery.scroll = gallerySwipeScroll0 + dy * (H / Math.max(1, canvas.getBoundingClientRect().height));
}, { passive: false });

canvas.addEventListener("touchend", e => {
  if (state === "collection") {
    e.preventDefault();
    if (!canvas._didSwipe && canvas._tapX != null) {
      handleGalleryClick(canvas._tapX, canvas._tapY);
    }
    gallerySwipeY0 = null;
    canvas._tapX = canvas._tapY = null;
    canvas._didSwipe = false;
  }
}, { passive: false });

// Block page scroll / bounce / zoom gestures
["gesturestart", "gesturechange", "gestureend"].forEach(ev => {
  document.addEventListener(ev, e => e.preventDefault(), { passive: false });
});
document.addEventListener("touchmove", e => {
  if (e.target === canvas || (e.target && e.target.classList && e.target.classList.contains("tbtn"))) return;
  e.preventDefault();
}, { passive: false });

if (isTouch) {
  touchEl.classList.add("show");
  fsBtn.classList.add("show");
}
function bindTouch(id, key) {
  const el = document.getElementById(id);
  const down = e => {
    e.preventDefault();
    e.stopPropagation();
    keys[key] = true;
    justPressed[key] = true;
    el.classList.add("active");
    ensureAudio();
  };
  const up = e => {
    e.preventDefault();
    keys[key] = false;
    el.classList.remove("active");
  };
  el.addEventListener("touchstart", down, { passive: false });
  el.addEventListener("touchend", up, { passive: false });
  el.addEventListener("touchcancel", up, { passive: false });
  el.addEventListener("mousedown", down);
  el.addEventListener("mouseup", up);
  el.addEventListener("mouseleave", up);
  el.addEventListener("contextmenu", e => e.preventDefault());
}
bindTouch("tLeft", "a");
bindTouch("tRight", "d");
bindTouch("tJump", " ");
bindTouch("tColl", "c");

fsBtn.addEventListener("click", e => {
  e.preventDefault();
  ensureAudio();
  const root = document.documentElement;
  if (!document.fullscreenElement && root.requestFullscreen) root.requestFullscreen().catch(() => {});
  else if (document.exitFullscreen) document.exitFullscreen();
});
document.getElementById("playPortrait").addEventListener("click", e => {
  e.preventDefault();
  allowPortraitPlay = true;
  updateRotateHint();
  ensureAudio();
});

function updateRotateHint() {
  if (!isTouch) { rotateHint.classList.remove("show"); return; }
  const portrait = window.innerHeight > window.innerWidth;
  if (portrait && !allowPortraitPlay) rotateHint.classList.add("show");
  else rotateHint.classList.remove("show");
}
window.addEventListener("orientationchange", () => {
  allowPortraitPlay = false;
  setTimeout(() => { fit(); updateRotateHint(); }, 200);
});

// ---------- Drawing helpers ----------
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawSilhouette(cx, cy, size, shape, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  ctx.translate(cx, cy);
  const s = size;
  if (shape === "hourglass") {
    // stylized figure: head + torso
    ctx.beginPath();
    ctx.arc(0, -s*0.38, s*0.16, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s*0.12, -s*0.2);
    ctx.lineTo(s*0.12, -s*0.2);
    ctx.lineTo(s*0.22, s*0.15);
    ctx.lineTo(s*0.1, s*0.15);
    ctx.lineTo(s*0.14, s*0.45);
    ctx.lineTo(-s*0.14, s*0.45);
    ctx.lineTo(-s*0.1, s*0.15);
    ctx.lineTo(-s*0.22, s*0.15);
    ctx.closePath();
    ctx.fill();
  } else if (shape === "star") {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI/2 + i * Math.PI*2/5;
      const a2 = a + Math.PI/5;
      ctx.lineTo(Math.cos(a)*s*0.45, Math.sin(a)*s*0.45);
      ctx.lineTo(Math.cos(a2)*s*0.18, Math.sin(a2)*s*0.18);
    }
    ctx.closePath();
    ctx.fill();
  } else if (shape === "diamond") {
    ctx.beginPath();
    ctx.moveTo(0, -s*0.45); ctx.lineTo(s*0.35, 0); ctx.lineTo(0, s*0.45); ctx.lineTo(-s*0.35, 0);
    ctx.closePath(); ctx.fill();
  } else if (shape === "heart") {
    ctx.beginPath();
    ctx.moveTo(0, s*0.3);
    ctx.bezierCurveTo(s*0.45, s*0.05, s*0.4, -s*0.3, 0, -s*0.15);
    ctx.bezierCurveTo(-s*0.4, -s*0.3, -s*0.45, s*0.05, 0, s*0.3);
    ctx.fill();
  } else { // circle
    ctx.beginPath();
    ctx.arc(0, 0, s*0.38, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// Canonical card aspect (width/height) from slot-roll card 72×96
const CARD_ASPECT = 72 / 96; // 3/4
function cardHeight(w) { return w / CARD_ASPECT; }
function cardWidth(h) { return h * CARD_ASPECT; }

function drawCard(char, x, y, w, h, opts) {
  opts = opts || {};
  // Uniform scale only — height always derived from width via CARD_ASPECT
  w = +w;
  h = cardHeight(w);
  const rar = rarityOf(char.id);
  const locked = !!opts.locked;
  const glow = opts.glow || 0;

  // glow
  if (glow > 0) {
    ctx.save();
    ctx.shadowColor = rar.color;
    ctx.shadowBlur = 18 * glow;
    roundRect(x, y, w, h, 8);
    ctx.fillStyle = rar.color;
    ctx.fill();
    ctx.restore();
  }

  // card body gradient
  const g = ctx.createLinearGradient(x, y, x, y+h);
  if (locked) {
    g.addColorStop(0, "#2a2a32");
    g.addColorStop(1, "#1a1a22");
  } else {
    g.addColorStop(0, `hsl(${char.hue}, 70%, 55%)`);
    g.addColorStop(0.55, `hsl(${char.hue + 20}, 65%, 35%)`);
    g.addColorStop(1, `hsl(${char.hue}, 50%, 18%)`);
  }
  roundRect(x, y, w, h, 8);
  ctx.fillStyle = g;
  ctx.fill();

  // rarity border
  ctx.strokeStyle = locked ? "#555" : rar.color;
  ctx.lineWidth = 3;
  roundRect(x+1.5, y+1.5, w-3, h-3, 7);
  ctx.stroke();

  // inner frame (tighter on icon-only thumbs — no text band)
  ctx.strokeStyle = locked ? "rgba(255,255,255,0.08)" : "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1;
  if (opts.iconOnly) {
    roundRect(x + 3, y + 3, w - 6, h - 6, 4);
  } else {
    roundRect(x+8, y+8, w-16, h-28, 4);
  }
  ctx.stroke();

  const iconOnly = !!opts.iconOnly;

  // silhouette — centered more in icon-only thumbs
  drawSilhouette(
    x + w/2,
    y + h * (iconOnly ? 0.52 : 0.42),
    Math.min(w, h) * (iconOnly ? 0.62 : 0.55),
    char.shape,
    locked ? "#3a3a44" : "rgba(255,255,255,0.92)"
  );

  if (!iconOnly) {
    // name + rarity
    ctx.textAlign = "center";
    ctx.font = `bold ${Math.max(10, Math.floor(w*0.12))}px sans-serif`;
    ctx.fillStyle = locked ? "#666" : "#fff";
    ctx.fillText(locked ? "???" : char.name, x + w/2, y + h - 12);

    if (!locked && opts.showRarity !== false) {
      ctx.font = `${Math.max(8, Math.floor(w*0.08))}px sans-serif`;
      ctx.fillStyle = rar.color;
      ctx.fillText(rar.label, x + w/2, y + 14);
    }
  }

  // Dupe badge: full label on normal cards; tiny digit only on icon-only if count>1 and room
  if (opts.count != null && opts.count > 1) {
    if (iconOnly) {
      if (w >= 22) {
        const r = Math.max(5, Math.min(7, w * 0.22));
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.beginPath();
        ctx.arc(x + w - r - 2, y + r + 2, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffe66d";
        ctx.font = "bold " + Math.max(7, Math.floor(r * 1.35)) + "px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(opts.count), x + w - r - 2, y + r + 2.5);
        ctx.textBaseline = "alphabetic";
      }
    } else if (opts.count > 0) {
      const bw = Math.max(16, Math.min(22, w * 0.35));
      const bh = Math.max(12, Math.min(16, h * 0.14));
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      roundRect(x + w - bw - 4, y + 4, bw, bh, 3);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold " + Math.max(8, Math.floor(bh * 0.75)) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("x" + opts.count, x + w - bw / 2 - 4, y + 4 + bh * 0.78);
    }
  } else if (!iconOnly && opts.count != null && opts.count > 0) {
    const bw = Math.max(16, Math.min(22, w * 0.35));
    const bh = Math.max(12, Math.min(16, h * 0.14));
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(x + w - bw - 4, y + 4, bw, bh, 3);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold " + Math.max(8, Math.floor(bh * 0.75)) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("x" + opts.count, x + w - bw / 2 - 4, y + 4 + bh * 0.78);
  }
}

// ---------- Level data ----------
// Tile size 32. World is ~120 tiles wide (~3840px), tall enough for pits.
const TILE = 32;
const LEVEL_W = 130;
const LEVEL_H = 18;

// Solid platforms encoded as list of rects {x,y,w,h} in tiles
const platforms = [
  // Max comfortable rise ≈ 2 tiles (see MAX_JUMP_H / reachability). All steps ≤ 2.
  // start ground
  {x:0,y:15,w:18,h:3},
  // ascending stairs (Δ2 each)
  {x:20,y:13,w:5,h:1},
  {x:27,y:11,w:4,h:1},
  {x:33,y:13,w:6,h:1},
  // mid ground with gap
  {x:40,y:15,w:12,h:3},
  {x:55,y:15,w:8,h:3},
  // high ledge route — stepped from mid ground
  {x:46,y:13,w:3,h:1},
  {x:49,y:11,w:3,h:1},
  {x:53,y:9,w:3,h:1},
  {x:57,y:7,w:4,h:1},
  // floating platforms over pit (Δ2 from ground / each other)
  {x:64,y:13,w:3,h:1},
  {x:69,y:11,w:3,h:1},
  {x:74,y:13,w:4,h:1},
  // after pit
  {x:80,y:15,w:16,h:3},
  {x:84,y:13,w:3,h:1},
  {x:88,y:11,w:3,h:1},
  {x:92,y:13,w:4,h:1},
  // final stretch
  {x:99,y:15,w:8,h:3},
  {x:109,y:13,w:5,h:1},
  {x:116,y:15,w:14,h:3},
  {x:120,y:13,w:3,h:1},
];

// Checkpoints (world px)
const checkpoints = [
  { x: 2*TILE, y: 14*TILE },
  { x: 42*TILE, y: 14*TILE },
  { x: 82*TILE, y: 14*TILE },
];

// Coins (~18)
function makeCoins() {
  // Sparse set (~1/4 of prior 22): rare, rewarding, all reachable
  // [tileX, tileY] — just above platform tops
  const spots = [
    [8, 13],   // near start (easy)
    [28, 9],   // early high stair (optional height)
    [58, 5],   // peak of high ledge route (hardest optional)
    [71, 9],   // over the pit floating platform
    [89, 9],   // post-pit high ledge
    [121, 11], // near the goal / end perch
  ];
  return spots.map(([tx,ty]) => {
    const cw = 15;
    return {
      x: tx*TILE + 8, y: ty*TILE + 4, w: cw, h: cardHeight(cw),
      collected: false, bob: Math.random()*Math.PI*2
    };
  });
}

// Enemies: type 'walker' | 'hopper'
function makeEnemies() {
  return [
    { type:"walker", x:10*TILE, y:14*TILE, w:28, h:28, vx:60, dir:1, minX:2*TILE, maxX:16*TILE, alive:true },
    { type:"walker", x:44*TILE, y:14*TILE, w:28, h:28, vx:70, dir:-1, minX:40*TILE, maxX:50*TILE, alive:true },
    { type:"hopper", x:30*TILE, y:11*TILE, w:26, h:26, vx:40, dir:1, vy:0, groundY:13*TILE-26, minX:27*TILE, maxX:36*TILE, alive:true, hopT:0 },
    { type:"walker", x:86*TILE, y:14*TILE, w:28, h:28, vx:80, dir:1, minX:80*TILE, maxX:94*TILE, alive:true },
    { type:"hopper", x:71*TILE, y:11*TILE-26, w:26, h:26, vx:30, dir:-1, vy:0, groundY:11*TILE-26, minX:69*TILE, maxX:72*TILE, alive:true, hopT:0.5 },
    { type:"walker", x:110*TILE, y:13*TILE-28, w:28, h:28, vx:55, dir:1, minX:109*TILE, maxX:113*TILE-4, alive:true },
    { type:"hopper", x:104*TILE, y:15*TILE-26, w:26, h:26, vx:35, dir:1, vy:0, groundY:15*TILE-26, minX:99*TILE, maxX:106*TILE, alive:true, hopT:1.2 },
  ];
}

const goal = { x: 126*TILE, y: 12*TILE, w: 20, h: 96 };

// ---------- Game state ----------
const GRAV = 2200;
const MOVE_ACC = 2400;
const MOVE_MAX = 260;
const FRICTION = 1800;
const JUMP_V = -620;
const JUMP_CUT = 0.45;
// Derived (full held jump): maxJumpH = v^2/(2g) ≈ 87.4px (~2.73 tiles).
// Level design uses ≤2 tile rises (~64px ≈ 73% of max) for comfort.
const COYOTE = 0.1;
const JUMP_BUF = 0.12;

let state = "title"; // title | play | collection | slot | dead | win
let collection = loadCollection();
let hearts = 3;
let invuln = 0;
let checkpointIdx = 0;
let cameraX = 0;
let coins = [];
let enemies = [];
let particles = [];
let callouts = []; // floating text
let slot = null; // slot machine overlay (gameplay keeps running)
let slotQueue = 0; // pending rolls earned while a roll is already playing
let loseAnim = null;
let winStats = null;
let runGained = [];   // babe ids gained this run (for win screen)
let gallery = {
  filter: "all", // all | owned | missing | common | rare | epic | legendary
  scroll: 0,
  selected: null, // babe id
};
const GALLERY_FILTERS = ["all", "owned", "missing", "common", "rare", "epic", "legendary"];
// Bottom-right HUD: 5-slot window into sorted full pool
const HUD_SLOTS = 5;
const HUD_CW = 28;
const HUD_GAP = 4;
let hudTray = {
  scroll: 0,
  targetScroll: 0,
  highlightId: null,
  highlightT: 0,
};
let deathGridScroll = 0; // snap-scroll so lost babe is visible

const player = {
  x: 64, y: 14*TILE - 40, w: 24, h: 36,
  vx: 0, vy: 0, onGround: false,
  facing: 1, coyote: 0, jumpBuf: 0,
  anim: 0, flash: 0, stun: 0, stompGrace: 0,
};

function resetLevel(full) {
  coins = makeCoins();
  enemies = makeEnemies();
  particles = [];
  callouts = [];
  slot = null;
  slotQueue = 0;
  loseAnim = null;
  hearts = 3;
  invuln = 0;
  if (full) {
    checkpointIdx = 0;
    collection = loadCollection();
    runGained = [];
    hudTray.scroll = 0;
    hudTray.targetScroll = 0;
    hudTray.highlightId = null;
    hudTray.highlightT = 0;
    deathGridScroll = 0;
    gallery.scroll = 0;
    gallery.selected = null;
    gallery.filter = "all";
  }
  const cp = checkpoints[checkpointIdx];
  player.x = cp.x;
  player.y = cp.y - player.h;
  player.vx = 0; player.vy = 0;
  player.onGround = false;
  player.coyote = 0; player.jumpBuf = 0; player.stun = 0; player.stompGrace = 0;
  cameraX = Math.max(0, player.x - W*0.35);
}

function solidAt(px, py, pw, ph) {
  // AABB vs platform rects
  for (const p of platforms) {
    const x = p.x*TILE, y = p.y*TILE, w = p.w*TILE, h = p.h*TILE;
    if (px < x+w && px+pw > x && py < y+h && py+ph > y) return {x,y,w,h};
  }
  return null;
}

function resolvePlayer(dt) {
  // horizontal
  player.x += player.vx * dt;
  let hit = solidAt(player.x, player.y, player.w, player.h);
  if (hit) {
    if (player.vx > 0) player.x = hit.x - player.w;
    else if (player.vx < 0) player.x = hit.x + hit.w;
    player.vx = 0;
  }
  // vertical
  player.y += player.vy * dt;
  player.onGround = false;
  hit = solidAt(player.x, player.y, player.w, player.h);
  if (hit) {
    if (player.vy > 0) {
      player.y = hit.y - player.h;
      player.vy = 0;
      player.onGround = true;
    } else if (player.vy < 0) {
      player.y = hit.y + hit.h;
      player.vy = 0;
    }
  }
  // world bounds
  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > LEVEL_W * TILE) { player.x = LEVEL_W*TILE - player.w; player.vx = 0; }
}

function groundUnder(px, feetY) {
  // Thin probe just below feet — true if a platform would catch a landing
  return !!solidAt(px, feetY, player.w, 6);
}

function hurtPlayer(fromX) {
  if (invuln > 0 || player.stompGrace > 0 || state !== "play") return;
  hearts--;
  invuln = 1.4;
  player.flash = 1.4;
  // Bounce away from the enemy: horizontal knockback + small upward pop
  let dir = (player.x + player.w / 2 < fromX) ? -1 : 1;
  const feet = player.y + player.h;
  const probe = 56; // ~1.75 tiles ahead
  const awayHasGround = groundUnder(player.x + dir * probe, feet) ||
    groundUnder(player.x + dir * probe, feet + TILE);
  const towardHasGround = groundUnder(player.x - dir * probe, feet) ||
    groundUnder(player.x - dir * probe, feet + TILE);
  // Avoid knocking the player straight into a pit (unfair death loop near edges)
  let kb = 290;
  if (!awayHasGround) {
    if (towardHasGround) dir = -dir;
    else { dir = 0; kb = 0; } // pit both ways — just pop up in place
  }
  player.vx = dir * kb;
  player.vy = -280;
  player.onGround = false;
  player.stun = 0.25; // brief loss of control so knockback reads
  player.jumpBuf = 0;
  sfx.hit();
  spawnParticles(player.x + player.w/2, player.y + player.h/2, "#ff4466", 10);
  if (hearts <= 0) {
    onHeartsZero();
  }
}

function onHeartsZero() {
  if (state === "dead") return; // single clean event — ignore re-entry
  // Lose one random *already owned* card (pending unrevealed roll is not owned yet).
  // Active roll + queue keep running on top of the death overlay; rewards still grant.
  const owned = Object.keys(collection).filter(k => collection[k] > 0);
  let lostName = null;
  let lostId = null;
  let lostPrevCount = 0;
  if (owned.length) {
    const id = owned[Math.floor(Math.random() * owned.length)];
    lostPrevCount = collection[id];
    collection[id]--;
    if (collection[id] <= 0) delete collection[id];
    saveCollection(collection);
    const ch = CHAR_DEFS.find(c => c.id === id);
    lostName = ch ? ch.name : id;
    lostId = id;
    sfx.lose();
  }
  loseAnim = { t: 0, name: lostName, lostId, lostPrevCount, dur: 2.2 };
  if (lostId) focusHudOnBabe(lostId);
  // Snap death grid so lost babe is centered (computed in drawDead from list)
  deathGridScroll = -1; // sentinel: recompute once
  state = "dead";
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*220,
      vy: (Math.random()-0.8)*260,
      life: 0.4 + Math.random()*0.5,
      color, size: 2 + Math.random()*3
    });
  }
}

function addCallout(text, color) {
  callouts.push({ text, color, t: 0, dur: 0.4 }); // half again (was 0.8)
}

function beginSlotRoll() {
  // Precompute result and plant it at targetIndex BEFORE spinning.
  // Offset eases exactly to that index — no end snap/swap.
  const result = rollCharacter();
  const targetIndex = 24;
  const strip = [];
  for (let i = 0; i < targetIndex; i++) {
    let pick;
    do {
      pick = CHAR_DEFS[Math.floor(Math.random() * CHAR_DEFS.length)];
    } while (i > targetIndex - 4 && pick.id === result.id); // keep approach cards visually distinct
    strip.push(pick);
  }
  strip.push(result);
  for (let i = 0; i < 4; i++) {
    strip.push(CHAR_DEFS[Math.floor(Math.random() * CHAR_DEFS.length)]);
  }
  slot = {
    strip,
    result,
    targetIndex,
    startOffset: 0,
    offset: 0,
    elapsed: 0,
    duration: 1.2,
    done: false,
    revealT: 0,
  };
  sfx.coin();
}

// Coin pickup: start a roll, or queue if one is already playing. Gameplay never pauses.
function onCoinCollected() {
  if (slot) {
    slotQueue++;
    sfx.coin();
  } else {
    beginSlotRoll();
  }
}

function finishSlot() {
  if (!slot) return;
  const id = slot.result.id;
  const prev = collection[id] || 0;
  collection[id] = prev + 1;
  saveCollection(collection);
  runGained.push(id);
  focusHudOnBabe(id);
  if (prev === 0) {
    addCallout("NEW! " + slot.result.name, "#ffe66d");
    sfx.new();
  } else {
    addCallout("DUPE x" + (prev + 1) + " — " + slot.result.name, "#9ad0ff");
  }
  slot = null;
  // Chain queued rolls immediately (even over death/win overlays — player earned them)
  if (slotQueue > 0) {
    slotQueue--;
    beginSlotRoll();
  }
}

// ---------- Update ----------
function updatePlay(dt) {
  if (player.stun > 0) player.stun -= dt;
  if (player.stompGrace > 0) player.stompGrace -= dt;

  // movement (disabled briefly while stunned so knockback reads)
  if (player.stun <= 0) {
    let move = 0;
    if (keys["arrowleft"] || keys["a"]) move -= 1;
    if (keys["arrowright"] || keys["d"]) move += 1;
    if (move !== 0) {
      player.vx += move * MOVE_ACC * dt;
      player.facing = move;
    } else {
      const fr = FRICTION * dt;
      if (Math.abs(player.vx) <= fr) player.vx = 0;
      else player.vx -= Math.sign(player.vx) * fr;
    }
    player.vx = Math.max(-MOVE_MAX, Math.min(MOVE_MAX, player.vx));

    // jump buffer / coyote
    if (justPressed[" "] || justPressed["arrowup"] || justPressed["w"]) {
      player.jumpBuf = JUMP_BUF;
    }
    if (player.onGround) player.coyote = COYOTE;
    else player.coyote -= dt;
    player.jumpBuf -= dt;

    if (player.jumpBuf > 0 && player.coyote > 0) {
      player.vy = JUMP_V;
      player.onGround = false;
      player.coyote = 0;
      player.jumpBuf = 0;
      sfx.jump();
    }
    // variable jump height (skip during stompGrace so Mario bounce isn't eaten)
    const jumpHeld = keys[" "] || keys["arrowup"] || keys["w"];
    if (!jumpHeld && player.vy < 0 && player.stompGrace <= 0) {
      player.vy *= JUMP_CUT;
    }
  } else {
    // Stunned: light air drag only; do not clamp to MOVE_MAX (preserves knockback)
    player.jumpBuf = 0;
    player.coyote = 0;
    player.vx *= (1 - Math.min(1, 1.2 * dt));
  }

  player.vy += GRAV * dt;
  if (player.vy > 900) player.vy = 900;
  resolvePlayer(dt);

  // Pit / cliff: one deliberate full wipe — all hearts gone, lose one card, then checkpoint respawn.
  // Guarded by state !== "play" inside onHeartsZero path (state flips to "dead" immediately) so no multi-trigger.
  if (player.y > (LEVEL_H + 2) * TILE) {
    hearts = 0;
    player.vx = 0;
    player.vy = 0;
    // Park at checkpoint immediately so we are not still "in the pit" next frame
    const cp = checkpoints[checkpointIdx];
    player.x = cp.x;
    player.y = cp.y - player.h;
    sfx.hit();
    onHeartsZero();
    return;
  }

  // checkpoints
  for (let i = checkpointIdx + 1; i < checkpoints.length; i++) {
    if (player.x + player.w/2 >= checkpoints[i].x) checkpointIdx = i;
  }

  // coins (bob + collect; multiple hits while rolling are queued)
  for (const c of coins) {
    if (c.collected) continue;
    c.bob += dt * 3;
    if (aabb(player, c)) {
      c.collected = true;
      spawnParticles(c.x + 8, c.y + 10, "#ffd24a", 8);
      onCoinCollected();
    }
  }

  // enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === "walker") {
      e.x += e.vx * e.dir * dt;
      if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }
    } else if (e.type === "hopper") {
      e.hopT += dt;
      e.x += e.vx * e.dir * dt;
      if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
      if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }
      e.vy += GRAV * dt * 0.85;
      e.y += e.vy * dt;
      if (e.y >= e.groundY) {
        e.y = e.groundY;
        e.vy = 0;
        if (e.hopT > 1.1) { e.vy = -520; e.hopT = 0; }
      }
    }

    if (!aabb(player, e)) continue;
    // Mario-style stomp: falling onto top → kill + bounce (no same-frame re-hit)
    const stomping = player.vy > 40 && (player.y + player.h) <= (e.y + e.h * 0.55);
    if (stomping) {
      e.alive = false;
      // Sit on its head so we don't re-overlap as a side-hit next frame
      player.y = e.y - player.h;
      player.onGround = false;
      // Bounce: solid pop; hold jump for full jump height
      const jumpHeld = keys[" "] || keys["arrowup"] || keys["w"];
      player.vy = jumpHeld ? JUMP_V : -480;
      player.stompGrace = 0.12; // blocks hurt; allows bounce-chain stomps
      player.jumpBuf = 0;
      sfx.stomp();
      spawnParticles(e.x + e.w/2, e.y + e.h/2, e.type === "hopper" ? "#7dff9a" : "#ff8a5b", 12);
    } else {
      hurtPlayer(e.x + e.w/2);
    }
  }

  // goal
  if (aabb(player, goal)) {
    state = "win";
    winStats = {
      unique: ownedUniqueCount(collection),
      total: totalPulls(collection),
      coins: coins.filter(c => c.collected).length,
      coinsMax: coins.length,
      gained: runGained.slice(),
    };
    sfx.win();
  }

  if (invuln > 0) invuln -= dt;
  if (player.flash > 0) player.flash -= dt;
  player.anim += dt * (Math.abs(player.vx) > 20 ? 10 : 4);

  // camera
  const target = player.x - W * 0.38;
  cameraX += (target - cameraX) * Math.min(1, 6 * dt);
  cameraX = Math.max(0, Math.min(cameraX, LEVEL_W * TILE - W));
}

function updateSlot(dt) {
  if (!slot) return;
  if (!slot.done) {
    slot.elapsed += dt;
    const t = Math.min(1, slot.elapsed / slot.duration);
    // Ease-out cubic on POSITION so we land exactly on targetIndex (the pre-planted result)
    const ease = 1 - Math.pow(1 - t, 3);
    const prev = Math.floor(slot.offset + 1e-9);
    slot.offset = slot.startOffset + (slot.targetIndex - slot.startOffset) * ease;
    if (Math.floor(slot.offset + 1e-9) !== prev) sfx.tick();
    if (t >= 1) {
      slot.offset = slot.targetIndex;
      slot.done = true;
      slot.revealT = 0;
    }
  } else {
    slot.revealT += dt;
    if (slot.revealT > 0.275) finishSlot(); // half of previous 0.55s reveal hold
  }
}

function updateDead(dt) {
  if (!loseAnim) { state = "play"; resetAfterDeath(); return; }
  loseAnim.t += dt;
  if (loseAnim.t >= loseAnim.dur) {
    loseAnim = null;
    resetAfterDeath();
    state = "play";
  }
}

function resetAfterDeath() {
  hearts = 3;
  invuln = 1.5;
  const cp = checkpoints[checkpointIdx];
  player.x = cp.x; player.y = cp.y - player.h;
  player.vx = 0; player.vy = 0;
  player.stun = 0;
  player.stompGrace = 0;
  // Respawn coins AND enemies at original positions/state (same as level start)
  coins = makeCoins();
  enemies = makeEnemies();
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 600*dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = callouts.length - 1; i >= 0; i--) {
    callouts[i].t += dt;
    if (callouts[i].t >= callouts[i].dur) callouts.splice(i, 1);
  }
}

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------- Draw ----------
function drawBackground() {
  // sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#1b0f2e");
  g.addColorStop(0.5, "#3a1a4a");
  g.addColorStop(1, "#6b2d5c");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // parallax hills
  ctx.fillStyle = "#2a1538";
  for (let i = 0; i < 8; i++) {
    const hx = ((i * 280) - cameraX * 0.2) % (W + 300) - 80;
    ctx.beginPath();
    ctx.ellipse(hx + 120, H - 40, 160, 70, 0, 0, Math.PI*2);
    ctx.fill();
  }
  // stars
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  for (let i = 0; i < 40; i++) {
    const sx = ((i * 97) * 13 - cameraX * 0.05) % W;
    const sy = (i * 37) % (H * 0.55);
    ctx.fillRect(sx, sy, 2, 2);
  }
}

function drawWorld() {
  ctx.save();
  ctx.translate(-Math.floor(cameraX), 0);

  // platforms
  for (const p of platforms) {
    const x = p.x*TILE, y = p.y*TILE, w = p.w*TILE, h = p.h*TILE;
    // dirt body
    ctx.fillStyle = "#5c3a28";
    ctx.fillRect(x, y, w, h);
    // grass top
    ctx.fillStyle = "#4ec96a";
    ctx.fillRect(x, y, w, 8);
    // pixel edge
    ctx.fillStyle = "#3a8f4c";
    for (let i = 0; i < w; i += 8) ctx.fillRect(x + i, y + 8, 6, 3);
    // bricks hint on tall
    if (h > TILE) {
      ctx.fillStyle = "rgba(0,0,0,0.15)";
      for (let ty = y + TILE; ty < y + h; ty += TILE) {
        ctx.fillRect(x, ty, w, 2);
        for (let tx = x; tx < x + w; tx += TILE) ctx.fillRect(tx, ty, 2, TILE);
      }
    }
  }

  // checkpoints flags
  for (let i = 0; i < checkpoints.length; i++) {
    const c = checkpoints[i];
    const active = i <= checkpointIdx;
    ctx.fillStyle = "#ddd";
    ctx.fillRect(c.x, c.y - 48, 4, 48);
    ctx.fillStyle = active ? "#ff5a9a" : "#888";
    ctx.beginPath();
    ctx.moveTo(c.x + 4, c.y - 48);
    ctx.lineTo(c.x + 28, c.y - 36);
    ctx.lineTo(c.x + 4, c.y - 24);
    ctx.fill();
  }

  // coins (card-shaped)
  for (const c of coins) {
    if (c.collected) continue;
    const by = c.y + Math.sin(c.bob) * 4;
    // mini card
    const g = ctx.createLinearGradient(c.x, by, c.x, by + c.h);
    g.addColorStop(0, "#ffd24a");
    g.addColorStop(1, "#ff7ab8");
    roundRect(c.x, by, c.w, c.h, 3);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = "#fff8";
    ctx.lineWidth = 1;
    roundRect(c.x, by, c.w, c.h, 3);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("★", c.x + c.w/2, by + c.h/2 + 3);
  }

  // enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === "walker") {
      ctx.fillStyle = "#e85d4c";
      roundRect(e.x, e.y, e.w, e.h, 4);
      ctx.fill();
      // eyes
      ctx.fillStyle = "#fff";
      ctx.fillRect(e.x + 6 + (e.dir>0?8:0), e.y + 8, 6, 6);
      ctx.fillRect(e.x + 16 + (e.dir>0?8:0), e.y + 8, 6, 6);
      ctx.fillStyle = "#111";
      ctx.fillRect(e.x + 8 + (e.dir>0?8:0), e.y + 10, 3, 3);
      ctx.fillRect(e.x + 18 + (e.dir>0?8:0), e.y + 10, 3, 3);
      // feet
      ctx.fillStyle = "#a03028";
      ctx.fillRect(e.x + 2, e.y + e.h - 4, 8, 4);
      ctx.fillRect(e.x + e.w - 10, e.y + e.h - 4, 8, 4);
    } else {
      // hopper — green blob with spring
      ctx.fillStyle = "#5dcf6a";
      ctx.beginPath();
      ctx.ellipse(e.x + e.w/2, e.y + e.h/2, e.w/2, e.h/2 * (e.vy < -50 ? 1.15 : 0.9), 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(e.x + 8, e.y + 10, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x + 18, e.y + 10, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#111";
      ctx.fillRect(e.x + 8, e.y + 10, 3, 3);
      ctx.fillRect(e.x + 18, e.y + 10, 3, 3);
    }
  }

  // goal flag
  ctx.fillStyle = "#eee";
  ctx.fillRect(goal.x, goal.y, 5, goal.h);
  ctx.fillStyle = "#ffd24a";
  ctx.beginPath();
  ctx.moveTo(goal.x + 5, goal.y);
  ctx.lineTo(goal.x + 40, goal.y + 16);
  ctx.lineTo(goal.x + 5, goal.y + 32);
  ctx.fill();
  ctx.fillStyle = "#ff5a9a";
  ctx.beginPath();
  ctx.arc(goal.x + 2, goal.y, 6, 0, Math.PI*2);
  ctx.fill();

  // player
  if (player.flash <= 0 || Math.floor(player.flash * 12) % 2 === 0) {
    const px = player.x, py = player.y;
    // body
    ctx.fillStyle = "#6ec8ff";
    roundRect(px, py + 8, player.w, player.h - 8, 4);
    ctx.fill();
    // head
    ctx.fillStyle = "#ffdbb0";
    ctx.fillRect(px + 4, py, 16, 14);
    // hair
    ctx.fillStyle = "#ff5a9a";
    ctx.fillRect(px + 3, py - 2, 18, 6);
    // eye
    ctx.fillStyle = "#222";
    const ex = player.facing >= 0 ? px + 14 : px + 6;
    ctx.fillRect(ex, py + 5, 3, 3);
    // legs
    const leg = Math.sin(player.anim) * (player.onGround && Math.abs(player.vx)>30 ? 4 : 0);
    ctx.fillStyle = "#3a6a9a";
    ctx.fillRect(px + 4, py + player.h - 8, 6, 8 + leg);
    ctx.fillRect(px + 14, py + player.h - 8, 6, 8 - leg);
  }

  // particles in world space
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}


function drawHudLiveBabes() {
  if (state !== "play" && state !== "dead") return;

  const list = sortedBabeList();
  const cw = HUD_CW, ch = cardHeight(cw), gap = HUD_GAP;
  const pad = 8, counterH = 16;
  const panelW = pad * 2 + HUD_SLOTS * cw + (HUD_SLOTS - 1) * gap;
  const panelH = pad + counterH + ch + pad;
  const margin = 10;
  const lift = isTouch ? 130 : 18;
  const panelX = W - panelW - margin;
  const panelY = H - panelH - lift;
  const step = cw + gap;
  const maxScroll = Math.max(0, (list.length - HUD_SLOTS) * step);
  hudTray.scroll = Math.max(0, Math.min(maxScroll, hudTray.scroll));
  hudTray.targetScroll = Math.max(0, Math.min(maxScroll, hudTray.targetScroll));

  ctx.save();
  ctx.globalAlpha = 0.78;
  ctx.fillStyle = "rgba(12,8,22,0.78)";
  roundRect(panelX, panelY, panelW, panelH, 8);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,90,154,0.45)";
  ctx.lineWidth = 1.5;
  roundRect(panelX, panelY, panelW, panelH, 8);
  ctx.stroke();

  const unique = ownedUniqueCount(collection);
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = "#ffb0d0";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Babes " + unique + "/" + BABE_POOL.length, panelX + pad, panelY + 13);

  const viewX = panelX + pad;
  const viewY = panelY + pad + counterH;
  const viewW = HUD_SLOTS * cw + (HUD_SLOTS - 1) * gap;
  ctx.save();
  ctx.beginPath();
  ctx.rect(viewX - 1, viewY - 1, viewW + 2, ch + 2);
  ctx.clip();

  const startIdx = Math.floor(hudTray.scroll / step);
  const frac = hudTray.scroll - startIdx * step;
  for (let i = 0; i <= HUD_SLOTS; i++) {
    const idx = startIdx + i;
    if (idx < 0 || idx >= list.length) continue;
    const babe = list[idx];
    const x = viewX + i * step - frac;
    const y = viewY;
    const count = collection[babe.id] || 0;
    const isLost = state === "dead" && loseAnim && loseAnim.lostId === babe.id;
    const isHL = hudTray.highlightId === babe.id && hudTray.highlightT > 0;
    ctx.globalAlpha = count > 0 || isLost ? 0.95 : 0.5;
    if (isLost) {
      const displayCount = count > 0 ? count : (loseAnim.lostPrevCount > 1 ? loseAnim.lostPrevCount - 1 : null);
      drawCard(babe, x, y, cw, ch, {
        locked: false,
        count: displayCount && displayCount > 1 ? displayCount : null,
        iconOnly: true,
      });
      drawLostBabeX(x, y, cw, ch, loseAnim.t);
    } else {
      drawCard(babe, x, y, cw, ch, {
        locked: count === 0,
        iconOnly: true,
        count: count > 1 ? count : null,
      });
    }
    if (isHL) {
      const pulse = 0.5 + 0.5 * Math.sin((0.55 - hudTray.highlightT) * 20);
      ctx.strokeStyle = `rgba(255,230,109,${0.55 + 0.45 * pulse})`;
      ctx.lineWidth = 2;
      roundRect(x - 1, y - 1, cw + 2, ch + 2, 5);
      ctx.stroke();
    }
  }
  ctx.restore();
  ctx.restore();
}

function drawHUD() {
  // hearts
  for (let i = 0; i < 3; i++) {
    const hx = 16 + i * 28, hy = 14;
    ctx.fillStyle = i < hearts ? "#ff4d6d" : "#44222a";
    ctx.beginPath();
    ctx.moveTo(hx, hy + 6);
    ctx.bezierCurveTo(hx, hy, hx + 12, hy, hx + 12, hy + 6);
    ctx.bezierCurveTo(hx + 12, hy + 14, hx, hy + 18, hx, hy + 18);
    ctx.bezierCurveTo(hx, hy + 18, hx - 12, hy + 14, hx - 12, hy + 6);
    ctx.bezierCurveTo(hx - 12, hy, hx, hy, hx, hy + 6);
    ctx.fill();
  }

  // collection count
  const unique = ownedUniqueCount(collection);
  const total = totalPulls(collection);
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  roundRect(W - 170, 8, 158, 36, 8);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Babes " + unique + "/" + BABE_POOL.length, W - 158, 24);
  ctx.font = "11px sans-serif";
  ctx.fillStyle = "#ffb0d0";
  ctx.fillText("Total pulls: " + total + "  [C]", W - 158, 38);

  // studio tag
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.font = "10px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Big Salty Gaming Studio", W/2, H - 8);

  // callouts
  for (const c of callouts) {
    const a = c.t < 0.2 ? c.t/0.2 : (c.t > c.dur - 0.4 ? (c.dur - c.t)/0.4 : 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(W/2 - 140, 56, 280, 36, 8);
    ctx.fill();
    ctx.fillStyle = c.color;
    ctx.font = "bold 18px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(c.text, W/2, 80);
    ctx.globalAlpha = 1;
  }

  drawHudLiveBabes();
}

function drawSlot() {
  // Overlay only — no screen dimming; world keeps rendering underneath
  // Panel height is 70% of the original 150px; cards scale uniformly (3:4)
  const panelY = 48;
  const panelH = Math.round(150 * 0.7); // 105
  const scale = 0.7;
  ctx.fillStyle = "rgba(20,10,30,0.92)";
  roundRect(40, panelY, W - 80, panelH, 12);
  ctx.fill();
  ctx.strokeStyle = "#ff5a9a";
  ctx.lineWidth = 2.5;
  roundRect(40, panelY, W - 80, panelH, 12);
  ctx.stroke();

  ctx.fillStyle = "#ffb0d0";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(slot.done ? "★ YOU GOT ★" : "✦ ROLLING… ✦", W/2, panelY + 18);

  if (slotQueue > 0) {
    ctx.fillStyle = "#ffe66d";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("Queue +" + slotQueue, W - 56, panelY + 18);
  }

  // card window — width derived from height via CARD_ASPECT
  const cw = 72 * scale;           // 50.4
  const ch = cardHeight(cw);       // exact 3:4
  const gap = 14 * scale;
  const centerX = W/2;
  const cy = panelY + 26;
  const viewW = cw * 5 + gap * 4;
  const vx = centerX - viewW/2;

  ctx.save();
  ctx.beginPath();
  ctx.rect(vx - 3, cy - 3, viewW + 6, ch + 6);
  ctx.clip();

  const base = slot.offset;
  for (let i = -3; i <= 3; i++) {
    const idx = Math.floor(base) + i;
    if (idx < 0 || idx >= slot.strip.length) continue;
    const frac = base - Math.floor(base);
    const cx = centerX + (i - frac) * (cw + gap) - cw/2;
    const char = slot.strip[idx];
    drawCard(char, cx, cy, cw, ch, { glow: slot.done && idx === slot.targetIndex ? 1 : 0 });
  }
  ctx.restore();

  // center highlight frame
  ctx.strokeStyle = "#ffe66d";
  ctx.lineWidth = 2.5;
  roundRect(centerX - cw/2 - 3, cy - 3, cw + 6, ch + 6, 8);
  ctx.stroke();

  if (slot.done) {
    const rar = rarityOf(slot.result.id);
    ctx.fillStyle = rar.color;
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(slot.result.name + " — " + rar.label, W/2, panelY + panelH - 8);
  }
}

function sortedBabeList() {
  return BABE_POOL.slice().sort((a, b) => {
    const rd = rarityRank(a.id) - rarityRank(b.id);
    if (rd !== 0) return rd;
    return a.name.localeCompare(b.name);
  });
}

function focusHudOnBabe(id) {
  if (!id) return;
  const list = sortedBabeList();
  const idx = list.findIndex(b => b.id === id);
  if (idx < 0) return;
  const step = HUD_CW + HUD_GAP;
  let scroll = (idx - Math.floor(HUD_SLOTS / 2)) * step;
  const maxScroll = Math.max(0, (list.length - HUD_SLOTS) * step);
  hudTray.targetScroll = Math.max(0, Math.min(maxScroll, scroll));
  hudTray.highlightId = id;
  hudTray.highlightT = 0.55;
}

function updateHudTray(dt) {
  const d = hudTray.targetScroll - hudTray.scroll;
  hudTray.scroll += d * Math.min(1, 14 * dt);
  if (Math.abs(d) < 0.4) hudTray.scroll = hudTray.targetScroll;
  if (hudTray.highlightT > 0) hudTray.highlightT -= dt;
}

function galleryFilteredList() {
  let list = BABE_POOL.slice();
  const f = gallery.filter;
  if (f === "owned") list = list.filter(b => (collection[b.id] || 0) > 0);
  else if (f === "missing") list = list.filter(b => !(collection[b.id] > 0));
  else if (f === "common" || f === "rare" || f === "epic" || f === "legendary") {
    list = list.filter(b => b.rarity === f);
  }
  list.sort((a, b) => {
    const rd = rarityRank(a.id) - rarityRank(b.id);
    if (rd !== 0) return rd;
    return a.name.localeCompare(b.name);
  });
  return list;
}

function handleGalleryClick(sx, sy) {
  // Filter tabs
  const tabY = 56, tabH = 28, tabGap = 6;
  const labels = GALLERY_FILTERS;
  let tx = 40;
  for (const lab of labels) {
    const label = lab[0].toUpperCase() + lab.slice(1);
    ctx.font = "bold 11px sans-serif";
    const tw = Math.max(54, ctx.measureText(label).width + 16);
    if (sx >= tx && sx <= tx + tw && sy >= tabY && sy <= tabY + tabH) {
      gallery.filter = lab;
      gallery.scroll = 0;
      gallery.selected = null;
      return;
    }
    tx += tw + tabGap;
  }
  // Page buttons
  if (sx >= W - 120 && sx <= W - 70 && sy >= H - 42 && sy <= H - 14) {
    gallery.scroll = Math.max(0, gallery.scroll - 160);
    return;
  }
  if (sx >= W - 60 && sx <= W - 10 && sy >= H - 42 && sy <= H - 14) {
    gallery.scroll += 160;
    return;
  }
  // Detail close
  if (gallery.selected) {
    if (sx >= W / 2 - 40 && sx <= W / 2 + 40 && sy >= H - 50 && sy <= H - 22) {
      gallery.selected = null;
      return;
    }
  }
  // Grid hit
  const list = galleryFilteredList();
  const cols = 5;
  const cw = 100, ch = cardHeight(cw), gapX = 16, gapY = 14;
  const gridW = cols * cw + (cols - 1) * gapX;
  const startX = (W - gridW) / 2;
  const startY = 100 - gallery.scroll;
  for (let i = 0; i < list.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = startX + col * (cw + gapX);
    const y = startY + row * (ch + gapY);
    if (sx >= x && sx <= x + cw && sy >= y && sy <= y + ch) {
      gallery.selected = list[i].id;
      return;
    }
  }
}

function updateGalleryInput() {
  if (justPressed["arrowleft"] || justPressed["a"]) gallery.scroll = Math.max(0, gallery.scroll - 120);
  if (justPressed["arrowright"] || justPressed["d"]) gallery.scroll += 120;
  if (justPressed["arrowup"] || justPressed["w"]) gallery.scroll = Math.max(0, gallery.scroll - 80);
  if (justPressed["arrowdown"] || justPressed["s"]) gallery.scroll += 80;
  if (justPressed["pageup"]) gallery.scroll = Math.max(0, gallery.scroll - 220);
  if (justPressed["pagedown"]) gallery.scroll += 220;
  // number keys 1-7 for filters
  for (let i = 0; i < GALLERY_FILTERS.length; i++) {
    if (justPressed[String(i + 1)]) {
      gallery.filter = GALLERY_FILTERS[i];
      gallery.scroll = 0;
      gallery.selected = null;
    }
  }
  if (justPressed["escape"] && gallery.selected) {
    gallery.selected = null;
    justPressed["escape"] = false; // consume so we don't close gallery
  }
}

function drawCollection() {
  updateGalleryInput();
  ctx.fillStyle = "rgba(12,8,20,0.94)";
  ctx.fillRect(0, 0, W, H);

  const unique = ownedUniqueCount(collection);
  ctx.fillStyle = "#ff8ec8";
  ctx.font = "bold 26px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Babe Gallery", W / 2, 34);
  ctx.font = "bold 14px sans-serif";
  ctx.fillStyle = "#fff";
  ctx.fillText("Babes " + unique + "/" + BABE_POOL.length, W / 2, 54);
  ctx.font = "11px sans-serif";
  ctx.fillStyle = "#888";
  ctx.fillText("C / Esc close  ·  Wheel / arrows scroll  ·  1–7 filters  ·  Click to inspect", W / 2, H - 10);

  // Filter tabs
  const tabY = 62, tabH = 26, tabGap = 6;
  let tx = 36;
  ctx.textAlign = "center";
  for (const lab of GALLERY_FILTERS) {
    const label = lab[0].toUpperCase() + lab.slice(1);
    ctx.font = "bold 11px sans-serif";
    const tw = Math.max(54, ctx.measureText(label).width + 16);
    const active = gallery.filter === lab;
    ctx.fillStyle = active ? "rgba(255,90,154,0.55)" : "rgba(255,255,255,0.1)";
    roundRect(tx, tabY, tw, tabH, 6);
    ctx.fill();
    ctx.strokeStyle = active ? "#ff8ec8" : "rgba(255,255,255,0.2)";
    ctx.lineWidth = 1;
    roundRect(tx, tabY, tw, tabH, 6);
    ctx.stroke();
    ctx.fillStyle = active ? "#fff" : "#bbb";
    ctx.fillText(label, tx + tw / 2, tabY + 17);
    tx += tw + tabGap;
  }

  const list = galleryFilteredList();
  const cols = 5;
  const cw = 100, ch = cardHeight(cw), gapX = 16, gapY = 14;
  const gridW = cols * cw + (cols - 1) * gapX;
  const startX = (W - gridW) / 2;
  const startY = 100;
  const rows = Math.ceil(list.length / cols) || 1;
  const contentH = rows * (ch + gapY);
  const viewH = H - startY - 48;
  const maxScroll = Math.max(0, contentH - viewH);
  gallery.scroll = Math.max(0, Math.min(gallery.scroll, maxScroll));

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, startY - 4, W, viewH + 8);
  ctx.clip();
  for (let i = 0; i < list.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = startX + col * (cw + gapX);
    const y = startY + row * (ch + gapY) - gallery.scroll;
    if (y + ch < startY - 10 || y > startY + viewH + 10) continue;
    const babe = list[i];
    const count = collection[babe.id] || 0;
    drawCard(babe, x, y, cw, ch, {
      locked: count === 0,
      count: count > 0 ? count : null,
    });
    if (gallery.selected === babe.id) {
      ctx.strokeStyle = "#ffe66d";
      ctx.lineWidth = 3;
      roundRect(x - 2, y - 2, cw + 4, ch + 4, 10);
      ctx.stroke();
    }
  }
  ctx.restore();

  // Page buttons
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  roundRect(W - 120, H - 42, 46, 28, 6);
  ctx.fill();
  roundRect(W - 60, H - 42, 46, 28, 6);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("▲", W - 97, H - 23);
  ctx.fillText("▼", W - 37, H - 23);

  // Detail overlay
  if (gallery.selected) {
    const babe = babeById(gallery.selected);
    if (babe) {
      const count = collection[babe.id] || 0;
      const rar = rarityOf(babe.id);
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(0, 0, W, H);
      const dw = 180, dh = cardHeight(dw);
      const dx = (W - dw) / 2, dy = 110;
      drawCard(babe, dx, dy, dw, dh, {
        locked: count === 0,
        count: count > 0 ? count : null,
        glow: count > 0 ? 0.6 : 0,
      });
      ctx.fillStyle = "#fff";
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(count > 0 ? babe.name : "???", W / 2, dy + dh + 36);
      ctx.fillStyle = rar.color;
      ctx.font = "bold 16px sans-serif";
      ctx.fillText(rar.label, W / 2, dy + dh + 60);
      ctx.fillStyle = "#ccc";
      ctx.font = "14px sans-serif";
      ctx.fillText(count > 0 ? ("Owned ×" + count) : "Not yet collected", W / 2, dy + dh + 84);
      ctx.fillStyle = "rgba(255,255,255,0.2)";
      roundRect(W / 2 - 50, H - 52, 100, 30, 8);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 13px sans-serif";
      ctx.fillText("Close", W / 2, H - 32);
    }
  }
}

function drawTitle() {
  drawBackground();
  // decorative cards
  for (let i = 0; i < 5; i++) {
    const ch = CHAR_DEFS[i * 2];
    drawCard(ch, 60 + i * 180, 160 + Math.sin(performance.now()/500 + i)*10, 90, cardHeight(90), {});
  }
  ctx.fillStyle = "rgba(10,5,20,0.55)";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#ff5a9a";
  ctx.font = "bold 48px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Hot Babe Collector", W/2, 200);
  ctx.fillStyle = "#ffb0d0";
  ctx.font = "18px sans-serif";
  ctx.fillText("Big Salty Gaming Studio", W/2, 236);

  ctx.fillStyle = "#fff";
  ctx.font = "16px sans-serif";
  ctx.fillText("Collect babes • Stomp foes • Reach the flag", W/2, 300);
  ctx.fillStyle = "#ffe66d";
  ctx.font = "bold 20px sans-serif";
  const blink = Math.sin(performance.now()/300) > 0;
  if (blink) ctx.fillText(isTouch ? "Tap to Start" : "Press Enter / Space to Start", W/2, 360);

  ctx.fillStyle = "#999";
  ctx.font = "12px sans-serif";
  ctx.fillText("←→ / A D move  •  Space / W / ↑ jump  •  C babe gallery", W/2, 420);
}

// Compact collection strip for death / win overlays
// Bold red X: pen-stroke draw — stroke1 then stroke2, ~0.15s each, no delay, then hold
const LOST_X_STROKE = 0.15;
function drawLostBabeX(x, y, w, h, t) {
  const inset = Math.max(3, w * 0.12);
  const x0 = x + inset, y0 = y + inset;
  const x1 = x + w - inset, y1 = y + h - inset;
  ctx.save();
  ctx.strokeStyle = "#ff2030";
  ctx.lineWidth = Math.max(3, Math.min(8, w * 0.14));
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  // Stroke 1 grows TL → BR
  const a = Math.max(0, Math.min(1, t / LOST_X_STROKE));
  if (a > 0) {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0 + (x1 - x0) * a, y0 + (y1 - y0) * a);
    ctx.stroke();
  }
  // Stroke 2 grows TR → BL after stroke 1 finishes
  const b = Math.max(0, Math.min(1, (t - LOST_X_STROKE) / LOST_X_STROKE));
  if (b > 0) {
    ctx.beginPath();
    ctx.moveTo(x1, y0);
    ctx.lineTo(x1 + (x0 - x1) * b, y0 + (y1 - y0) * b);
    ctx.stroke();
  }
  ctx.restore();
}

function layoutMiniCollection(panelW, maxPanelH) {
  const cols = 6, rows = 2;
  const gapX = 8, gapY = 8;
  const padX = 14, padTop = 28, padBot = 12;
  const gridW = panelW - padX * 2;
  let cw = (gridW - gapX * (cols - 1)) / cols;
  let ch = cardHeight(cw);
  let contentH = padTop + rows * ch + (rows - 1) * gapY + padBot;
  if (maxPanelH && contentH > maxPanelH) {
    // Shrink uniformly so 2 rows fit without squashing
    const maxCh = (maxPanelH - padTop - padBot - (rows - 1) * gapY) / rows;
    ch = maxCh;
    cw = cardWidth(ch);
    contentH = padTop + rows * ch + (rows - 1) * gapY + padBot;
  }
  return { cols, rows, gapX, gapY, padX, padTop, padBot, cw, ch, contentH };
}

function drawMiniCollection(opts) {
  opts = opts || {};
  const panelX = opts.x != null ? opts.x : 100;
  const panelY = opts.y != null ? opts.y : 175;
  const panelW = opts.w != null ? opts.w : W - 200;
  const maxH = opts.maxH != null ? opts.maxH : (H - panelY - 20);
  const lostId = opts.lostId || null;
  const lostPrevCount = opts.lostPrevCount || 0;
  const animT = opts.animT != null ? opts.animT : 0;
  const animDur = opts.animDur != null ? opts.animDur : 2.2;

  const L = layoutMiniCollection(panelW, maxH);
  const panelH = L.contentH;

  // Center grid horizontally if cards shrank below full width
  const gridW = L.cols * L.cw + (L.cols - 1) * L.gapX;
  const gridOriginX = panelX + (panelW - gridW) / 2;

  ctx.fillStyle = "rgba(12,8,22,0.88)";
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,90,154,0.55)";
  ctx.lineWidth = 2;
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.stroke();

  const unique = Object.keys(collection).filter(k => collection[k] > 0).length;
  ctx.fillStyle = "#ffb0d0";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Babes", panelX + 14, panelY + 20);
  ctx.fillStyle = "#fff";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText(unique + " / " + CHAR_DEFS.length + " owned", panelX + panelW - 14, panelY + 20);

  for (let i = 0; i < CHAR_DEFS.length; i++) {
    const col = i % L.cols, row = Math.floor(i / L.cols);
    const x = gridOriginX + col * (L.cw + L.gapX);
    const y = panelY + L.padTop + row * (L.ch + L.gapY);
    const char = CHAR_DEFS[i];
    const count = collection[char.id] || 0;
    const isLost = lostId && char.id === lostId;
    const cw = L.cw, ch = L.ch;

    ctx.save();
    if (isLost) {
      // Keep babe colored as pre-loss; pen-stroke red X draws in (~0.15s × 2)
      const displayCount = count > 0 ? count : (lostPrevCount > 1 ? lostPrevCount - 1 : null);
      drawCard(char, x, y, cw, ch, {
        locked: false,
        count: displayCount,
        showRarity: false,
      });
      drawLostBabeX(x, y, cw, ch, animT);
    } else {
      drawCard(char, x, y, cw, ch, {
        locked: count === 0,
        count: count > 0 ? count : null,
        showRarity: false,
      });
    }
    ctx.restore();
  }
  return { panelH, cw: L.cw, ch: L.ch, ratio: L.cw / L.ch };
}

function drawDead() {
  ctx.fillStyle = "rgba(40,5,15,0.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ff6b8a";
  ctx.font = "bold 32px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Ouch!", W / 2, 48);
  const unique = ownedUniqueCount(collection);
  ctx.fillStyle = "#ffb0d0";
  ctx.font = "13px sans-serif";
  ctx.fillText("Babes owned: " + unique + "/" + BABE_POOL.length, W / 2, 72);

  if (loseAnim && loseAnim.name) {
    ctx.fillStyle = "#ffe66d";
    ctx.font = "bold 20px sans-serif";
    ctx.fillText("LOST: " + loseAnim.name, W / 2, 98);
    ctx.fillStyle = "#bbb";
    ctx.font = "12px sans-serif";
    ctx.fillText("A random babe was taken from your collection", W / 2, 118);
  } else {
    ctx.fillStyle = "#ccc";
    ctx.font = "14px sans-serif";
    ctx.fillText("No babes to lose… this time.", W / 2, 100);
  }

  // Gallery-style grid (rarity→name), auto-scrolled to lost babe
  const list = sortedBabeList();
  const cols = 6;
  const cw = 92, ch = cardHeight(cw), gapX = 12, gapY = 10;
  const panelX = 48, panelY = 132;
  const panelW = W - 96;
  const panelH = H - panelY - 40;
  const gridW = cols * cw + (cols - 1) * gapX;
  const startX = panelX + (panelW - gridW) / 2;
  const rows = Math.ceil(list.length / cols);
  const contentH = rows * ch + (rows - 1) * gapY;
  const maxScroll = Math.max(0, contentH - panelH + 8);

  let focusIdx = loseAnim && loseAnim.lostId
    ? list.findIndex(b => b.id === loseAnim.lostId) : -1;
  if (deathGridScroll < 0) {
    if (focusIdx >= 0) {
      const row = Math.floor(focusIdx / cols);
      const rowY = row * (ch + gapY);
      deathGridScroll = Math.max(0, Math.min(maxScroll, rowY - (panelH - ch) / 2));
    } else {
      deathGridScroll = 0;
    }
  }
  deathGridScroll = Math.max(0, Math.min(maxScroll, deathGridScroll));

  ctx.fillStyle = "rgba(12,8,22,0.88)";
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,90,154,0.5)";
  ctx.lineWidth = 2;
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.stroke();

  ctx.save();
  ctx.beginPath();
  ctx.rect(panelX + 4, panelY + 4, panelW - 8, panelH - 8);
  ctx.clip();

  for (let i = 0; i < list.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = startX + col * (cw + gapX);
    const y = panelY + 10 + row * (ch + gapY) - deathGridScroll;
    if (y + ch < panelY || y > panelY + panelH) continue;
    const babe = list[i];
    const count = collection[babe.id] || 0;
    const isLost = loseAnim && loseAnim.lostId === babe.id;
    if (isLost) {
      const displayCount = count > 0 ? count : (loseAnim.lostPrevCount > 1 ? loseAnim.lostPrevCount - 1 : null);
      drawCard(babe, x, y, cw, ch, {
        locked: false,
        count: displayCount,
      });
      drawLostBabeX(x, y, cw, ch, loseAnim.t);
    } else {
      drawCard(babe, x, y, cw, ch, {
        locked: count === 0,
        count: count > 0 ? count : null,
      });
    }
  }
  ctx.restore();

  ctx.fillStyle = "#aaa";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Respawning at checkpoint…", W / 2, H - 14);
}

function drawWin() {
  ctx.fillStyle = "rgba(10,5,30,0.85)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ffe66d";
  ctx.font = "bold 36px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Level Complete!", W / 2, 48);
  ctx.fillStyle = "#ff8ec8";
  ctx.font = "15px sans-serif";
  ctx.fillText("Big Salty Gaming Studio thanks you", W / 2, 74);

  if (winStats) {
    ctx.fillStyle = "#fff";
    ctx.font = "14px sans-serif";
    ctx.fillText(
      "Coins " + winStats.coins + "/" + winStats.coinsMax +
      "   ·   Babes " + winStats.unique + "/" + BABE_POOL.length +
      "   ·   Pulls " + winStats.total,
      W / 2, 102
    );
  }

  ctx.fillStyle = "#ffb0d0";
  ctx.font = "bold 16px sans-serif";
  ctx.fillText("Babes gained this run", W / 2, 140);

  const gained = (winStats && winStats.gained) ? winStats.gained : [];
  if (!gained.length) {
    ctx.fillStyle = "#888";
    ctx.font = "14px sans-serif";
    ctx.fillText("No babes collected this run — next time!", W / 2, 220);
  } else {
    const cw = 72, ch = cardHeight(cw), gap = 12;
    const totalW = gained.length * cw + (gained.length - 1) * gap;
    // Scrollable row if too wide
    const maxW = W - 80;
    const scrollMax = Math.max(0, totalW - maxW);
    if (winStats._gScroll == null) winStats._gScroll = 0;
    if (justPressed["arrowleft"] || justPressed["a"]) winStats._gScroll = Math.max(0, winStats._gScroll - 80);
    if (justPressed["arrowright"] || justPressed["d"]) winStats._gScroll = Math.min(scrollMax, winStats._gScroll + 80);
    const origin = (W - Math.min(totalW, maxW)) / 2 - winStats._gScroll;
    ctx.save();
    ctx.beginPath();
    ctx.rect(40, 160, W - 80, ch + 40);
    ctx.clip();
    for (let i = 0; i < gained.length; i++) {
      const babe = babeById(gained[i]);
      if (!babe) continue;
      const x = origin + i * (cw + gap);
      drawCard(babe, x, 168, cw, ch, { showRarity: false });
    }
    ctx.restore();
    if (scrollMax > 0) {
      ctx.fillStyle = "#888";
      ctx.font = "11px sans-serif";
      ctx.fillText("← → scroll", W / 2, 168 + ch + 28);
    }
  }

  ctx.fillStyle = "#ffe66d";
  ctx.font = "bold 16px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(isTouch ? "Tap to Restart" : "Press R or Enter to Restart", W / 2, H - 48);
  ctx.fillStyle = "#aaa";
  ctx.font = "13px sans-serif";
  ctx.fillText("Press C to view full babe gallery", W / 2, H - 26);
}

function frame(dt) {
  if (state === "title") {
    drawTitle();
    if (justPressed[" "] || justPressed["enter"]) {
      resetLevel(true);
      state = "play";
      ensureAudio();
    }
    return;
  }

  if (state === "collection") {
    if (slot) updateSlot(dt);
    updateParticles(dt);
    drawBackground();
    drawWorld();
    drawHUD();
    if (slot) drawSlot();
    drawCollection();
    if (justPressed["c"] || (justPressed["escape"] && !gallery.selected)) {
      gallery.selected = null;
      state = "play";
    }
    return;
  }

  if (state === "win") {
    if (slot) updateSlot(dt);
    updateParticles(dt);
    drawBackground();
    drawWorld();
    drawHUD();
    if (slot) drawSlot();
    drawWin();
    if (justPressed["r"] || justPressed["enter"]) {
      resetLevel(true);
      state = "play";
    }
    if (justPressed["c"]) state = "collection";
    return;
  }

  // update — gameplay + slot overlay run together
  updateParticles(dt);
  updateHudTray(dt);
  if (slot) updateSlot(dt);
  if (state === "play") {
    updatePlay(dt);
    if (justPressed["c"]) state = "collection";
  } else if (state === "dead") {
    updateDead(dt);
  }

  // draw
  drawBackground();
  drawWorld();
  drawHUD();
  if (state === "dead") drawDead();
  // Slot overlay stays on top (including over death) so the roll remains visible
  if (slot) drawSlot();
}

// ---------- Main loop ----------
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  frame(dt);
  // clear justPressed at end of frame
  for (const k in justPressed) delete justPressed[k];
  requestAnimationFrame(loop);
}

// Fit canvas
function fit() {
  // Letterbox: scale canvas to fit while keeping 16:9 game aspect
  const r = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cssW = Math.max(1, Math.floor(W * r));
  const cssH = Math.max(1, Math.floor(H * r));
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  updateRotateHint();
}
window.addEventListener("resize", () => { fit(); });
fit();
updateRotateHint();

resetLevel(true);
state = "title";
requestAnimationFrame(loop);

// Expose for headless testing
window.__HBC = {
  getState: () => state,
  setState: (s) => { state = s; },
  getPlayer: () => player,
  getCoins: () => coins,
  getEnemies: () => enemies,
  getHearts: () => hearts,
  getCollection: () => collection,
  getSlot: () => slot,
  getSlotQueue: () => slotQueue,
  getCardAspect: () => CARD_ASPECT,
  getCardLayouts: () => {
    const slot = { w: 72 * 0.7, h: cardHeight(72 * 0.7) };
    const collection = { w: 100, h: cardHeight(100) };
    const title = { w: 90, h: cardHeight(90) };
    const world = { w: 15, h: cardHeight(15) };
    const death = { w: 140, h: cardHeight(140) };
    const win = { w: 72, h: cardHeight(72) };
    const hud = { w: 28, h: cardHeight(28) };
    return {
      aspect: CARD_ASPECT,
      poolSize: BABE_POOL.length,
      slot: { ...slot, ratio: slot.w / slot.h },
      collection: { ...collection, ratio: collection.w / collection.h },
      title: { ...title, ratio: title.w / title.h },
      worldPickup: { ...world, ratio: world.w / world.h },
      miniDeath: { ...death, ratio: death.w / death.h },
      miniWin: { ...win, ratio: win.w / win.h },
      hudLive: { w: HUD_CW, h: cardHeight(HUD_CW), ratio: HUD_CW / cardHeight(HUD_CW) },
    };
  },
  getLoseAnim: () => loseAnim,
  setLoseAnimT: (v) => { if (loseAnim) loseAnim.t = v; },
  getLostXStroke: () => LOST_X_STROKE,
  getCenteredCard: () => {
    if (!slot) return null;
    const idx = Math.round(slot.offset);
    return slot.strip[idx] || null;
  },
  startPlay: () => { resetLevel(true); state = "play"; },
  forceCoin: () => {
    const c = coins.find(x => !x.collected);
    if (c) { player.x = c.x - 4; player.y = c.y - player.h + 4; }
  },
  triggerCoin: () => {
    const c = coins.find(x => !x.collected);
    if (!c) return false;
    c.collected = true;
    onCoinCollected();
    return true;
  },
  openCollection: () => { state = "collection"; gallery.selected = null; },
  setGalleryFilter: (f) => { gallery.filter = f; gallery.scroll = 0; },
  getGallery: () => gallery,
  getBabePool: () => BABE_POOL,
  getRunGained: () => runGained,
  getHudTray: () => hudTray,
  focusHudOnBabe: (id) => focusHudOnBabe(id),
};
</script>
