<title>Hot Babe Collector — Big Salty Gaming Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1020;
    font-family: "Segoe UI", system-ui, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #120818;
  }
  canvas#game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #2a1840;
    box-shadow: 0 0 40px rgba(255,80,140,0.25);
    touch-action: none;
  }
  #touch {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #touch.show { display: block; }
  .tbtn {
    position: absolute;
    pointer-events: auto;
    width: 78px; height: 78px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10); /* ~90% transparent fill */
    border: 3px solid rgba(255,255,255,0.30); /* ~70% transparent outline */
    color: rgba(255,255,255,0.30); /* ~70% transparent glyph */
    font-size: 26px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .tbtn:active, .tbtn.active {
    background: rgba(255,120,180,0.28);
    border-color: rgba(255,255,255,0.45);
    color: rgba(255,255,255,0.55);
    transform: scale(0.96);
  }
  #tLeft  { left: max(16px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom)); }
  #tRight { left: calc(max(16px, env(safe-area-inset-left)) + 90px); bottom: max(24px, env(safe-area-inset-bottom)); }
  #tJump  {
    right: max(16px, env(safe-area-inset-right));
    bottom: max(24px, env(safe-area-inset-bottom));
    width: 96px; height: 96px; font-size: 30px;
  }
  /* Collection — top-left pill, below heart row so it clears HUD */
  #tColl  {
    left: max(12px, env(safe-area-inset-left));
    top: max(52px, calc(env(safe-area-inset-top) + 44px));
    width: auto;
    min-width: 108px;
    height: 40px;
    padding: 0 14px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  #fsBtn {
    position: absolute;
    right: max(12px, env(safe-area-inset-right));
    top: max(12px, env(safe-area-inset-top));
    z-index: 12;
    pointer-events: auto;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.30);
    background: rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.30);
    font-size: 12px;
    font-weight: bold;
    display: none;
    touch-action: none;
  }
  #fsBtn.show { display: block; }
  #fsBtn:active { background: rgba(255,120,180,0.28); color: rgba(255,255,255,0.55); border-color: rgba(255,255,255,0.45); }
  #muteBtn {
    position: absolute;
    right: max(12px, env(safe-area-inset-right));
    top: max(48px, calc(env(safe-area-inset-top) + 44px));
    z-index: 12;
    pointer-events: auto;
    width: 40px; height: 40px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.30);
    background: rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.45);
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: pointer;
  }
  #muteBtn:active { background: rgba(255,120,180,0.28); color: rgba(255,255,255,0.55); border-color: rgba(255,255,255,0.45); }
  @media (orientation: portrait) {
    #muteBtn { right: max(10px, env(safe-area-inset-right)); top: max(44px, calc(env(safe-area-inset-top) + 40px)); width: 36px; height: 36px; font-size: 16px; }
  }
  /* Portrait: keep controls usable without blocking the letterboxed canvas */
  @media (orientation: portrait) {
    .tbtn { width: 72px; height: 72px; font-size: 24px; }
    #tJump { width: 84px; height: 84px; font-size: 26px; }
    #tLeft  { left: max(12px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); }
    #tRight { left: calc(max(12px, env(safe-area-inset-left)) + 78px); bottom: max(18px, env(safe-area-inset-bottom)); }
    #tJump  { right: max(12px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); }
    #tColl  {
      left: max(10px, env(safe-area-inset-left));
      top: max(48px, calc(env(safe-area-inset-top) + 40px));

      padding: 0 12px;
      border-radius: 18px;
      font-size: 12px;
    }
    #fsBtn  { right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); font-size: 11px; padding: 6px 10px; }
  }
</style>

<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="touch">
    <button type="button" class="tbtn" id="tLeft" aria-label="Left">◀</button>
    <button type="button" class="tbtn" id="tRight" aria-label="Right">▶</button>
    <button type="button" class="tbtn" id="tJump" aria-label="Jump">▲</button>
    <button type="button" class="tbtn" id="tColl" aria-label="Collection">Collection</button>
  </div>
  <button type="button" id="fsBtn" aria-label="Fullscreen">⛶ Full</button>
  <button type="button" id="muteBtn" aria-label="Mute" title="Mute (M)">🔊</button>
</div>
<script>
"use strict";

// ============================================================
// Hot Babe Collector — Big Salty Gaming Studio
// Prototype: self-contained Canvas 2D platformer
// ============================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

// ---------- Pixel-art hero (32×48, faces right; flip for left) ----------
// Set true to use hero_idle_side.png for idle instead of front-facing breath cycle
const HERO_IDLE_USE_SIDE = false;
const HERO_SW = 32;
const HERO_SH = 48;
// Opaque idle ≈ (1,0)–(28,47). Slim collision inset; feet = sprite bottom.
const HERO_INSET_X = 7;  // → hitbox width 18
const HERO_INSET_TOP = 4; // → hitbox height 44
const PLAYER_W = HERO_SW - HERO_INSET_X * 2; // 18
const PLAYER_H = HERO_SH - HERO_INSET_TOP;   // 44
const HERO_IDLE_MS = 500;
const HERO_RUN_MS = 90;
const HERO_DEAD_MS = 260;
const DEATH_CRY_SCALE = 6; // 32×48 → 192×288
const DEATH_FLASH_HOLD = 0.08; // full white before black cry
const DEATH_FLASH_FADE = 0.10; // white → black+cry

const heroSprites = {
  ready: false,
  failed: false,
  idle: [null, null],      // front breath
  idleSide: null,
  runSheet: null,          // 192×48, 6 frames
  jumpUp: null,
  jumpFall: null,
  hurt: null,
  dead: [null, null],
};

function loadImg(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

async function preloadHeroSprites() {
  const base = "art/hero/pixel/";
  const [
    idle0, idle1, idleSide, runSheet,
    jumpUp, jumpFall, hurt, dead0, dead1,
  ] = await Promise.all([
    loadImg(base + "hero_idle.png"),
    loadImg(base + "hero_idle_1.png"),
    loadImg(base + "hero_idle_side.png"),
    loadImg(base + "hero_run_sheet.png"),
    loadImg(base + "hero_jump_up.png"),
    loadImg(base + "hero_jump_fall.png"),
    loadImg(base + "hero_hurt.png"),
    loadImg(base + "hero_dead_0.png"),
    loadImg(base + "hero_dead_1.png"),
  ]);
  heroSprites.idle = [idle0, idle1];
  heroSprites.idleSide = idleSide;
  heroSprites.runSheet = runSheet;
  heroSprites.jumpUp = jumpUp;
  heroSprites.jumpFall = jumpFall;
  heroSprites.hurt = hurt;
  heroSprites.dead = [dead0, dead1];
  const need = [idle0, idle1, runSheet, jumpUp, jumpFall, hurt, dead0, dead1];
  heroSprites.failed = need.some(im => !im);
  heroSprites.ready = !heroSprites.failed;
  return heroSprites.ready;
}

// Test/screenshot pose override: "idle"|"run"|"jumpUp"|"jumpFall"|"hurt"|"dead"|null
let debugHeroPose = null;

function heroFrameForState() {
  const pose = debugHeroPose || (
    (state === "dead" || state === "dying") ? "dead" :
    player.stun > 0 ? "hurt" :
    !player.onGround ? (player.vy < 0 ? "jumpUp" : "jumpFall") :
    Math.abs(player.vx) > 30 ? "run" : "idle"
  );
  if (pose === "dead") {
    // When dying: animT reset to 0 as black cry (+audio) starts — synced to 260ms beats
    const ms = (state === "dying" && deathCry && deathCry.animStarted)
      ? deathCry.animT * 1000
      : performance.now();
    const fi = Math.floor((ms / HERO_DEAD_MS) % 2);
    return { img: heroSprites.dead[fi], sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  if (pose === "hurt") {
    return { img: heroSprites.hurt, sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  if (pose === "jumpUp") {
    return { img: heroSprites.jumpUp, sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  if (pose === "jumpFall") {
    return { img: heroSprites.jumpFall, sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  if (pose === "run") {
    const fi = Math.floor((performance.now() / HERO_RUN_MS) % 6);
    return { img: heroSprites.runSheet, sx: fi * HERO_SW, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  // idle
  if (HERO_IDLE_USE_SIDE && heroSprites.idleSide) {
    return { img: heroSprites.idleSide, sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  const fi = Math.floor((performance.now() / HERO_IDLE_MS) % 2);
  return { img: heroSprites.idle[fi], sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
}

function drawHeroSprite() {
  const fr = heroFrameForState();
  if (!fr.img) return false;
  const px = Math.floor(player.x + player.w / 2);
  const py = Math.floor(player.y + player.h);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(px, py);
  if (player.facing < 0) ctx.scale(-1, 1);
  ctx.drawImage(fr.img, fr.sx, fr.sy, fr.sw, fr.sh, -Math.floor(HERO_SW / 2), -HERO_SH, HERO_SW, HERO_SH);
  ctx.restore();
  return true;
}

function drawPlayerFallback() {
  const px = player.x, py = player.y;
  ctx.fillStyle = "#6ec8ff";
  roundRect(px, py + 8, player.w, player.h - 8, 4);
  ctx.fill();
  ctx.fillStyle = "#ffdbb0";
  ctx.fillRect(px + 2, py, player.w - 4, 14);
  ctx.fillStyle = "#ff5a9a";
  ctx.fillRect(px + 1, py - 2, player.w - 2, 6);
  ctx.fillStyle = "#222";
  const ex = player.facing >= 0 ? px + player.w - 8 : px + 4;
  ctx.fillRect(ex, py + 5, 3, 3);
  const leg = Math.sin(player.anim) * (player.onGround && Math.abs(player.vx) > 30 ? 4 : 0);
  ctx.fillStyle = "#3a6a9a";
  ctx.fillRect(px + 2, py + player.h - 8, 5, 8 + leg);
  ctx.fillRect(px + player.w - 7, py + player.h - 8, 5, 8 - leg);
}

function drawPlayer() {
  // Invulnerability flash (also during death we still draw)
  if (state !== "dead" && state !== "dying" && player.flash > 0 && Math.floor(player.flash * 12) % 2 !== 0) return;
  if (heroSprites.ready && drawHeroSprite()) return;
  drawPlayerFallback();
}


// ---------- WebAudio SFX + Music Macky death cry ----------
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
let masterGain = null;
const MUTE_KEY = "hbc_muted";
let muted = false;
try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (_) {}

function ensureAudio() {
  if (!actx) {
    actx = new AudioCtx();
    masterGain = actx.createGain();
    masterGain.gain.value = muted ? 0 : 1;
    masterGain.connect(actx.destination);
  }
  if (actx.state === "suspended") actx.resume();
  if (masterGain) masterGain.gain.value = muted ? 0 : 1;
}

function setMuted(v) {
  muted = !!v;
  try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch (_) {}
  if (masterGain) masterGain.gain.value = muted ? 0 : 1;
  if (cryHtmlAudio) cryHtmlAudio.muted = muted;
  if (cryLoopHtmlAudio) cryLoopHtmlAudio.muted = muted;
  if (bgm.html) bgm.html.muted = muted;
  const btn = document.getElementById("muteBtn");
  if (btn) {
    btn.textContent = muted ? "🔇" : "🔊";
    btn.setAttribute("aria-label", muted ? "Unmute" : "Mute");
  }
}

function beep(freq, dur, type, vol, slide) {
  try {
    ensureAudio();
    if (muted) return;
    const t0 = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(masterGain || actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (_) {}
}
const sfx = {
  jump:  () => beep(420, 0.12, "square", 0.07, 280),
  coin:  () => { beep(880, 0.08, "square", 0.06); setTimeout(() => beep(1175, 0.12, "square", 0.05), 60); },
  tick:  () => beep(600 + Math.random() * 400, 0.03, "triangle", 0.035),
  hit:   () => beep(160, 0.25, "sawtooth", 0.09, 60),
  stomp: () => beep(200, 0.1, "square", 0.07, 80),
  lose:  () => { beep(300, 0.2, "sawtooth", 0.08, 100); setTimeout(() => beep(150, 0.3, "sawtooth", 0.07, 50), 180); },
  win:   () => { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.18, "square", 0.06), i*120)); },
  new:   () => { beep(700, 0.1, "square", 0.06); setTimeout(() => beep(1050, 0.2, "square", 0.06), 100); },
};

// Death cry (Music Macky): 1.500s one-shot, sobs on 260ms beats
const CRY_VOLUME = 0.25; // relative to prior full-level cry (other SFX unchanged)
const cryAudio = {
  oneshotBuf: null,
  loopBuf: null,       // available; only if dying ever exceeds 1.5s
  oneshotUrl: null,
  loopUrl: null,
  ready: false,
  source: null,        // active BufferSource
  loopSource: null,
  startedAt: null,     // actx.currentTime or performance when started
  playing: false,
};
let cryHtmlAudio = null;
let cryLoopHtmlAudio = null;

function pickAudioUrl(baseNoExt) {
  const probe = document.createElement("audio");
  const ogg = probe.canPlayType('audio/ogg; codecs="vorbis"') || probe.canPlayType("audio/ogg");
  if (ogg && ogg !== "no") return baseNoExt + ".ogg";
  return baseNoExt + ".mp3";
}

async function fetchDecode(url) {
  ensureAudio();
  const res = await fetch(url);
  if (!res.ok) throw new Error("fetch " + url + " " + res.status);
  const ab = await res.arrayBuffer();
  return await actx.decodeAudioData(ab.slice(0));
}

async function preloadCryAudio() {
  cryAudio.oneshotUrl = pickAudioUrl("audio/cry_death");
  cryAudio.loopUrl = pickAudioUrl("audio/cry_death_loop");
  // Prefer OGG path when supported; pickAudioUrl already chose
  try {
    ensureAudio();
    cryAudio.oneshotBuf = await fetchDecode(cryAudio.oneshotUrl);
    try { cryAudio.loopBuf = await fetchDecode(cryAudio.loopUrl); } catch (_) { cryAudio.loopBuf = null; }
    cryAudio.ready = true;
  } catch (e) {
    // file:// or decode failure → HTMLAudioElement fallback
    console.warn("[HBC] WebAudio cry decode failed, using HTMLAudioElement", e && e.message);
    cryHtmlAudio = new Audio(cryAudio.oneshotUrl);
    cryHtmlAudio.preload = "auto";
    cryLoopHtmlAudio = new Audio(cryAudio.loopUrl);
    cryLoopHtmlAudio.preload = "auto";
    cryLoopHtmlAudio.loop = true;
    cryAudio.ready = true;
  }
}

function stopDeathCry() {
  try {
    if (cryAudio.source) {
      try { cryAudio.source.stop(0); } catch (_) {}
      cryAudio.source.disconnect();
      cryAudio.source = null;
    }
    if (cryAudio.loopSource) {
      try { cryAudio.loopSource.stop(0); } catch (_) {}
      cryAudio.loopSource.disconnect();
      cryAudio.loopSource = null;
    }
  } catch (_) {}
  if (cryHtmlAudio) { try { cryHtmlAudio.pause(); cryHtmlAudio.currentTime = 0; } catch (_) {} }
  if (cryLoopHtmlAudio) { try { cryLoopHtmlAudio.pause(); cryLoopHtmlAudio.currentTime = 0; } catch (_) {} }
  cryAudio.playing = false;
  cryAudio.startedAt = null;
  duckBgm(false);
}

/** Start one-shot once; no stack. Syncs with dead-anim frame 0. */
function playDeathCry() {
  if (cryAudio.playing) return; // no double-play
  ensureAudio();
  stopDeathCry(); // clear any stray
  cryAudio.playing = true;
  const wall = performance.now();
  try {
    if (cryAudio.oneshotBuf && actx) {
      const src = actx.createBufferSource();
      src.buffer = cryAudio.oneshotBuf;
      const cryGain = actx.createGain();
      cryGain.gain.value = CRY_VOLUME;
      src.connect(cryGain);
      cryGain.connect(masterGain || actx.destination);
      src.onended = () => {
        if (cryAudio.source === src) {
          cryAudio.source = null;
          cryAudio.playing = false;
          duckBgm(false);
        }
      };
      cryAudio.source = src;
      cryAudio.startedAt = actx.currentTime;
      duckBgm(true);
      src.start(0);
      console.log("[HBC] cry_death start (WebAudio)", { wallMs: wall, ctxT: cryAudio.startedAt, animT: 0 });
      return;
    }
  } catch (e) {
    console.warn("[HBC] cry BufferSource failed", e);
  }
  // HTMLAudio fallback
  if (!cryHtmlAudio) cryHtmlAudio = new Audio(cryAudio.oneshotUrl || "audio/cry_death.mp3");
  cryHtmlAudio.muted = muted;
  cryHtmlAudio.volume = CRY_VOLUME;
  cryHtmlAudio.currentTime = 0;
  cryAudio.startedAt = wall / 1000;
  duckBgm(true);
  const p = cryHtmlAudio.play();
  if (p && p.catch) p.catch(() => {});
  console.log("[HBC] cry_death start (HTMLAudio)", { wallMs: wall, animT: 0 });
}

// ---------- Background music ----------
// One looping track for the whole session: starts on the first key/tap (audio unlock) and is never
// restarted — deaths, slot rolls, level changes and the gallery leave it alone. Routed through
// masterGain so the mute toggle silences it; ducked briefly under the death cry.
const BGM_VOLUME = 0.35;   // relative to master (SFX beeps / cry sit above it)
const BGM_DUCK = 0.4;      // music multiplier while the death cry plays
const bgm = {
  url: null, buf: null, html: null, src: null, gain: null,
  wanted: false,     // set by the first user gesture
  starts: 0,         // times the loop was (re)started — should stay 1 per page load
  t0: 0, offset: 0, loopStart: 0, loopEnd: 0, failed: false, mode: null,
};
// Trim codec padding / dead air at both ends so the wrap has no audible gap
function bgmLoopPoints(buf) {
  // 10 ms windows; a window counts as silent when its RMS is under -50 dBFS (lossy codecs leave faint noise)
  const ch = [];
  for (let c = 0; c < buf.numberOfChannels; c++) ch.push(buf.getChannelData(c));
  const win = Math.max(1, Math.floor(buf.sampleRate * 0.01)), th2 = 0.00316 * 0.00316;
  const loudWin = (i0) => {
    let sum = 0, n = 0;
    for (const d of ch) for (let i = i0; i < Math.min(i0 + win, d.length); i++) { sum += d[i] * d[i]; n++; }
    return n && sum / n > th2;
  };
  const maxTrim = Math.floor(buf.sampleRate * 0.6);
  let a = 0, b = buf.length;
  while (a < maxTrim && !loudWin(a)) a += win;
  while (buf.length - b < maxTrim && !loudWin(b - win)) b -= win;
  return { start: a / buf.sampleRate, end: b / buf.sampleRate };
}
async function loadBgm() {
  bgm.url = pickAudioUrl("audio/bgm_main");
  try {
    bgm.buf = await fetchDecode(bgm.url);
    const lp = bgmLoopPoints(bgm.buf);
    bgm.loopStart = lp.start; bgm.loopEnd = lp.end;
    bgm.mode = "webaudio";
  } catch (e) {
    console.warn("[HBC] music decode failed, using HTMLAudio loop", e && e.message);
    bgm.html = new Audio(bgm.url);
    bgm.html.loop = true;
    bgm.html.preload = "auto";
    bgm.html.volume = BGM_VOLUME;
    bgm.html.muted = muted;
    bgm.mode = "html";

const debugPulls = [];

// Returns a babe that isn't maxed, or null when all babes are maxed.
function rollCharacter() {
  // Debug forced pulls never plant a maxed babe (maxed ids are skipped)
  while (debugPulls.length) {
    const forced = babeById(debugPulls.shift());
    if (forced && !isMaxed(forced.id)) return forced;
  }
  if (debugRarity) {
    const tierPool = BABE_POOL.filter(c => c.rarity === debugRarity && !isMaxed(c.id));
    if (tierPool.length) return tierPool[Math.floor(Math.random() * tierPool.length)];
  }
  // Tier first (88% / 10% / 2%), then uniform among that tier's non-maxed babes.
  // Fully maxed tiers drop out and the roll is redone over the remaining tiers,
  // keeping their relative weights.
  const tiers = RARITIES
    .map(r => ({ r, pool: BABE_POOL.filter(c => c.rarity === r.id && !isMaxed(c.id)) }))
    .filter(t => t.pool.length > 0);
  if (!tiers.length) return null;
  const total = tiers.reduce((s, t) => s + t.r.weight, 0);
  let n = Math.random() * total;
  let pick = tiers[tiers.length - 1];
  for (const t of tiers) { n -= t.r.weight; if (n <= 0) { pick = t; break; } }
  return pick.pool[Math.floor(Math.random() * pick.pool.length)];
}

const SAVE_KEY = "hbc_collection_v1";

function migrateCollectionCounts(col, legacy) {
  if (!col || typeof col !== "object") return {};
  const out = {};
  for (const [k, v] of Object.entries(col)) {
    const n = +v || 0;
    if (!(n > 0)) continue;
    if (legacy && LEGACY_PLACEHOLDER_IDS.has(k)) continue; // old placeholder, not the real girl
    const id = BABE_ID_MIGRATE[k] || k;

      const obj = JSON.parse(v2);
      if (obj && typeof obj === "object" && obj.counts && typeof obj.counts === "object") {
        counts = obj.counts;
        legacy = obj.roster !== ROSTER_VERSION;
      }
    }
    if (!counts) {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return {};
      const obj = JSON.parse(raw);
      if (obj && typeof obj === "object") counts = obj;
    }
    if (!counts) return {};
    const migrated = migrateCollectionCounts(counts, legacy);
    // Persist cleaned map so removed ids don't linger
    try {

// ---------- Drawing helpers ----------
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawSilhouette(cx, cy, size, shape, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  ctx.translate(cx, cy);
  const s = size;
  if (shape === "hourglass") {
    // stylized figure: head + torso
    ctx.beginPath();
    ctx.arc(0, -s*0.38, s*0.16, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s*0.12, -s*0.2);
    ctx.lineTo(s*0.12, -s*0.2);
    ctx.lineTo(s*0.22, s*0.15);
    ctx.lineTo(s*0.1, s*0.15);
    ctx.lineTo(s*0.14, s*0.45);
    ctx.lineTo(-s*0.14, s*0.45);
    ctx.lineTo(-s*0.1, s*0.15);
    ctx.lineTo(-s*0.22, s*0.15);
    ctx.closePath();
    ctx.fill();
  } else if (shape === "star") {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI/2 + i * Math.PI*2/5;
      const a2 = a + Math.PI/5;
      ctx.lineTo(Math.cos(a)*s*0.45, Math.sin(a)*s*0.45);
      ctx.lineTo(Math.cos(a2)*s*0.18, Math.sin(a2)*s*0.18);
    }
    ctx.closePath();
    ctx.fill();
  } else if (shape === "diamond") {
    ctx.beginPath();
    ctx.moveTo(0, -s*0.45); ctx.lineTo(s*0.35, 0); ctx.lineTo(0, s*0.45); ctx.lineTo(-s*0.35, 0);
    ctx.closePath(); ctx.fill();
  } else if (shape === "heart") {
    ctx.beginPath();
    ctx.moveTo(0, s*0.3);
    ctx.bezierCurveTo(s*0.45, s*0.05, s*0.4, -s*0.3, 0, -s*0.15);
    ctx.bezierCurveTo(-s*0.4, -s*0.3, -s*0.45, s*0.05, 0, s*0.3);
    ctx.fill();
  } else { // circle
    ctx.beginPath();
    ctx.arc(0, 0, s*0.38, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// Canonical card aspect (width/height) from slot-roll card 72×96
const CARD_ASPECT = 72 / 96; // 3/4
function cardHeight(w) { return w / CARD_ASPECT; }
function cardWidth(h) { return h * CARD_ASPECT; }

// Iris cardbacks only (front art TBD). Graceful null → procedural.
const cardImgs = {
  ready: false,
  mystery: { sm: null, md: null, lg: null },
  normal: { sm: null, md: null, lg: null },
};

function pickCardSizeKey(drawW) {
  if (drawW <= 40) return "sm";
  if (drawW <= 200) return "md";
  return "lg";
}

function drawCardBitmap(img, x, y, w, h, smooth) {
  if (!img || !img.complete || img.naturalWidth < 1) return false;
  const ix = Math.floor(x), iy = Math.floor(y);
  const iw = Math.max(1, Math.floor(w)), ih = Math.max(1, Math.floor(h));
  ctx.save();
  ctx.imageSmoothingEnabled = !!smooth;
  if (smooth) ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, ix, iy, iw, ih);
  ctx.restore();
  return true;
}

// ---------- Babe card art (final roster) ----------
// Animation timing (art/cards/rarity/README_rarity.md + final/MANIFEST.md)
const RARITY_ANIM = {
  rare:  { big: { n: 8,  ms: 110, holdMs: 0 },    sm: { n: 4, ms: 180 } },  // shared sheen overlay
  ultra: { big: { n: 12, ms: 70,  holdMs: 1000 }, sm: { n: 4, ms: 180 } },  // baked frames; hold on 11
};
function rarityAnimFrame(tier, sizeKey) {
  const a = RARITY_ANIM[tier];
  const now = performance.now();
  if (sizeKey === "sm") return Math.floor(now / a.sm.ms) % a.sm.n;
  const sweep = a.big.n * a.big.ms;
  const t = now % (sweep + a.big.holdMs);
  return Math.min(a.big.n - 1, Math.floor(t / a.big.ms));
}
function imgOk(im) { return !!(im && im.complete && im.naturalWidth > 0); }

// URL-keyed image cache. img(url) returns a decoded Image or null (and starts loading it).
const IMG_CACHE = new Map(); // url -> Image | null (failed) | "loading"
function img(url) {
  const v = IMG_CACHE.get(url);
  if (v === undefined) { preloadUrls([url]); return null; }
  return imgOk(v) ? v : null;
}
function preloadUrls(urls) {
  return Promise.all(urls.map(u => {
    if (IMG_CACHE.has(u)) return null;
    IMG_CACHE.set(u, "loading");
    return loadImg(u).then(im => {
      IMG_CACHE.set(u, im);
      if (!im) console.warn("[HBC] missing card art", u);
    });
  }));
}

const ART_FILES = { sm: "15x20", md: "110x147", lg: "440x588" };
const pad2 = i => String(i).padStart(2, "0");
/** Static card for a babe at a size (Ultra: the still = frame 00 without shine). */
function babeArtUrl(b, key) {
  const f = ART_FILES[key];
  if (b.rarity === "rare") return "art/cards/final/rare/card_" + b.id + "_rare_" + f + ".png";
  if (b.rarity === "ultra") return "art/cards/final/ultra/card_" + b.id + "_ultra_" + f + ".png";
  return "art/cards/v3/card_" + b.id + "_" + f + ".png";
}
function ultraFrameUrl(b, key, i) {
  return "art/cards/final/ultra/frames/card_" + b.id + "_ultra_" + ART_FILES[key] + "_" + pad2(i) + ".png";
}
function rareSheenUrl(key, i) {
  return "art/cards/rarity/rare/anim_" + ART_FILES[key] + "_" + pad2(i) + ".png";
}
function animFrameCount(tier, key) { const a = RARITY_ANIM[tier]; return key === "sm" ? a.sm.n : a.big.n; }
// Ultra frames stream in per babe+size the first time they're drawn (440s are ~375KB each)
const ultraWarm = new Set();
function warmUltra(b, key) {
  const k = b.id + ":" + key;
  if (ultraWarm.has(k)) return;
  ultraWarm.add(k);
  const urls = [];
  for (let i = 0; i < animFrameCount("ultra", key); i++) urls.push(ultraFrameUrl(b, key, i));
  preloadUrls(urls);
}
function framesReady(b, key) {
  for (let i = 0; i < animFrameCount("ultra", key); i++) if (!img(ultraFrameUrl(b, key, i))) return false;
  return true;
}

/**
 * Draw a babe's final card, uniform 3:4, closest size: 15x20 for tiny spots (nearest-neighbour),
 * 110x147 up to 110px wide, 440x588 above that (lazy; 110 shown while it streams in).
 * Returns false if nothing is loaded yet (caller draws the procedural fallback).
 */
function drawBabeArt(b, x, y, w, h, sizeKey) {
  const want = sizeKey === "sm" ? "sm" : (Math.floor(w) <= 110 ? "md" : "lg");
  const keys = want === "lg" ? ["lg", "md"] : [want];
  for (const key of keys) {
    let base = null;
    if (b.rarity === "ultra") {
      warmUltra(b, key);
      // cycle the baked frames once all of them are in; until then show the still
      base = framesReady(b, key) ? img(ultraFrameUrl(b, key, rarityAnimFrame("ultra", key))) : null;
      if (!base) base = img(babeArtUrl(b, key));
    } else {
      base = img(babeArtUrl(b, key));
    }
    if (!base) continue;
    const smooth = key !== "sm" && Math.floor(w) < base.naturalWidth;
    drawCardBitmap(base, x, y, w, h, smooth);
    if (b.rarity === "rare") {
      const sheen = img(rareSheenUrl(key, rarityAnimFrame("rare", key)));
      if (sheen) drawCardBitmap(sheen, x, y, w, h, smooth);
    }
    return true;
  }
  return false;
}

// First load: every babe's 15x20 + 110x147 still and the small rare sheen frames.
// 440s and the Ultra animation frames load lazily when first drawn.
function preloadBabeArt() {
  const urls = [];
  for (const b of BABE_POOL) for (const key of ["sm", "md"]) urls.push(babeArtUrl(b, key));
  for (const key of ["sm", "md"]) for (let i = 0; i < animFrameCount("rare", key); i++) urls.push(rareSheenUrl(key, i));
  return preloadUrls(urls);
}

async function preloadCardArt() {
  const sizes = [
    ["sm", "15x20"],
    ["md", "110x147"],
    ["lg", "440x588"],
  ];
  const jobs = [];
  for (const [key, file] of sizes) {
    jobs.push(loadImg("art/cards/cardback/A5/cardback_" + file + ".png").then(im => { cardImgs.mystery[key] = im; }));
    jobs.push(loadImg("art/cards/cardback/normal/cardback_" + file + ".png").then(im => { cardImgs.normal[key] = im; }));
  }
  jobs.push(preloadBabeArt());
  await Promise.all(jobs);
  cardImgs.ready = true;
  return true;
}

function drawCard(char, x, y, w, h, opts) {
  opts = opts || {};
  // Uniform scale only — height always derived from width via CARD_ASPECT
  w = +w;
  h = cardHeight(w);
  const rar = rarityOf(char.id);
  const locked = !!opts.locked;
  const glow = opts.glow || 0;
  const iconOnly = !!opts.iconOnly;
  const sizeKey = pickCardSizeKey(w);
  // Smooth only when downscaling large (440) art into big UI views
  const useSmooth = sizeKey === "lg";

  if (glow > 0) {
    ctx.save();
    ctx.shadowColor = rar.color;
    ctx.shadowBlur = 18 * glow;
    roundRect(x, y, w, h, 8);
    ctx.fillStyle = rar.color;
    ctx.fill();
    ctx.restore();
  }

  // Locked / missing: regular cardback (Iris) instead of grey ??? silhouette
  if (locked) {
    const back = cardImgs.normal[sizeKey];
    if (drawCardBitmap(back, x, y, w, h, useSmooth)) {
      // light frame
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 2;
      roundRect(x + 1, y + 1, w - 2, h - 2, 6);
      ctx.stroke();
    } else {
      // procedural fallback
      const g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, "#2a2a32");
      g.addColorStop(1, "#1a1a22");
      roundRect(x, y, w, h, 8);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 3;
      roundRect(x + 1.5, y + 1.5, w - 3, h - 3, 7);
      ctx.stroke();
      drawSilhouette(x + w / 2, y + h * (iconOnly ? 0.52 : 0.42), Math.min(w, h) * 0.55, char.shape, "#3a3a44");
    }
    if (!iconOnly) {
      ctx.textAlign = "center";
      ctx.font = `bold ${Math.max(10, Math.floor(w * 0.12))}px sans-serif`;
      ctx.fillStyle = "#666";
      ctx.fillText("???", x + w / 2, y + h - 12);
    }
    return;
  }

  // Owned: the girl's final card (frame + name banner baked in)
  if (drawBabeArt(char, x, y, w, h, sizeKey)) {
    drawCardBadges(char, x, y, w, h, opts, iconOnly);
    return;
  }

  // Fallback while art loads / if a file is missing: procedural card
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, `hsl(${char.hue}, 70%, 55%)`);
  g.addColorStop(0.55, `hsl(${char.hue + 20}, 65%, 35%)`);
  g.addColorStop(1, `hsl(${char.hue}, 50%, 18%)`);
  roundRect(x, y, w, h, 8);
  ctx.fillStyle = g;
  ctx.fill();
  // Base border (common; also rare/ultra fallback while frames load)
  ctx.strokeStyle = rar.color;
  ctx.lineWidth = 3;
  roundRect(x + 1.5, y + 1.5, w - 3, h - 3, 7);
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1;
  if (iconOnly) roundRect(x + 3, y + 3, w - 6, h - 6, 4);
  else roundRect(x + 8, y + 8, w - 16, h - 28, 4);
  ctx.stroke();
  drawSilhouette(
    x + w / 2,
    y + h * (iconOnly ? 0.52 : 0.42),
    Math.min(w, h) * (iconOnly ? 0.62 : 0.55),
    char.shape,
    "rgba(255,255,255,0.92)"
  );

  if (!iconOnly) {
    ctx.textAlign = "center";
    ctx.font = `bold ${Math.max(10, Math.floor(w * 0.12))}px sans-serif`;
    ctx.fillStyle = "#fff";
    ctx.fillText(char.name, x + w / 2, y + h - 12);
    if (opts.showRarity !== false && !maxTagShown(opts, w, iconOnly)) { // MAX tag takes that corner
      ctx.font = `${Math.max(8, Math.floor(w * 0.08))}px sans-serif`;
      ctx.fillStyle = rar.color;
      ctx.fillText(rar.label, x + w / 2, y + 14);
    }
  }

  drawCardBadges(char, x, y, w, h, opts, iconOnly);
}

function maxTagShown(opts, w, iconOnly) {
  const isMax = opts.max != null ? !!opts.max : (opts.count != null && opts.count >= MAX_COPIES);
  return isMax && !iconOnly && w >= 44;
}
function drawCardBadges(char, x, y, w, h, opts, iconOnly) {
  // MAX tag (owned MAX_COPIES): top-left pill, only where it stays readable
  if (maxTagShown(opts, w, iconOnly)) {
    const fs = Math.max(8, Math.min(12, Math.floor(w * 0.11)));
    ctx.save();
    ctx.font = "bold " + fs + "px sans-serif";
    const tw = Math.ceil(ctx.measureText("MAX").width) + 8;
    const th = fs + 5;
    ctx.fillStyle = "#ffd24a";
    roundRect(x + 4, y + 4, tw, th, 3);
    ctx.fill();
    ctx.strokeStyle = "rgba(60,20,0,0.85)";
    ctx.lineWidth = 1;
    roundRect(x + 4, y + 4, tw, th, 3);
    ctx.stroke();
    ctx.fillStyle = "#3a1600";
    ctx.textAlign = "center";
    ctx.fillText("MAX", x + 4 + tw / 2, y + 4 + th - 4);
    ctx.restore();
  }
  // Dupe badge
  if (opts.count != null && opts.count > 1) {
    if (iconOnly) {
      if (w >= 22) {
        const r = Math.max(5, Math.min(7, w * 0.22));
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.beginPath();
        ctx.arc(x + w - r - 2, y + r + 2, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffe66d";
        ctx.font = "bold " + Math.max(7, Math.floor(r * 1.35)) + "px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(opts.count), x + w - r - 2, y + r + 2.5);
        ctx.textBaseline = "alphabetic";
      }
    } else {
      const bw = Math.max(16, Math.min(22, w * 0.35));
      const bh = Math.max(12, Math.min(16, h * 0.14));
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      roundRect(x + w - bw - 4, y + 4, bw, bh, 3);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold " + Math.max(8, Math.floor(bh * 0.75)) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("x" + opts.count, x + w - bw / 2 - 4, y + 4 + bh * 0.78);
    }
  } else if (!iconOnly && opts.count != null && opts.count > 0) {
    const bw = Math.max(16, Math.min(22, w * 0.35));
    const bh = Math.max(12, Math.min(16, h * 0.14));
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(x + w - bw - 4, y + 4, bw, bh, 3);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold " + Math.max(8, Math.floor(bh * 0.75)) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("x" + opts.count, x + w - bw / 2 - 4, y + 4 + bh * 0.78);
  }
}

// Evenly spread pick of k items from an array (keeps order)
function spreadPick(arr, k) {
  if (k >= arr.length) return arr.slice();
  if (k <= 0) return [];
  const out = [];
  for (let i = 0; i < k; i++) out.push(arr[Math.floor((i + 0.5) * arr.length / k)]);
  return out;
}

const CP_MIN_GAP = 30;
function buildLevel(def, diff) {
  const plats = [], picks = [], slots = [], cps = [], cutSpots = [];
  let ox = 0, goalX = null;
  for (const key of def.sections) {
    const sec = SECTIONS[key];
    for (const [x, y, w, h] of sec.plats) if (w > 0) plats.push({ x: x + ox, y, w, h });
    for (const [x, y] of sec.picks || []) picks.push([x + ox, y]);
    for (const e of sec.enemies || []) slots.push(Object.assign({}, e, { x: e.x + ox, a: e.a + ox, b: e.b + ox }));
    for (const c of sec.cps || []) cps.push(c + ox); // candidates, thinned below
    for (const c of sec.cuts || []) cutSpots.push(c + ox);
    if (sec.goal != null) goalX = sec.goal + ox;
    ox += sec.w;
  }
  const width = ox;
  // Babe pickups: keep dropRate share (1.0 → all)
  const keptPicks = spreadPick(picks, Math.round(picks.length * diff.dropRate));
  // Enemies: tier 1 base, scaled by enemyCount using tier 2 bonus slots
  const t1 = slots.filter(e => e.tier === 1), t2 = slots.filter(e => e.tier !== 1);
  const target = Math.round(t1.length * diff.enemyCount);
  const chosen = target <= t1.length ? spreadPick(t1, target) : t1.concat(spreadPick(t2, target - t1.length));
  chosen.sort((a, b) => a.x - b.x);
  // Checkpoints: keep candidates at least CP_MIN_GAP tiles apart (first one is the start)
  cps.sort((a, b) => a - b);
  const keptCps = [];
  for (const c of cps) if (!keptCps.length || c - keptCps[keptCps.length - 1] >= CP_MIN_GAP) keptCps.push(c);
  // Pits: cut a 2-tile gap into a share of the marked ground spots (never under a pickup/enemy/flag)
  const blocked = x => keptPicks.some(([px]) => Math.abs(px - x) < 3) || chosen.some(e => Math.abs(e.x - x) < 3) ||
    keptCps.some(c => Math.abs(c - x) < 4) || (goalX != null && Math.abs(goalX - x) < 4);
  const freeSpots = cutSpots.filter(x => !blocked(x) && !blocked(x + 1));
  const nCuts = Math.round(freeSpots.length * Math.min(1, 0.35 * diff.pitFreq));
  let cuts = 0;
  for (const cx of spreadPick(freeSpots, nCuts)) {
    const i = plats.findIndex(p => p.y === GROUND_Y && p.x + 1 < cx && p.x + p.w > cx + 3);
    if (i < 0) continue;
    const p = plats[i];
    plats.splice(i, 1, { x: p.x, y: p.y, w: cx - p.x, h: p.h }, { x: cx + 2, y: p.y, w: p.x + p.w - (cx + 2), h: p.h });
    cuts++;
  }
  return {
    id: def.id, name: def.name, theme: LEVEL_THEMES[def.theme] || LEVEL_THEMES.dusk, diff,
    width, plats, picks: keptPicks, enemySlots: chosen, pits: cuts,
    checkpoints: keptCps.map(x => ({ x: x * TILE, y: GROUND_Y * TILE })),
    goal: { x: (goalX != null ? goalX : width - 4) * TILE, y: 12 * TILE, w: 20, h: 96 },
  };
}

// Enemies: type 'walker' | 'hopper'
function enemyOnPlat(type, xTile, platY, w, h, extra) {
  const top = platY * TILE;
  return Object.assign({
    type, x: xTile * TILE, y: top - h, w, h,
    vx: 0, vy: 0, dir: 1, alive: true,
    prevX: xTile * TILE, prevY: top - h,

}

function makeEnemies() {
  const sp = level.diff.enemySpeed;

    return enemyOnPlat(e.type, e.x, e.y, hop ? 26 : 28, hop ? 26 : 28, {
      vx: e.vx * sp, dir: i % 2 ? -1 : 1, minX: e.a * TILE, maxX: e.b * TILE,
      hopT: e.hopT || 0, hopEvery: 1.1 / sp,
    });
  });
}

function solidAt(px, py, pw, ph) {
  // AABB vs platform rects
  for (const p of platforms) {
    const x = p.x*TILE, y = p.y*TILE, w = p.w*TILE, h = p.h*TILE;
    if (px < x+w && px+pw > x && py < y+h && py+ph > y) return {x,y,w,h};
  }
  return null;
}

function resolvePlayer(dt) {
  // horizontal
  player.x += player.vx * dt;
  let hit = solidAt(player.x, player.y, player.w, player.h);
  if (hit) {
    if (player.vx > 0) player.x = hit.x - player.w;
    else if (player.vx < 0) player.x = hit.x + hit.w;
    player.vx = 0;
  }
  // vertical
  player.y += player.vy * dt;
  player.onGround = false;
  hit = solidAt(player.x, player.y, player.w, player.h);
  if (hit) {
    if (player.vy > 0) {
      player.y = hit.y - player.h;
      player.vy = 0;
      player.onGround = true;
    } else if (player.vy < 0) {
      player.y = hit.y + hit.h;
      player.vy = 0;
    }
  }
  // world bounds
  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > LEVEL_W * TILE) { player.x = LEVEL_W*TILE - player.w; player.vx = 0; }
}

function groundUnder(px, feetY) {
  // Thin probe just below feet — true if a platform would catch a landing
  return !!solidAt(px, feetY, player.w, 6);
}

/** Platform top near feet supporting [x,x+w]; prefers the highest (smallest Y) match. */
function platformTopNear(x, w, feetY) {
  let best = null;
  for (const p of platforms) {
    const px = p.x * TILE, py = p.y * TILE, pw = p.w * TILE;
    const overlap = Math.min(x + w, px + pw) - Math.max(x, px);
    if (overlap < 6) continue;
    if (py >= feetY - 4 && py <= feetY + 48) {
      if (best == null || py < best) best = py;
    }
  }
  if (best == null) {
    for (const p of platforms) {
      const px = p.x * TILE, py = p.y * TILE, pw = p.w * TILE;
      const overlap = Math.min(x + w, px + pw) - Math.max(x, px);
      if (overlap < 6) continue;
      if (Math.abs(py - feetY) <= 8) {
        if (best == null || py < best) best = py;
      }
    }
  }
  return best;
}

function hurtPlayer(fromX) {
  if (invuln > 0 || player.stompGrace > 0 || state !== "play") return;
  hearts--;
  invuln = 1.4;
  player.flash = 1.4;
  // Bounce away from the enemy: horizontal knockback + small upward pop
  let dir = (player.x + player.w / 2 < fromX) ? -1 : 1;
  const feet = player.y + player.h;
  const probe = 56; // ~1.75 tiles ahead
  const awayHasGround = groundUnder(player.x + dir * probe, feet) ||
    groundUnder(player.x + dir * probe, feet + TILE);
  const towardHasGround = groundUnder(player.x - dir * probe, feet) ||
    groundUnder(player.x - dir * probe, feet + TILE);
  // Avoid knocking the player straight into a pit (unfair death loop near edges)
  let kb = 290;
  if (!awayHasGround) {
    if (towardHasGround) dir = -dir;
    else { dir = 0; kb = 0; } // pit both ways — just pop up in place
  }
  player.vx = dir * kb;
  player.vy = -280;
  player.onGround = false;
  player.stun = 0.25; // brief loss of control so knockback reads
  player.jumpBuf = 0;
  sfx.hit();
  spawnParticles(player.x + player.w/2, player.y + player.h/2, "#ff4466", 10);
  if (hearts <= 0) {
    onHeartsZero();
  }
}

function seatPlayerForDeathCry() {
  player.vx = 0;
  player.vy = 0;
  player.stun = 0;
  player.flash = 0;
  player.jumpBuf = 0;
  player.fromStomp = false;
  // Snap onto solid ground underfoot so the cry reads clearly (pit path already parked at checkpoint)
  const top = platformTopNear(player.x, player.w, player.y + player.h);
  if (top != null) {
    player.y = top - player.h;
    player.onGround = true;
  }
  // Keep camera locked on him
  cameraX = Math.max(0, Math.min(player.x - W * 0.38, LEVEL_W * TILE - W));
}

function onHeartsZero() {

function beginOuchScreen() {

function updateDying(dt) {
  if (!deathCry) { beginOuchScreen(); return; }
  deathCry.t += dt;
  player.vx = 0;
  player.vy = 0;
  // Start cry audio + dead-anim frame 0 exactly when black cry screen begins (after white flash hold)
  if (!deathCry.cryStarted && deathCry.t >= DEATH_FLASH_HOLD) {
    deathCry.cryStarted = true;
    deathCry.animStarted = true;
    deathCry.animT = 0;
    playDeathCry();
  }
  if (deathCry.animStarted) deathCry.animT += dt;
  maybeStartCryLoop(); // only if somehow past 1.5s
  // Enemies frozen (no update) — cannot re-hit
  if (deathCry.t >= deathCry.dur) beginOuchScreen();
}

/** Full-screen black + zoomed cry loop (integer scale, crisp). */
function drawDyingCry() {
  const t = deathCry ? deathCry.t : 0;
  // Phase 1: solid white flash (covers everything)
  if (t < DEATH_FLASH_HOLD) {
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, W, H);
    return;
  }
  // Phase 2+: black + cry, with optional white fade overlay
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  const fr = heroFrameForState();
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  const dw = HERO_SW * DEATH_CRY_SCALE;
  const dh = HERO_SH * DEATH_CRY_SCALE;
  const dx = Math.floor((W - dw) / 2);
  const dy = Math.floor((H - dh) / 2);
  if (fr.img) {
    ctx.drawImage(fr.img, fr.sx, fr.sy, fr.sw, fr.sh, dx, dy, dw, dh);
  } else {
    ctx.fillStyle = "#6ec8ff";
    ctx.fillRect(dx + dw * 0.25, dy + dh * 0.2, dw * 0.5, dh * 0.7);
  }
  ctx.restore();
  // White fade into black cry (~0.1s); folded into the same 1.5s window
  const fadeT = t - DEATH_FLASH_HOLD;
  if (fadeT < DEATH_FLASH_FADE) {
    ctx.fillStyle = "#fff";
    ctx.globalAlpha = 1 - fadeT / DEATH_FLASH_FADE;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*220,
      vy: (Math.random()-0.8)*260,
      life: 0.4 + Math.random()*0.5,

    });

}

// Post-roll callout ("NEW! <name> · Common", "★ RARE DUPE x2 — <name>", …)
// Pop in, hold at full opacity, then fade smoothly to 0.
const CALLOUT_IN = 0.2;    // pop-in (unchanged)
const CALLOUT_HOLD = 1.4;  // full opacity: old ~0.4s visible time + 1.0s
const CALLOUT_OUT = 0.45;  // smooth fade-out
const CALLOUT_H = 36, CALLOUT_GAP = 6;
// Callouts sit where the roll panel was; if a (queued) roll is on screen they
// slide just below the panel so the next roll never hides them.
function calloutBaseY() {
  return slot ? SLOT_PANEL_Y + SLOT_PANEL_H + 8 : 56;
}
function addCallout(text, color) {
  callouts.push({ text, color, t: 0, dur: CALLOUT_IN + CALLOUT_HOLD + CALLOUT_OUT, y: null });
}
function calloutAlpha(c) {
  if (c.t < CALLOUT_IN) return c.t / CALLOUT_IN;
  const fadeStart = CALLOUT_IN + CALLOUT_HOLD;
  if (c.t <= fadeStart) return 1;
  const u = Math.min(1, (c.t - fadeStart) / CALLOUT_OUT);
  return 1 - u * u * (3 - 2 * u); // smoothstep 1 → 0
}

function beginSlotRoll() {
  // Precompute result and plant it at targetIndex BEFORE spinning.
  // Offset eases exactly to that index — no end snap/swap.
  const result = rollCharacter();
  if (!result) { addCallout("All babes maxed out!", "#ffe66d"); return false; }
  // Start streaming the result's slot-size art now so it's animated when it lands
  if (result.rarity === "ultra") warmUltra(result, "md"); else img(babeArtUrl(result, "md"));
  const targetIndex = 24;
  const strip = [];
  // Filler: babes still in the pool (fall back to everyone when few remain, so the strip looks full)
  const avail = pullableBabes();
  const filler = avail.length >= 4 ? avail : CHAR_DEFS;
  const others = filler.filter(b => b.id !== result.id);
  for (let i = 0; i < targetIndex; i++) {
    // keep approach cards visually distinct from the result
    const src = i > targetIndex - 4 && others.length ? others : filler;
    strip.push(src[Math.floor(Math.random() * src.length)]);
  }
  strip.push(result);
  for (let i = 0; i < 4; i++) {
    strip.push(filler[Math.floor(Math.random() * filler.length)]);
  }
  slot = {
    strip,
    result,
    targetIndex,
    startOffset: 0,
    offset: 0,
    elapsed: 0,
    duration: 1.2,
    done: false,
    revealT: 0,
  };
  sfx.coin();
  return true;
}

// Coin pickup: start a roll, or queue if one is already playing. Gameplay never pauses.
function onCoinCollected() {
  if (slot) {
    slotQueue++;
    sfx.coin();
  } else if (!pullableBabes().length) {
    addCallout("All babes maxed out!", "#ffe66d"); // no roll
    sfx.coin();
  } else {
    beginSlotRoll();
  }
}

function finishSlot() {
  if (!slot) return;
  const id = slot.result.id;
  const prev = collection[id] || 0;
  collection[id] = clampCount(prev + 1);
  const nowMax = collection[id] >= MAX_COPIES;
  const maxTag = nowMax ? " MAX" : "";
  saveCollection(collection);
  noteAcquired(id); // dupes move to newest too
  runGained.push(id);
  focusHudOnBabe(id);
  const rar = rarityOf(id);
  const nm = slot.result.name;
  if (prev === 0) {
    if (rar.id === "ultra") {
      addCallout("✦ ULTRA RARE! NEW! " + nm, "#ffd24a");
      spawnParticles(W / 2, 120, "#ffd24a", 24);
      spawnParticles(W / 2, 120, "#ff7ab8", 12);
    } else if (rar.id === "rare") {
      addCallout("★ RARE! NEW! " + nm, "#7ec8ff");
      spawnParticles(W / 2, 120, "#7ec8ff", 14);
    } else {
      addCallout("NEW! " + nm + " · Common", "#ffe66d");
    }
    sfx.new();
  } else {
    const n = collection[id];
    if (rar.id === "ultra") addCallout("✦ ULTRA RARE DUPE x" + n + maxTag + " — " + nm, "#ffd24a");
    else if (rar.id === "rare") addCallout("★ RARE DUPE x" + n + maxTag + " — " + nm, "#9ad0ff");
    else addCallout("DUPE x" + n + maxTag + " — " + nm + " · Common", nowMax ? "#ffe66d" : "#9ad0ff");
  }
  slot = null;
  checkCollectionComplete(); // shows the celebration right after the completing roll
  // Chain queued rolls immediately (even over death/win overlays — player earned them);
  // while the celebration is up they wait and resume when it's dismissed
  if (slotQueue > 0 && !congrats) {
    slotQueue--;
    // If that was the last babe in the pool, the queued pickups have nothing left to roll
    if (!beginSlotRoll()) slotQueue = 0;
  }
}

// ---------- Update ----------
function updatePlay(dt) {
  if (player.stun > 0) player.stun -= dt;
  if (player.stompGrace > 0) player.stompGrace -= dt;

  // movement (disabled briefly while stunned so knockback reads)
  if (player.stun <= 0) {
    let move = 0;
    if (keys["arrowleft"] || keys["a"]) move -= 1;
    if (keys["arrowright"] || keys["d"]) move += 1;
    if (move !== 0) {
      player.vx += move * MOVE_ACC * dt;
      player.facing = move;
    } else {
      const fr = FRICTION * dt;
      if (Math.abs(player.vx) <= fr) player.vx = 0;
      else player.vx -= Math.sign(player.vx) * fr;
    }
    player.vx = Math.max(-MOVE_MAX, Math.min(MOVE_MAX, player.vx));

    // jump buffer / coyote
    if (justPressed[" "] || justPressed["arrowup"] || justPressed["w"]) {
      player.jumpBuf = JUMP_BUF;
    }
    if (player.onGround) player.coyote = COYOTE;
    else player.coyote -= dt;
    player.jumpBuf -= dt;

    if (player.jumpBuf > 0 && player.coyote > 0) {
      player.vy = JUMP_V;
      player.onGround = false;
      player.coyote = 0;
      player.jumpBuf = 0;
      sfx.jump();
    }
    // variable jump height — never cut an active stomp bounce until apex
    const jumpHeld = keys[" "] || keys["arrowup"] || keys["w"];
    if (player.fromStomp && player.vy >= 0) player.fromStomp = false;
    if (!jumpHeld && player.vy < 0 && !player.fromStomp) {
      player.vy *= JUMP_CUT;
    }
  } else {
    // Stunned: light air drag only; do not clamp to MOVE_MAX (preserves knockback)
    player.jumpBuf = 0;
    player.coyote = 0;
    player.vx *= (1 - Math.min(1, 1.2 * dt));
  }

  player.vy += GRAV * dt;
  if (player.vy > 900) player.vy = 900;
  resolvePlayer(dt);

  // Pit / cliff: one deliberate full wipe — all hearts gone, lose one card, then checkpoint respawn.
  // Guarded by state !== "play" inside onHeartsZero path (state flips to "dead" immediately) so no multi-trigger.
  if (player.y > (LEVEL_H + 2) * TILE) {
    hearts = 0;
    player.vx = 0;
    player.vy = 0;
    // Park at checkpoint immediately so we are not still "in the pit" next frame
    const cp = checkpoints[checkpointIdx];
    player.x = cp.x;
    player.y = cp.y - player.h;
    sfx.hit();
    onHeartsZero();
    return;
  }

  // checkpoints
  for (let i = checkpointIdx + 1; i < checkpoints.length; i++) {
    if (player.x + player.w/2 >= checkpoints[i].x) checkpointIdx = i;
  }

  // coins (bob + collect; multiple hits while rolling are queued)
  for (const c of coins) {
    if (c.collected) continue;
    c.bob += dt * 3;
    if (aabb(player, c)) {
      c.collected = true;
      spawnParticles(c.x + 8, c.y + 10, "#ffd24a", 8);
      onCoinCollected();
    }
  }

  // enemies — gravity + ledge turns (never float mid-air)
  for (const e of enemies) {
    if (!e.alive) continue;
    e.prevX = e.x;
    e.prevY = e.y;

    if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
    if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }

    const feetY = e.y + e.h;
    const aheadX = e.dir > 0 ? e.x + e.w - 2 : e.x - 4;
    const aheadTop = platformTopNear(aheadX, 6, feetY);
    if (aheadTop == null || Math.abs(aheadTop - feetY) > 10) e.dir *= -1;

    e.x += e.vx * e.dir * dt;
    if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
    if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }

    e.vy = (e.vy || 0) + GRAV * dt * (e.type === "hopper" ? 0.85 : 1);
    e.y += e.vy * dt;

    const top = platformTopNear(e.x, e.w, e.y + e.h);
    const onGround = top != null && (e.y + e.h) >= top - 1 && (e.y + e.h) <= top + 18 && e.vy >= 0;
    if (onGround) {
      e.y = top - e.h;
      e.vy = 0;
      if (e.type === "hopper") {
        e.hopT = (e.hopT || 0) + dt;
        if (e.hopT > (e.hopEvery || 1.1)) { e.vy = -520; e.hopT = 0; }
      }
    }

    if (!aabb(player, e)) continue;

    // Stomp if player was/is above (prev feet vs prev enemy top), even if enemy jumps up
    const STOMP_TOL = 8;
    const prevPlayerBottom = (player.prevY != null ? player.prevY : player.y) + player.h;
    const prevEnemyTop = e.prevY != null ? e.prevY : e.y;
    const fromAbove = prevPlayerBottom <= prevEnemyTop + STOMP_TOL;
    // Vertical-dominant overlap with player clearly above (hopper jump-into-feet)
    const playerAbove = player.y + player.h <= e.y + e.h * 0.55 && player.y < e.y;
    const stomping = fromAbove || playerAbove;

    if (stomping) {
      e.alive = false;
      player.y = e.y - player.h;
      player.onGround = false;
      const jumpHeld = keys[" "] || keys["arrowup"] || keys["w"];
      player.vy = jumpHeld ? STOMP_V_HELD : STOMP_V;
      player.stompGrace = 0.12;
      player.fromStomp = true;
      player.jumpBuf = 0;
      sfx.stomp();
      spawnParticles(e.x + e.w/2, e.y + e.h/2, e.type === "hopper" ? "#7dff9a" : "#ff8a5b", 12);
    } else {
      hurtPlayer(e.x + e.w/2);
    }
  }

  player.prevY = player.y;
  player.prevX = player.x;

  // goal
  if (aabb(player, goal)) {
    state = "win";
    const final = levelNum >= LEVELS.length;
    if (final) { progress.level = 1; progress.beatGame = true; }
    else progress.level = levelNum + 1; // next session picks up at the next level
    saveProgress(progress);
    winStats = {
      level: levelNum, final,
      unique: ownedUniqueCount(collection),
      total: totalPulls(collection),
      coins: coins.filter(c => c.collected).length,
      coinsMax: coins.length,
      gained: runGained.slice(),
    };
    sfx.win();
  }

  if (invuln > 0) invuln -= dt;
  if (player.flash > 0) player.flash -= dt;
  player.anim += dt * (Math.abs(player.vx) > 20 ? 10 : 4);

  // camera
  const target = player.x - W * 0.38;
  cameraX += (target - cameraX) * Math.min(1, 6 * dt);
  cameraX = Math.max(0, Math.min(cameraX, LEVEL_W * TILE - W));
}

function updateSlot(dt) {
  if (!slot) return;
  if (!slot.done) {
    slot.elapsed += dt;
    const t = Math.min(1, slot.elapsed / slot.duration);
    // Ease-out cubic on POSITION so we land exactly on targetIndex (the pre-planted result)
    const ease = 1 - Math.pow(1 - t, 3);
    const prev = Math.floor(slot.offset + 1e-9);
    slot.offset = slot.startOffset + (slot.targetIndex - slot.startOffset) * ease;
    if (Math.floor(slot.offset + 1e-9) !== prev) sfx.tick();
    if (t >= 1) {
      slot.offset = slot.targetIndex;
      slot.done = true;
      slot.revealT = 0;
    }
  } else {
    slot.revealT += dt;
    if (slot.revealT > 0.275) finishSlot(); // half of previous 0.55s reveal hold
  }
}

function updateDead(dt) {
  if (!loseAnim) { state = "play"; resetAfterDeath(); return; }
  loseAnim.t += dt;
  if (loseAnim.t >= loseAnim.dur) {
    loseAnim = null;
    resetAfterDeath();
    state = "play";
  }
}

function resetAfterDeath() {
  hearts = 3;
  invuln = 1.5;
  deathCry = null;
  stopDeathCry();
  const cp = checkpoints[checkpointIdx];
  player.x = cp.x; player.y = cp.y - player.h;
  player.vx = 0; player.vy = 0;
  player.stun = 0;
  player.stompGrace = 0;
  player.fromStomp = false;
  player.prevX = player.x; player.prevY = player.y;
  syncRecent(); // a babe lost down to 0 leaves the tray now
  // Respawn coins AND enemies at original positions/state (same as level start)
  coins = makeCoins();
  enemies = makeEnemies();
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 600*dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = callouts.length - 1; i >= 0; i--) {
    callouts[i].t += dt;
    if (callouts[i].t >= callouts[i].dur) callouts.splice(i, 1);
  }
  // Layout: newest on top, older ones stacked beneath; ease toward target slot
  const baseY = calloutBaseY();
  for (let i = callouts.length - 1, k = 0; i >= 0; i--, k++) {
    const c = callouts[i];
    const ty = baseY + k * (CALLOUT_H + CALLOUT_GAP);
    c.y = c.y == null ? ty : c.y + (ty - c.y) * Math.min(1, 12 * dt);
  }
}

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------- Draw ----------
function drawBackground() {
  // sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const th = (level && level.theme) || LEVEL_THEMES.dusk;
  g.addColorStop(0, th.sky[0]);
  g.addColorStop(0.5, th.sky[1]);
  g.addColorStop(1, th.sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // parallax hills
  ctx.fillStyle = th.hills;
  for (let i = 0; i < 8; i++) {
    const hx = ((i * 280) - cameraX * 0.2) % (W + 300) - 80;
    ctx.beginPath();
    ctx.ellipse(hx + 120, H - 40, 160, 70, 0, 0, Math.PI*2);
    ctx.fill();
  }
  // stars
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  for (let i = 0; i < 40; i++) {
    const sx = ((i * 97) * 13 - cameraX * 0.05) % W;
    const sy = (i * 37) % (H * 0.55);
    ctx.fillRect(sx, sy, 2, 2);
  }
}

function drawWorld() {
  ctx.save();
  ctx.translate(-Math.floor(cameraX), 0);

  // platforms (only those on screen — levels are ~3x longer now)
  const th = level.theme;
  const viewL = cameraX - 64, viewR = cameraX + W + 64;
  for (const p of platforms) {
    const x = p.x*TILE, y = p.y*TILE, w = p.w*TILE, h = p.h*TILE;
    if (x + w < viewL || x > viewR) continue;
    // dirt body
    ctx.fillStyle = th.dirt;
    ctx.fillRect(x, y, w, h);
    // grass top
    ctx.fillStyle = th.grass;
    ctx.fillRect(x, y, w, 8);
    // pixel edge
    ctx.fillStyle = th.edge;
    for (let i = 0; i < w; i += 8) ctx.fillRect(x + i, y + 8, 6, 3);
    // bricks hint on tall
    if (h > TILE) {
      ctx.fillStyle = "rgba(0,0,0,0.15)";
      for (let ty = y + TILE; ty < y + h; ty += TILE) {
        ctx.fillRect(x, ty, w, 2);
        for (let tx = x; tx < x + w; tx += TILE) ctx.fillRect(tx, ty, 2, TILE);
      }
    }
  }

  // checkpoints flags
  for (let i = 0; i < checkpoints.length; i++) {
    const c = checkpoints[i];
    const active = i <= checkpointIdx;
    ctx.fillStyle = "#ddd";
    ctx.fillRect(c.x, c.y - 48, 4, 48);
    ctx.fillStyle = active ? "#ff5a9a" : "#888";
    ctx.beginPath();
    ctx.moveTo(c.x + 4, c.y - 48);
    ctx.lineTo(c.x + 28, c.y - 36);
    ctx.lineTo(c.x + 4, c.y - 24);
    ctx.fill();
  }

  // coins — mystery cardback (Iris A5), bob + sparkle
  for (const c of coins) {
    if (c.collected || c.x + c.w < viewL || c.x > viewR) continue;
    const by = c.y + Math.sin(c.bob) * 4;
    const cx = Math.floor(c.x), cy = Math.floor(by);
    const cw = Math.floor(c.w), ch = Math.floor(c.h);
    const back = cardImgs.mystery.sm || cardImgs.mystery.md;
    if (!drawCardBitmap(back, cx, cy, cw, ch, false)) {
      const g = ctx.createLinearGradient(cx, cy, cx, cy + ch);
      g.addColorStop(0, "#6b3a8a");
      g.addColorStop(1, "#2a1040");
      roundRect(cx, cy, cw, ch, 3);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.fillStyle = "#ffd24a";
      ctx.font = "bold 9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("?", cx + cw / 2, cy + ch / 2 + 3);
    }
    // sparkle
    const sp = (Math.sin(c.bob * 2) + 1) * 0.5;
    ctx.globalAlpha = 0.35 + sp * 0.55;
    ctx.fillStyle = "#fff";
    ctx.fillRect(cx + cw - 4, cy + 2, 2, 2);
    ctx.fillRect(cx + 2, cy + ch * 0.4, 2, 2);
    ctx.globalAlpha = 1;
  }

  // enemies
  for (const e of enemies) {
    if (!e.alive || e.x + e.w < viewL || e.x > viewR) continue;
    if (e.type === "walker") {
      ctx.fillStyle = "#e85d4c";
      roundRect(e.x, e.y, e.w, e.h, 4);
      ctx.fill();
      // eyes
      ctx.fillStyle = "#fff";
      ctx.fillRect(e.x + 6 + (e.dir>0?8:0), e.y + 8, 6, 6);
      ctx.fillRect(e.x + 16 + (e.dir>0?8:0), e.y + 8, 6, 6);
      ctx.fillStyle = "#111";
      ctx.fillRect(e.x + 8 + (e.dir>0?8:0), e.y + 10, 3, 3);
      ctx.fillRect(e.x + 18 + (e.dir>0?8:0), e.y + 10, 3, 3);
      // feet
      ctx.fillStyle = "#a03028";
      ctx.fillRect(e.x + 2, e.y + e.h - 4, 8, 4);
      ctx.fillRect(e.x + e.w - 10, e.y + e.h - 4, 8, 4);
    } else {
      // hopper — green blob with spring
      ctx.fillStyle = "#5dcf6a";
      ctx.beginPath();
      ctx.ellipse(e.x + e.w/2, e.y + e.h/2, e.w/2, e.h/2 * (e.vy < -50 ? 1.15 : 0.9), 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(e.x + 8, e.y + 10, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x + 18, e.y + 10, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#111";
      ctx.fillRect(e.x + 8, e.y + 10, 3, 3);
      ctx.fillRect(e.x + 18, e.y + 10, 3, 3);
    }
  }

  // goal flag
  ctx.fillStyle = "#eee";
  ctx.fillRect(goal.x, goal.y, 5, goal.h);
  ctx.fillStyle = "#ffd24a";
  ctx.beginPath();
  ctx.moveTo(goal.x + 5, goal.y);
  ctx.lineTo(goal.x + 40, goal.y + 16);
  ctx.lineTo(goal.x + 5, goal.y + 32);
  ctx.fill();
  ctx.fillStyle = "#ff5a9a";
  ctx.beginPath();
  ctx.arc(goal.x + 2, goal.y, 6, 0, Math.PI*2);
  ctx.fill();

  // player (pixel hero or fallback shapes)
  drawPlayer();

  // particles in world space
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}


// Bottom-right mini tray: only owned babes, newest acquisition on the right, at most 5.
function drawHudLiveBabes() {
  if (state !== "play" && state !== "dead" && state !== "dying") return;
  const lostId = state === "dead" && loseAnim ? loseAnim.lostId : null;
  // newest-first, owned (keep a just-lost babe visible during the Ouch screen for her X)
  const recent = recentBabes.filter(id => (collection[id] || 0) > 0 || id === lostId).slice(0, HUD_SLOTS);
  const list = recent.slice().reverse().map(babeById).filter(Boolean); // oldest → newest (left → right)
  const n = list.length;
  const cw = HUD_CW, ch = cardHeight(cw), gap = HUD_GAP;
  const pad = 8, counterH = 16;
  const unique = ownedUniqueCount(collection);
  const label = "Babes " + unique + "/" + BABE_POOL.length;
  ctx.font = "bold 11px sans-serif";
  const cardsW = n ? n * cw + (n - 1) * gap : 0;
  const panelW = pad * 2 + Math.max(cardsW, Math.ceil(ctx.measureText(label).width));
  const panelH = pad + counterH + (n ? ch + pad : 0);
  const margin = 10;
  // Touch: lift tray above on-screen jump; portrait needs less canvas-space lift (letterbox absorbs chrome)
  const portrait = window.innerHeight > window.innerWidth;
  const lift = isTouch ? (portrait ? 78 : 130) : 18;
  const panelX = W - panelW - margin;
  const panelY = H - panelH - lift - (n ? 0 : ch + pad);
  const step = cw + gap;

  ctx.save();
  ctx.globalAlpha = 0.78;
  ctx.fillStyle = "rgba(12,8,22,0.78)";
  roundRect(panelX, panelY, panelW, panelH, 8);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,90,154,0.45)";
  ctx.lineWidth = 1.5;
  roundRect(panelX, panelY, panelW, panelH, 8);
  ctx.stroke();
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = "#ffb0d0";
  ctx.textAlign = "left";
  ctx.fillText(label, panelX + pad, panelY + 13);

  if (n) {
    const viewX = panelX + panelW - pad - cardsW; // right-aligned
    const viewY = panelY + pad + counterH;
    ctx.save();
    ctx.beginPath();
    ctx.rect(panelX + 2, viewY - 2, panelW - 4, ch + 4);
    ctx.clip();
    const slide = step * Math.max(0, 1 - (performance.now() - (hudTray.slideAt || -1e9)) / 200);
    for (let i = 0; i < n; i++) {
      const babe = list[i];
      const isNewest = i === n - 1;
      const x = viewX + i * step + slide;
      const y = viewY;
      const count = collection[babe.id] || 0;
      const isLost = babe.id === lostId;
      ctx.globalAlpha = isNewest && slide > 0 ? 0.95 * (1 - slide / step) : 0.95;
      if (isLost) {
        const displayCount = count > 0 ? count : (loseAnim.lostPrevCount > 1 ? loseAnim.lostPrevCount - 1 : null);
        drawCard(babe, x, y, cw, ch, { iconOnly: true, count: displayCount && displayCount > 1 ? displayCount : null });
        drawLostBabeX(x, y, cw, ch, loseAnim.t);
      } else {
        // 15x20 face crops (nearest-neighbour), dupe count, no MAX tag in the tray
        drawCard(babe, x, y, cw, ch, { iconOnly: true, count: count > 1 ? count : null });
      }
      if (hudTray.highlightId === babe.id && hudTray.highlightT > 0) {
        const pulse = 0.5 + 0.5 * Math.sin((0.55 - hudTray.highlightT) * 20);
        ctx.strokeStyle = `rgba(255,230,109,${0.55 + 0.45 * pulse})`;
        ctx.lineWidth = 2;
        roundRect(x - 1, y - 1, cw + 2, ch + 2, 5);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawHUD() {
  // hearts
  for (let i = 0; i < 3; i++) {
    const hx = 16 + i * 28, hy = 14;
    ctx.fillStyle = i < hearts ? "#ff4d6d" : "#44222a";
    ctx.beginPath();
    ctx.moveTo(hx, hy + 6);
    ctx.bezierCurveTo(hx, hy, hx + 12, hy, hx + 12, hy + 6);
    ctx.bezierCurveTo(hx + 12, hy + 14, hx, hy + 18, hx, hy + 18);
    ctx.bezierCurveTo(hx, hy + 18, hx - 12, hy + 14, hx - 12, hy + 6);
    ctx.bezierCurveTo(hx - 12, hy, hx, hy, hx, hy + 6);
    ctx.fill();
  }

  // level number + distance-to-flag bar (top centre)
  {
    const lw = 132, lx = W / 2 - lw / 2, ly = 6;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    roundRect(lx, ly, lw, 30, 8); ctx.fill();
    ctx.fillStyle = "#ffe66d";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("LEVEL " + levelNum + " / " + LEVELS.length, W / 2, ly + 15);
    const prog = Math.max(0, Math.min(1, (player.x - checkpoints[0].x) / Math.max(1, goal.x - checkpoints[0].x)));
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fillRect(lx + 12, ly + 21, lw - 24, 4);
    ctx.fillStyle = "#ff5a9a";
    ctx.fillRect(lx + 12, ly + 21, (lw - 24) * prog, 4);
    for (const cp of checkpoints) { // checkpoint ticks
      const f = (cp.x - checkpoints[0].x) / Math.max(1, goal.x - checkpoints[0].x);
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.fillRect(lx + 12 + (lw - 24) * f - 0.5, ly + 20, 1.5, 6);
    }
  }

  // collection count
  const unique = ownedUniqueCount(collection);
  const total = totalPulls(collection);
  // Box grows leftward to fit the hint; right edge stays at W - 12
  const pullsLine = "Total pulls: " + total + (isTouch ? "  [Collection]" : "  [press C = Collection]");
  ctx.font = "11px sans-serif";
  const boxW = Math.max(158, Math.ceil(ctx.measureText(pullsLine).width) + 24);
  const boxX = W - 12 - boxW;
  if (boxX !== hudBoxX) { hudBoxX = boxX; positionMuteBtn(); }
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  roundRect(boxX, 8, boxW, 36, 8);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Babes " + unique + "/" + BABE_POOL.length, boxX + 12, 24);
  ctx.font = "11px sans-serif";
  ctx.fillStyle = "#ffb0d0";
  ctx.fillText(pullsLine, boxX + 12, 38);

  // studio tag
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.font = "10px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Big Salty Gaming Studio", W/2, H - 8);

  // callouts
  for (const c of callouts) {
    const y = c.y == null ? calloutBaseY() : c.y;
    ctx.globalAlpha = calloutAlpha(c);
    ctx.font = "bold 18px sans-serif";
    const cwBox = Math.max(280, Math.ceil(ctx.measureText(c.text).width) + 32);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(W/2 - cwBox/2, y, cwBox, CALLOUT_H, 8);
    ctx.fill();
    ctx.fillStyle = c.color;
    ctx.textAlign = "center";
    ctx.fillText(c.text, W/2, y + 24);
    ctx.globalAlpha = 1;
  }

  drawHudLiveBabes();
}

function drawSlot() {
  // Overlay only — no screen dimming; world keeps rendering underneath
  // Panel height is 70% of the original 150px; cards scale uniformly (3:4)
  const panelY = SLOT_PANEL_Y;
  const panelH = SLOT_PANEL_H; // 105
  const scale = 0.7;
  ctx.fillStyle = "rgba(20,10,30,0.92)";
  roundRect(40, panelY, W - 80, panelH, 12);
  ctx.fill();
  ctx.strokeStyle = "#ff5a9a";
  ctx.lineWidth = 2.5;
  roundRect(40, panelY, W - 80, panelH, 12);
  ctx.stroke();

  ctx.fillStyle = "#ffb0d0";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(slot.done ? "★ YOU GOT ★" : "✦ ROLLING… ✦", W/2, panelY + 18);

  if (slotQueue > 0) {
    ctx.fillStyle = "#ffe66d";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("Queue +" + slotQueue, W - 56, panelY + 18);
  }

  // card window — width derived from height via CARD_ASPECT
  const cw = 72 * scale;           // 50.4
  const ch = cardHeight(cw);       // exact 3:4
  const gap = 14 * scale;
  const centerX = W/2;
  const cy = panelY + 26;
  const viewW = cw * 5 + gap * 4;
  const vx = centerX - viewW/2;

  ctx.save();
  ctx.beginPath();
  ctx.rect(vx - 3, cy - 3, viewW + 6, ch + 6);
  ctx.clip();

  const base = slot.offset;
  for (let i = -3; i <= 3; i++) {
    const idx = Math.floor(base) + i;
    if (idx < 0 || idx >= slot.strip.length) continue;
    const frac = base - Math.floor(base);
    const cx = centerX + (i - frac) * (cw + gap) - cw/2;
    const char = slot.strip[idx];
    drawCard(char, cx, cy, cw, ch, { glow: slot.done && idx === slot.targetIndex ? 1 : 0 });
  }
  ctx.restore();

  // center highlight frame
  ctx.strokeStyle = "#ffe66d";
  ctx.lineWidth = 2.5;
  roundRect(centerX - cw/2 - 3, cy - 3, cw + 6, ch + 6, 8);
  ctx.stroke();

  if (slot.done) {
    const rar = rarityOf(slot.result.id);
    ctx.fillStyle = rar.color;
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(slot.result.name + " — " + rar.label, W/2, panelY + panelH - 8);
  }
}

function sortedBabeList() {
  return BABE_POOL.slice().sort((a, b) => {
    const rd = rarityRank(a.id) - rarityRank(b.id);
    if (rd !== 0) return rd;
    return a.name.localeCompare(b.name);
  });
}

function focusHudOnBabe(id) {
  if (!id) return;
  hudTray.highlightId = id;
  hudTray.highlightT = 0.55;
}

function updateHudTray(dt) {
  if (hudTray.highlightT > 0) hudTray.highlightT -= dt;
}

function galleryFilteredList() {
  let list = BABE_POOL.slice();
  const f = gallery.filter;
  if (f === "owned") list = list.filter(b => (collection[b.id] || 0) > 0);
  else if (f === "missing") list = list.filter(b => !(collection[b.id] > 0));
  else if (f === "common" || f === "rare" || f === "ultra") {
    list = list.filter(b => b.rarity === f);
  }
  list.sort((a, b) => {
    const rd = rarityRank(a.id) - rarityRank(b.id);
    if (rd !== 0) return rd;
    return a.name.localeCompare(b.name);
  });
  return list;
}

function handleGalleryClick(sx, sy) {
  // Filter tabs
  const tabY = 56, tabH = 28, tabGap = 6;
  const labels = GALLERY_FILTERS;
  let tx = 40;
  for (const lab of labels) {
    const label = galleryFilterLabel(lab);
    ctx.font = "bold 11px sans-serif";
    const tw = Math.max(54, ctx.measureText(label).width + 16);
    if (sx >= tx && sx <= tx + tw && sy >= tabY && sy <= tabY + tabH) {
      gallery.filter = lab;
      gallery.scroll = 0;
      gallery.selected = null;
      return;
    }
    tx += tw + tabGap;
  }
  // Page buttons
  if (sx >= W - 120 && sx <= W - 70 && sy >= H - 42 && sy <= H - 14) {
    gallery.scroll = Math.max(0, gallery.scroll - 160);
    return;
  }
  if (sx >= W - 60 && sx <= W - 10 && sy >= H - 42 && sy <= H - 14) {
    gallery.scroll += 160;
    return;
  }
  // Detail close
  if (gallery.selected) {
    if (sx >= W / 2 - 40 && sx <= W / 2 + 40 && sy >= H - 50 && sy <= H - 22) {
      gallery.selected = null;
      return;
    }
  }
  // Grid hit
  const list = galleryFilteredList();
  const cols = 5;
  const cw = 100, ch = cardHeight(cw), gapX = 16, gapY = 14;
  const gridW = cols * cw + (cols - 1) * gapX;
  const startX = (W - gridW) / 2;
  const startY = 100 - gallery.scroll;
  for (let i = 0; i < list.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = startX + col * (cw + gapX);
    const y = startY + row * (ch + gapY);
    if (sx >= x && sx <= x + cw && sy >= y && sy <= y + ch) {
      gallery.selected = list[i].id;
      return;
    }
  }
}

function updateGalleryInput() {
  if (justPressed["arrowleft"] || justPressed["a"]) gallery.scroll = Math.max(0, gallery.scroll - 120);
  if (justPressed["arrowright"] || justPressed["d"]) gallery.scroll += 120;
  if (justPressed["arrowup"] || justPressed["w"]) gallery.scroll = Math.max(0, gallery.scroll - 80);
  if (justPressed["arrowdown"] || justPressed["s"]) gallery.scroll += 80;
  if (justPressed["pageup"]) gallery.scroll = Math.max(0, gallery.scroll - 220);
  if (justPressed["pagedown"]) gallery.scroll += 220;
  // number keys 1-7 for filters
  for (let i = 0; i < GALLERY_FILTERS.length; i++) {
    if (justPressed[String(i + 1)]) {
      gallery.filter = GALLERY_FILTERS[i];
      gallery.scroll = 0;
      gallery.selected = null;
    }
  }
  if (justPressed["escape"] && gallery.selected) {
    gallery.selected = null;
    justPressed["escape"] = false; // consume so we don't close gallery
  }
}
