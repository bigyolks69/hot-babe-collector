<head>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ff5a9a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='32' fill='white'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<title>Hot Babe Collector — Big Salty Gaming Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1020;
    font-family: "Segoe UI", system-ui, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #120818;
  }
  canvas#game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #2a1840;
    box-shadow: 0 0 40px rgba(255,80,140,0.25);
    touch-action: none;
  }
  #touch {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #touch.show { display: block; }
  .tbtn {
    position: absolute;
    pointer-events: auto;
    width: 78px; height: 78px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10); /* ~90% transparent fill */
    border: 3px solid rgba(255,255,255,0.30); /* ~70% transparent outline */
    color: rgba(255,255,255,0.30); /* ~70% transparent glyph */
    font-size: 26px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .tbtn:active, .tbtn.active {
    background: rgba(255,120,180,0.28);
    border-color: rgba(255,255,255,0.45);
    color: rgba(255,255,255,0.55);
    transform: scale(0.96);
  }
  #tLeft  { left: max(16px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom)); }
  #tRight { left: calc(max(16px, env(safe-area-inset-left)) + 90px); bottom: max(24px, env(safe-area-inset-bottom)); }
  #tJump  {
    right: max(16px, env(safe-area-inset-right));
    bottom: max(24px, env(safe-area-inset-bottom));
    width: 96px; height: 96px; font-size: 30px;
  }
  /* Collection — top-left pill, below heart row so it clears HUD */
  #tColl  {
    left: max(12px, env(safe-area-inset-left));
    top: max(52px, calc(env(safe-area-inset-top) + 44px));
    width: auto;
    min-width: 108px;
    height: 40px;
    padding: 0 14px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  #fsBtn {
    position: absolute;
    right: max(12px, env(safe-area-inset-right));
    top: max(12px, env(safe-area-inset-top));
    z-index: 12;
    pointer-events: auto;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.30);
    background: rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.30);
    font-size: 12px;
    font-weight: bold;
    display: none;
    touch-action: none;
  }
  #fsBtn.show { display: block; }
  #fsBtn:active { background: rgba(255,120,180,0.28); color: rgba(255,255,255,0.55); border-color: rgba(255,255,255,0.45); }
  #muteBtn {
    position: absolute;
    right: max(12px, env(safe-area-inset-right));
    top: max(48px, calc(env(safe-area-inset-top) + 44px));
    z-index: 12;
    pointer-events: auto;
    width: 40px; height: 40px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.30);
    background: rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.45);
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: pointer;
  }
  #muteBtn:active { background: rgba(255,120,180,0.28); color: rgba(255,255,255,0.55); border-color: rgba(255,255,255,0.45); }
  @media (orientation: portrait) {
    #muteBtn { right: max(10px, env(safe-area-inset-right)); top: max(44px, calc(env(safe-area-inset-top) + 40px)); width: 36px; height: 36px; font-size: 16px; }
  }
  /* Portrait: keep controls usable without blocking the letterboxed canvas */
  @media (orientation: portrait) {
    .tbtn { width: 72px; height: 72px; font-size: 24px; }
    #tJump { width: 84px; height: 84px; font-size: 26px; }
    #tLeft  { left: max(12px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); }
    #tRight { left: calc(max(12px, env(safe-area-inset-left)) + 78px); bottom: max(18px, env(safe-area-inset-bottom)); }
    #tJump  { right: max(12px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); }
    #tColl  {
      left: max(10px, env(safe-area-inset-left));
      top: max(48px, calc(env(safe-area-inset-top) + 40px));
      min-width: 100px;
      height: 36px;
      padding: 0 12px;
      border-radius: 18px;
      font-size: 12px;
    }
    #fsBtn  { right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); font-size: 11px; padding: 6px 10px; }
  }

<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="touch">
    <button type="button" class="tbtn" id="tLeft" aria-label="Left">◀</button>
    <button type="button" class="tbtn" id="tRight" aria-label="Right">▶</button>
    <button type="button" class="tbtn" id="tJump" aria-label="Jump">▲</button>
    <button type="button" class="tbtn" id="tColl" aria-label="Collection">Collection</button>
  </div>
  <button type="button" id="fsBtn" aria-label="Fullscreen">⛶ Full</button>
  <button type="button" id="muteBtn" aria-label="Mute" title="Mute (M)">🔊</button>
</div>
<script>
"use strict";

// ============================================================
// Hot Babe Collector — Big Salty Gaming Studio
// Prototype: self-contained Canvas 2D platformer
// ============================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

// ---------- Pixel-art hero (32×48, faces right; flip for left) ----------
// Set true to use hero_idle_side.png for idle instead of front-facing breath cycle
const HERO_IDLE_USE_SIDE = false;
const HERO_SW = 32;
const HERO_SH = 48;
// Opaque idle ≈ (1,0)–(28,47). Slim collision inset; feet = sprite bottom.
const HERO_INSET_X = 7;  // → hitbox width 18
const HERO_INSET_TOP = 4; // → hitbox height 44
const PLAYER_W = HERO_SW - HERO_INSET_X * 2; // 18
const PLAYER_H = HERO_SH - HERO_INSET_TOP;   // 44
const HERO_IDLE_MS = 500;
const HERO_RUN_MS = 90;
const HERO_DEAD_MS = 260;
const DEATH_CRY_SCALE = 6; // 32×48 → 192×288
const DEATH_FLASH_HOLD = 0.08; // full white before black cry
const DEATH_FLASH_FADE = 0.10; // white → black+cry

const heroSprites = {
  ready: false,
  failed: false,
  idle: [null, null],      // front breath
  idleSide: null,
  runSheet: null,          // 192×48, 6 frames
  jumpUp: null,
  jumpFall: null,
  hurt: null,
  dead: [null, null],
};

function loadImg(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

async function preloadHeroSprites() {
  const base = "art/hero/pixel/";
  const [
    idle0, idle1, idleSide, runSheet,
    jumpUp, jumpFall, hurt, dead0, dead1,
  ] = await Promise.all([
    loadImg(base + "hero_idle.png"),
    loadImg(base + "hero_idle_1.png"),
    loadImg(base + "hero_idle_side.png"),
    loadImg(base + "hero_run_sheet.png"),
    loadImg(base + "hero_jump_up.png"),
    loadImg(base + "hero_jump_fall.png"),
    loadImg(base + "hero_hurt.png"),
    loadImg(base + "hero_dead_0.png"),
    loadImg(base + "hero_dead_1.png"),
  ]);
  heroSprites.idle = [idle0, idle1];
  heroSprites.idleSide = idleSide;
  heroSprites.runSheet = runSheet;
  heroSprites.jumpUp = jumpUp;
  heroSprites.jumpFall = jumpFall;
  heroSprites.hurt = hurt;
  heroSprites.dead = [dead0, dead1];
  const need = [idle0, idle1, runSheet, jumpUp, jumpFall, hurt, dead0, dead1];
  heroSprites.failed = need.some(im => !im);
  heroSprites.ready = !heroSprites.failed;
  return heroSprites.ready;
}

// Test/screenshot pose override: "idle"|"run"|"jumpUp"|"jumpFall"|"hurt"|"dead"|null
let debugHeroPose = null;

function heroFrameForState() {
  const pose = debugHeroPose || (
    (state === "dead" || state === "dying") ? "dead" :
    player.stun > 0 ? "hurt" :
    !player.onGround ? (player.vy < 0 ? "jumpUp" : "jumpFall") :
    Math.abs(player.vx) > 30 ? "run" : "idle"
  );
  if (pose === "dead") {
    // When dying: animT reset to 0 as black cry (+audio) starts — synced to 260ms beats
    const ms = (state === "dying" && deathCry && deathCry.animStarted)
      ? deathCry.animT * 1000
      : performance.now();
    const fi = Math.floor((ms / HERO_DEAD_MS) % 2);
    return { img: heroSprites.dead[fi], sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  if (pose === "hurt") {
    return { img: heroSprites.hurt, sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  if (pose === "jumpUp") {
    return { img: heroSprites.jumpUp, sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  if (pose === "jumpFall") {
    return { img: heroSprites.jumpFall, sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  if (pose === "run") {
    const fi = Math.floor((performance.now() / HERO_RUN_MS) % 6);
    return { img: heroSprites.runSheet, sx: fi * HERO_SW, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  // idle
  if (HERO_IDLE_USE_SIDE && heroSprites.idleSide) {
    return { img: heroSprites.idleSide, sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  const fi = Math.floor((performance.now() / HERO_IDLE_MS) % 2);
  return { img: heroSprites.idle[fi], sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
}

function drawHeroSprite() {
  const fr = heroFrameForState();
  if (!fr.img) return false;
  const px = Math.floor(player.x + player.w / 2);
  const py = Math.floor(player.y + player.h);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(px, py);
  if (player.facing < 0) ctx.scale(-1, 1);
  ctx.drawImage(fr.img, fr.sx, fr.sy, fr.sw, fr.sh, -Math.floor(HERO_SW / 2), -HERO_SH, HERO_SW, HERO_SH);
  ctx.restore();
  return true;
}

function drawPlayerFallback() {
  const px = player.x, py = player.y;
  ctx.fillStyle = "#6ec8ff";
  roundRect(px, py + 8, player.w, player.h - 8, 4);
  ctx.fill();
  ctx.fillStyle = "#ffdbb0";
  ctx.fillRect(px + 2, py, player.w - 4, 14);
  ctx.fillStyle = "#ff5a9a";
  ctx.fillRect(px + 1, py - 2, player.w - 2, 6);
  ctx.fillStyle = "#222";
  const ex = player.facing >= 0 ? px + player.w - 8 : px + 4;
  ctx.fillRect(ex, py + 5, 3, 3);
  const leg = Math.sin(player.anim) * (player.onGround && Math.abs(player.vx) > 30 ? 4 : 0);
  ctx.fillStyle = "#3a6a9a";
  ctx.fillRect(px + 2, py + player.h - 8, 5, 8 + leg);
  ctx.fillRect(px + player.w - 7, py + player.h - 8, 5, 8 - leg);
}

// Super Saiyan aura — all-30 unique unlock (live count; turns off if a babe is lost)
const AURA_W = 56, AURA_H = 80, AURA_FRAME_MS = 110;
const AURA_FRAMES = [];
for (let i = 0; i < 6; i++) {
  const im = new Image();
  im.onerror = () => console.warn("[HBC] aura frame failed: aura_fire_" + i);
  im.src = "art/vfx/aura/aura_fire_" + i + ".png";
  AURA_FRAMES.push(im);
}
function hasAllBabesAura() {
  return ownedUniqueCount(collection) >= BABE_POOL.length;
}
function drawAura() {
  if (!hasAllBabesAura()) return;
  const im = AURA_FRAMES[Math.floor(performance.now() / AURA_FRAME_MS) % AURA_FRAMES.length];
  if (!imgOk(im)) return;
  // Bottom-center of aura ↔ bottom-center of hero (56×80 canvas; hero 32×48 inset at 12,24)
  const cx = Math.floor(player.x + player.w / 2);
  const by = Math.floor(player.y + player.h);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(cx, by);
  if (player.facing < 0) ctx.scale(-1, 1);
  ctx.drawImage(im, -Math.floor(AURA_W / 2), -AURA_H, AURA_W, AURA_H);
  ctx.restore();
}
function drawPlayer() {
  // Invulnerability flash (also during death we still draw)
  if (state !== "dead" && state !== "dying" && player.flash > 0 && Math.floor(player.flash * 12) % 2 !== 0) return;
  drawAura(); // behind the hero
  if (heroSprites.ready && drawHeroSprite()) return;
  drawPlayerFallback();
}


// ---------- WebAudio SFX + Music Macky death cry ----------
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
let masterGain = null;
const MUTE_KEY = "hbc_muted";
let muted = false;
try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (_) {}

function ensureAudio() {
  if (!actx) {
    actx = new AudioCtx();
    masterGain = actx.createGain();
    masterGain.gain.value = muted ? 0 : 1;
    masterGain.connect(actx.destination);
  }
  if (actx.state === "suspended") actx.resume();
  if (masterGain) masterGain.gain.value = muted ? 0 : 1;
}

function setMuted(v) {
  muted = !!v;
  try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch (_) {}
  if (masterGain) masterGain.gain.value = muted ? 0 : 1;
  if (cryHtmlAudio) cryHtmlAudio.muted = muted;
  if (cryLoopHtmlAudio) cryLoopHtmlAudio.muted = muted;
  if (bgm.html) bgm.html.muted = muted;
  const btn = document.getElementById("muteBtn");
  if (btn) {
    btn.textContent = muted ? "🔇" : "🔊";
    btn.setAttribute("aria-label", muted ? "Unmute" : "Mute");
  }
}

function beep(freq, dur, type, vol, slide) {
  try {
    ensureAudio();
    if (muted) return;
    const t0 = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(masterGain || actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (_) {}
}
const sfx = {
  jump:  () => beep(420, 0.12, "square", 0.07, 280),
  coin:  () => { beep(880, 0.08, "square", 0.06); setTimeout(() => beep(1175, 0.12, "square", 0.05), 60); },
  tick:  () => beep(600 + Math.random() * 400, 0.03, "triangle", 0.035),
  hit:   () => beep(160, 0.25, "sawtooth", 0.09, 60),
  stomp: () => beep(200, 0.1, "square", 0.07, 80),
  lose:  () => { beep(300, 0.2, "sawtooth", 0.08, 100); setTimeout(() => beep(150, 0.3, "sawtooth", 0.07, 50), 180); },
  win:   () => { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.18, "square", 0.06), i*120)); },
  new:   () => { beep(700, 0.1, "square", 0.06); setTimeout(() => beep(1050, 0.2, "square", 0.06), 100); },
};

// Death cry (Music Macky): 1.500s one-shot, sobs on 260ms beats
const CRY_VOLUME = 0.25; // relative to prior full-level cry (other SFX unchanged)
const cryAudio = {
  oneshotBuf: null,
  loopBuf: null,       // available; only if dying ever exceeds 1.5s
  oneshotUrl: null,
  loopUrl: null,
  ready: false,
  source: null,        // active BufferSource
  loopSource: null,
  startedAt: null,     // actx.currentTime or performance when started
  playing: false,
};
let cryHtmlAudio = null;
let cryLoopHtmlAudio = null;

function pickAudioUrl(baseNoExt) {
  const probe = document.createElement("audio");
  const ogg = probe.canPlayType('audio/ogg; codecs="vorbis"') || probe.canPlayType("audio/ogg");
  if (ogg && ogg !== "no") return baseNoExt + ".ogg";
  return baseNoExt + ".mp3";
}

async function fetchDecode(url) {
  ensureAudio();
  const res = await fetch(url);
  if (!res.ok) throw new Error("fetch " + url + " " + res.status);
  const ab = await res.arrayBuffer();
  return await actx.decodeAudioData(ab.slice(0));
}

async function preloadCryAudio() {
  cryAudio.oneshotUrl = pickAudioUrl("audio/cry_death");
  cryAudio.loopUrl = pickAudioUrl("audio/cry_death_loop");
  // Prefer OGG path when supported; pickAudioUrl already chose
  try {
    ensureAudio();
    cryAudio.oneshotBuf = await fetchDecode(cryAudio.oneshotUrl);
    try { cryAudio.loopBuf = await fetchDecode(cryAudio.loopUrl); } catch (_) { cryAudio.loopBuf = null; }
    cryAudio.ready = true;
  } catch (e) {
    // file:// or decode failure → HTMLAudioElement fallback
    console.warn("[HBC] WebAudio cry decode failed, using HTMLAudioElement", e && e.message);
    cryHtmlAudio = new Audio(cryAudio.oneshotUrl);
    cryHtmlAudio.preload = "auto";
    cryLoopHtmlAudio = new Audio(cryAudio.loopUrl);
    cryLoopHtmlAudio.preload = "auto";
    cryLoopHtmlAudio.loop = true;
    cryAudio.ready = true;
  }
}

function stopDeathCry() {
  try {
    if (cryAudio.source) {
      try { cryAudio.source.stop(0); } catch (_) {}
      cryAudio.source.disconnect();
      cryAudio.source = null;
    }
    if (cryAudio.loopSource) {
      try { cryAudio.loopSource.stop(0); } catch (_) {}
      cryAudio.loopSource.disconnect();
      cryAudio.loopSource = null;
    }
  } catch (_) {}
  if (cryHtmlAudio) { try { cryHtmlAudio.pause(); cryHtmlAudio.currentTime = 0; } catch (_) {} }
  if (cryLoopHtmlAudio) { try { cryLoopHtmlAudio.pause(); cryLoopHtmlAudio.currentTime = 0; } catch (_) {} }
  cryAudio.playing = false;
  cryAudio.startedAt = null;
  duckBgm(false);
}

/** Start one-shot once; no stack. Syncs with dead-anim frame 0. */
function playDeathCry() {
  if (cryAudio.playing) return; // no double-play
  ensureAudio();
  stopDeathCry(); // clear any stray
  cryAudio.playing = true;
  const wall = performance.now();
  try {
    if (cryAudio.oneshotBuf && actx) {
      const src = actx.createBufferSource();
      src.buffer = cryAudio.oneshotBuf;
      const cryGain = actx.createGain();
      cryGain.gain.value = CRY_VOLUME;
      src.connect(cryGain);
      cryGain.connect(masterGain || actx.destination);
      src.onended = () => {
        if (cryAudio.source === src) {
          cryAudio.source = null;
          cryAudio.playing = false;
          duckBgm(false);
        }
      };
      cryAudio.source = src;
      cryAudio.startedAt = actx.currentTime;
      duckBgm(true);
      src.start(0);
      return;
    }
  } catch (e) {
    console.warn("[HBC] cry BufferSource failed", e);
  }
  // HTMLAudio fallback
  if (!cryHtmlAudio) cryHtmlAudio = new Audio(cryAudio.oneshotUrl || "audio/cry_death.mp3");
  cryHtmlAudio.muted = muted;
  cryHtmlAudio.volume = CRY_VOLUME;
  cryHtmlAudio.currentTime = 0;
  cryAudio.startedAt = wall / 1000;
  duckBgm(true);
  const p = cryHtmlAudio.play();
  if (p && p.catch) p.catch(() => {});
}

// ---------- Background music ----------
// One looping track for the whole session: starts on the first key/tap (audio unlock) and is never
// restarted — deaths, slot rolls, level changes and the gallery leave it alone. Routed through
// masterGain so the mute toggle silences it; ducked briefly under the death cry.
const BGM_VOLUME = 0.35;   // relative to master (SFX beeps / cry sit above it)
const BGM_DUCK = 0.4;      // music multiplier while the death cry plays
const bgm = {
  url: null, buf: null, html: null, src: null, gain: null,
  wanted: false,     // set by the first user gesture
  starts: 0,         // times the loop was (re)started — should stay 1 per page load
  t0: 0, offset: 0, loopStart: 0, loopEnd: 0, failed: false, mode: null,
};
// Trim codec padding / dead air at both ends so the wrap has no audible gap
function bgmLoopPoints(buf) {
  // 10 ms windows; a window counts as silent when its RMS is under -50 dBFS (lossy codecs leave faint noise)
  const ch = [];
  for (let c = 0; c < buf.numberOfChannels; c++) ch.push(buf.getChannelData(c));
  const win = Math.max(1, Math.floor(buf.sampleRate * 0.01)), th2 = 0.00316 * 0.00316;
  const loudWin = (i0) => {

    el.classList.add("active");
    ensureAudio();
  };
  const up = e => {
    e.preventDefault();
    keys[key] = false;
    el.classList.remove("active");
  };
  el.addEventListener("touchstart", down, { passive: false });
  el.addEventListener("touchend", up, { passive: false });
  el.addEventListener("touchcancel", up, { passive: false });
  el.addEventListener("mousedown", down);
  el.addEventListener("mouseup", up);
  el.addEventListener("mouseleave", up);
  el.addEventListener("contextmenu", e => e.preventDefault());
}

// ---------- Drawing helpers ----------
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawSilhouette(cx, cy, size, shape, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  ctx.translate(cx, cy);
  const s = size;
  if (shape === "hourglass") {
    // stylized figure: head + torso
    ctx.beginPath();
    ctx.arc(0, -s*0.38, s*0.16, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s*0.12, -s*0.2);
    ctx.lineTo(s*0.12, -s*0.2);
    ctx.lineTo(s*0.22, s*0.15);
    ctx.lineTo(s*0.1, s*0.15);
    ctx.lineTo(s*0.14, s*0.45);
    ctx.lineTo(-s*0.14, s*0.45);
    ctx.lineTo(-s*0.1, s*0.15);
    ctx.lineTo(-s*0.22, s*0.15);
    ctx.closePath();
    ctx.fill();
  } else if (shape === "star") {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI/2 + i * Math.PI*2/5;
      const a2 = a + Math.PI/5;
      ctx.lineTo(Math.cos(a)*s*0.45, Math.sin(a)*s*0.45);
      ctx.lineTo(Math.cos(a2)*s*0.18, Math.sin(a2)*s*0.18);
    }
    ctx.closePath();
    ctx.fill();
  } else if (shape === "diamond") {
    ctx.beginPath();
    ctx.moveTo(0, -s*0.45); ctx.lineTo(s*0.35, 0); ctx.lineTo(0, s*0.45); ctx.lineTo(-s*0.35, 0);
    ctx.closePath(); ctx.fill();
  } else if (shape === "heart") {
    ctx.beginPath();
    ctx.moveTo(0, s*0.3);
    ctx.bezierCurveTo(s*0.45, s*0.05, s*0.4, -s*0.3, 0, -s*0.15);
    ctx.bezierCurveTo(-s*0.4, -s*0.3, -s*0.45, s*0.05, 0, s*0.3);
    ctx.fill();
  } else { // circle
    ctx.beginPath();
    ctx.arc(0, 0, s*0.38, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// Canonical card aspect (width/height) from slot-roll card 72×96
const CARD_ASPECT = 72 / 96; // 3/4
function cardHeight(w) { return w / CARD_ASPECT; }
function cardWidth(h) { return h * CARD_ASPECT; }

// Iris cardbacks only (front art TBD). Graceful null → procedural.
const cardImgs = {
  ready: false,
  mystery: { sm: null, md: null, lg: null },
  normal: { sm: null, md: null, lg: null },
};

function pickCardSizeKey(drawW) {
  if (drawW <= 40) return "sm";
  if (drawW <= 200) return "md";
  return "lg";
}

function drawCardBitmap(img, x, y, w, h, smooth) {
  if (!img || !img.complete || img.naturalWidth < 1) return false;
  const ix = Math.floor(x), iy = Math.floor(y);
  const iw = Math.max(1, Math.floor(w)), ih = Math.max(1, Math.floor(h));
  ctx.save();
  ctx.imageSmoothingEnabled = !!smooth;
  if (smooth) ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, ix, iy, iw, ih);
  ctx.restore();
  return true;
}

// ---------- Babe card art (final roster) ----------
// Animation timing (art/cards/rarity/README_rarity.md + final/MANIFEST.md)
const RARITY_ANIM = {
  rare:  { big: { n: 8,  ms: 110, holdMs: 0 },    sm: { n: 4, ms: 180 } },  // shared sheen overlay
  ultra: { big: { n: 12, ms: 70,  holdMs: 1000 }, sm: { n: 4, ms: 180 } },  // baked frames; hold on 11
};
function rarityAnimFrame(tier, sizeKey) {
  const a = RARITY_ANIM[tier];
  const now = performance.now();
  if (sizeKey === "sm") return Math.floor(now / a.sm.ms) % a.sm.n;
  const sweep = a.big.n * a.big.ms;
  const t = now % (sweep + a.big.holdMs);
  return Math.min(a.big.n - 1, Math.floor(t / a.big.ms));
}
function imgOk(im) { return !!(im && im.complete && im.naturalWidth > 0); }

// URL-keyed image cache. img(url) returns a decoded Image or null (and starts loading it).
const IMG_CACHE = new Map(); // url -> Image | null (failed) | "loading"
function img(url) {
  const v = IMG_CACHE.get(url);
  if (v === undefined) { preloadUrls([url]); return null; }
  return imgOk(v) ? v : null;
}
function preloadUrls(urls) {
  return Promise.all(urls.map(u => {
    if (IMG_CACHE.has(u)) return null;
    IMG_CACHE.set(u, "loading");
    return loadImg(u).then(im => {
      IMG_CACHE.set(u, im);
      if (!im) console.warn("[HBC] missing card art", u);
    });
  }));
}

const ART_FILES = { sm: "15x20", md: "110x147", lg: "440x588" };
const pad2 = i => String(i).padStart(2, "0");
/** Static card for a babe at a size (Ultra: the still = frame 00 without shine). */
function babeArtUrl(b, key) {
  const f = ART_FILES[key];
  if (b.rarity === "rare") return "art/cards/final/rare/card_" + b.id + "_rare_" + f + ".png";
  if (b.rarity === "ultra") return "art/cards/final/ultra/card_" + b.id + "_ultra_" + f + ".png";
  return "art/cards/v3/card_" + b.id + "_" + f + ".png";
}
function ultraFrameUrl(b, key, i) {
  return "art/cards/final/ultra/frames/card_" + b.id + "_ultra_" + ART_FILES[key] + "_" + pad2(i) + ".png";
}
function rareSheenUrl(key, i) {
  return "art/cards/rarity/rare/anim_" + ART_FILES[key] + "_" + pad2(i) + ".png";
}
function animFrameCount(tier, key) { const a = RARITY_ANIM[tier]; return key === "sm" ? a.sm.n : a.big.n; }
// Ultra frames stream in per babe+size the first time they're drawn (440s are ~375KB each)
const ultraWarm = new Set();
function warmUltra(b, key) {
  const k = b.id + ":" + key;
  if (ultraWarm.has(k)) return;
  ultraWarm.add(k);
  const urls = [];
  for (let i = 0; i < animFrameCount("ultra", key); i++) urls.push(ultraFrameUrl(b, key, i));
  preloadUrls(urls);
}
function framesReady(b, key) {
  for (let i = 0; i < animFrameCount("ultra", key); i++) if (!img(ultraFrameUrl(b, key, i))) return false;
  return true;
}

/**
 * Draw a babe's final card, uniform 3:4, closest size: 15x20 for tiny spots (nearest-neighbour),
 * 110x147 up to 110px wide, 440x588 above that (lazy; 110 shown while it streams in).
 * Returns false if nothing is loaded yet (caller draws the procedural fallback).
 */
function drawBabeArt(b, x, y, w, h, sizeKey) {
  const want = sizeKey === "sm" ? "sm" : (Math.floor(w) <= 110 ? "md" : "lg");
  const keys = want === "lg" ? ["lg", "md"] : [want];
  for (const key of keys) {
    let base = null;
    if (b.rarity === "ultra") {
      warmUltra(b, key);
      // cycle the baked frames once all of them are in; until then show the still
      base = framesReady(b, key) ? img(ultraFrameUrl(b, key, rarityAnimFrame("ultra", key))) : null;
      if (!base) base = img(babeArtUrl(b, key));
    } else {
      base = img(babeArtUrl(b, key));
    }
    if (!base) continue;
    const smooth = key !== "sm" && Math.floor(w) < base.naturalWidth;
    drawCardBitmap(base, x, y, w, h, smooth);
    if (b.rarity === "rare") {
      const sheen = img(rareSheenUrl(key, rarityAnimFrame("rare", key)));
      if (sheen) drawCardBitmap(sheen, x, y, w, h, smooth);
    }
    return true;
  }
  return false;
}

// First load: every babe's 15x20 + 110x147 still and the small rare sheen frames.
// 440s and the Ultra animation frames load lazily when first drawn.
function preloadBabeArt() {
  const urls = [];
  for (const b of BABE_POOL) for (const key of ["sm", "md"]) urls.push(babeArtUrl(b, key));
  for (const key of ["sm", "md"]) for (let i = 0; i < animFrameCount("rare", key); i++) urls.push(rareSheenUrl(key, i));
  return preloadUrls(urls);
}

async function preloadCardArt() {
  const sizes = [
    ["sm", "15x20"],
    ["md", "110x147"],
    ["lg", "440x588"],
  ];
  const jobs = [];
  for (const [key, file] of sizes) {
    jobs.push(loadImg("art/cards/cardback/A5/cardback_" + file + ".png").then(im => { cardImgs.mystery[key] = im; }));
    jobs.push(loadImg("art/cards/cardback/normal/cardback_" + file + ".png").then(im => { cardImgs.normal[key] = im; }));
  }
  jobs.push(preloadBabeArt());
  await Promise.all(jobs);
  cardImgs.ready = true;
  return true;
}

function drawCard(char, x, y, w, h, opts) {
  opts = opts || {};
  // Uniform scale only — height always derived from width via CARD_ASPECT
  w = +w;
  h = cardHeight(w);
  const rar = rarityOf(char.id);
  const locked = !!opts.locked;
  const glow = opts.glow || 0;
  const iconOnly = !!opts.iconOnly;
  const sizeKey = pickCardSizeKey(w);
  // Smooth only when downscaling large (440) art into big UI views
  const useSmooth = sizeKey === "lg";

  if (glow > 0) {
    ctx.save();
    ctx.shadowColor = rar.color;
    ctx.shadowBlur = 18 * glow;
    roundRect(x, y, w, h, 8);
    ctx.fillStyle = rar.color;
    ctx.fill();
    ctx.restore();
  }

  // Locked / missing: regular cardback (Iris) instead of grey ??? silhouette
  if (locked) {
    const back = cardImgs.normal[sizeKey];
    if (drawCardBitmap(back, x, y, w, h, useSmooth)) {
      // light frame
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 2;
      roundRect(x + 1, y + 1, w - 2, h - 2, 6);
      ctx.stroke();
    } else {
      // procedural fallback
      const g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, "#2a2a32");
      g.addColorStop(1, "#1a1a22");
      roundRect(x, y, w, h, 8);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 3;
      roundRect(x + 1.5, y + 1.5, w - 3, h - 3, 7);
      ctx.stroke();
      drawSilhouette(x + w / 2, y + h * (iconOnly ? 0.52 : 0.42), Math.min(w, h) * 0.55, char.shape, "#3a3a44");
    }
    if (!iconOnly) {
      ctx.textAlign = "center";
      ctx.font = `bold ${Math.max(10, Math.floor(w * 0.12))}px sans-serif`;
      ctx.fillStyle = "#666";
      ctx.fillText("???", x + w / 2, y + h - 12);
    }
    return;
  }

  // Owned: the girl's final card (frame + name banner baked in)
  if (drawBabeArt(char, x, y, w, h, sizeKey)) {
    drawCardBadges(char, x, y, w, h, opts, iconOnly);
    return;
  }

  // Fallback while art loads / if a file is missing: procedural card
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, `hsl(${char.hue}, 70%, 55%)`);
  g.addColorStop(0.55, `hsl(${char.hue + 20}, 65%, 35%)`);
  g.addColorStop(1, `hsl(${char.hue}, 50%, 18%)`);
  roundRect(x, y, w, h, 8);
  ctx.fillStyle = g;
  ctx.fill();
  // Base border (common; also rare/ultra fallback while frames load)
  ctx.strokeStyle = rar.color;
  ctx.lineWidth = 3;
  roundRect(x + 1.5, y + 1.5, w - 3, h - 3, 7);
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1;
  if (iconOnly) roundRect(x + 3, y + 3, w - 6, h - 6, 4);
  else roundRect(x + 8, y + 8, w - 16, h - 28, 4);
  ctx.stroke();
  drawSilhouette(
    x + w / 2,
    y + h * (iconOnly ? 0.52 : 0.42),
    Math.min(w, h) * (iconOnly ? 0.62 : 0.55),
    char.shape,
    "rgba(255,255,255,0.92)"
  );

  if (!iconOnly) {
    ctx.textAlign = "center";
    ctx.font = `bold ${Math.max(10, Math.floor(w * 0.12))}px sans-serif`;
    ctx.fillStyle = "#fff";
    ctx.fillText(char.name, x + w / 2, y + h - 12);
    if (opts.showRarity !== false && !maxTagShown(opts, w, iconOnly)) { // MAX tag takes that corner
      ctx.font = `${Math.max(8, Math.floor(w * 0.08))}px sans-serif`;
      ctx.fillStyle = rar.color;
      ctx.fillText(rar.label, x + w / 2, y + 14);
    }
  }

  drawCardBadges(char, x, y, w, h, opts, iconOnly);
}

function maxTagShown(opts, w, iconOnly) {
  const isMax = opts.max != null ? !!opts.max : (opts.count != null && opts.count >= MAX_COPIES);
  return isMax && !iconOnly && w >= 44;
}
function drawCardBadges(char, x, y, w, h, opts, iconOnly) {
  // MAX tag (owned MAX_COPIES): top-left pill, only where it stays readable
  if (maxTagShown(opts, w, iconOnly)) {
    const fs = Math.max(8, Math.min(12, Math.floor(w * 0.11)));
    ctx.save();
    ctx.font = "bold " + fs + "px sans-serif";
    const tw = Math.ceil(ctx.measureText("MAX").width) + 8;
    const th = fs + 5;
    ctx.fillStyle = "#ffd24a";
    roundRect(x + 4, y + 4, tw, th, 3);
    ctx.fill();
    ctx.strokeStyle = "rgba(60,20,0,0.85)";
    ctx.lineWidth = 1;
    roundRect(x + 4, y + 4, tw, th, 3);
    ctx.stroke();
    ctx.fillStyle = "#3a1600";
    ctx.textAlign = "center";
    ctx.fillText("MAX", x + 4 + tw / 2, y + 4 + th - 4);
    ctx.restore();
  }
  // Dupe badge
  if (opts.count != null && opts.count > 1) {
    if (iconOnly) {
      if (w >= 22) {
        const r = Math.max(5, Math.min(7, w * 0.22));
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.beginPath();
        ctx.arc(x + w - r - 2, y + r + 2, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffe66d";
        ctx.font = "bold " + Math.max(7, Math.floor(r * 1.35)) + "px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(opts.count), x + w - r - 2, y + r + 2.5);
        ctx.textBaseline = "alphabetic";
      }
    } else {
      const bw = Math.max(16, Math.min(22, w * 0.35));
      const bh = Math.max(12, Math.min(16, h * 0.14));
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      roundRect(x + w - bw - 4, y + 4, bw, bh, 3);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold " + Math.max(8, Math.floor(bh * 0.75)) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("x" + opts.count, x + w - bw / 2 - 4, y + 4 + bh * 0.78);
    }
  } else if (!iconOnly && opts.count != null && opts.count > 0) {
    const bw = Math.max(16, Math.min(22, w * 0.35));
    const bh = Math.max(12, Math.min(16, h * 0.14));
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(x + w - bw - 4, y + 4, bw, bh, 3);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold " + Math.max(8, Math.floor(bh * 0.75)) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("x" + opts.count, x + w - bw / 2 - 4, y + 4 + bh * 0.78);
  }
}

// Evenly spread pick of k items from an array (keeps order)
function spreadPick(arr, k) {
  if (k >= arr.length) return arr.slice();
  if (k <= 0) return [];
  const out = [];
  for (let i = 0; i < k; i++) out.push(arr[Math.floor((i + 0.5) * arr.length / k)]);
  return out;
}

// Mid-level checkpoints: placed near these fractions of the start→goal run, on safe ground
const CP_FRACTIONS = [1 / 3, 2 / 3];
const CP_ENEMY_CLEAR = 4; // tiles kept clear of any enemy patrol range
// Flyer motion envelope (px): hover band ± FLY_BOB, plus up to FLY_SWOOP lower while swooping.
// The lowest point keeps FLY_HEAD_CLEAR px above a standing player's head on the highest floor nearby.
const FLY_W = 26, FLY_H = 20, FLY_BOB = 8, FLY_SWOOP = 80, FLY_HEAD_CLEAR = 2;
const FLY_RANGE = 150, FLY_TELL = 0.3, FLY_DIVE_V = 120, FLY_RISE_V = 70, FLY_HOLD = 0.45, FLY_COOL = 1.4;

function buildLevel(def, diff) {
  const plats = [], picks = [], slots = [], cps = [], cutSpots = [], offs = [];
  let ox = 0, goalX = null;
  for (const key of def.sections) {
    offs.push(ox);
    const sec = SECTIONS[key];
    for (const [x, y, w, h] of sec.plats) if (w > 0) plats.push({ x: x + ox, y, w, h });
    for (const [x, y] of sec.picks || []) picks.push([x + ox, y]);
    for (const e of sec.enemies || []) slots.push(Object.assign({}, e, { x: e.x + ox, a: e.a + ox, b: e.b + ox }));
    for (const c of sec.cps || []) cps.push(c + ox); // only the first (start spawn) is used
    for (const c of sec.cuts || []) cutSpots.push(c + ox);
    if (sec.goal != null) goalX = sec.goal + ox;
    ox += sec.w;
  }
  const width = ox;
  // Babe pickups: keep dropRate share (1.0 → all)
  const keptPicks = spreadPick(picks, Math.round(picks.length * diff.dropRate));
  // Enemies: tier 1 base, scaled by enemyCount using tier 2 bonus slots
  const t1 = slots.filter(e => e.tier === 1), t2 = slots.filter(e => e.tier !== 1);
  const target = Math.round(t1.length * diff.enemyCount);
  const chosen = target <= t1.length ? spreadPick(t1, target) : t1.concat(spreadPick(t2, target - t1.length));
  chosen.sort((a, b) => a.x - b.x);
  // Flyers (explicit per level; not scaled by enemyCount). Hover from the highest floor under the patrol ±2 tiles.
  const flyers = (def.flyers || []).map(([si, x, a, b, vx]) => {
    const o = offs[si], A = a + o, B = b + o;
    let floorTop = Infinity;
    for (const p of plats) if (p.x < B + 2 && p.x + p.w > A - 2) floorTop = Math.min(floorTop, p.y * TILE);
    const PH = 44; // PLAYER_H
    const hoverY = floorTop - PH - FLY_HEAD_CLEAR - FLY_SWOOP - FLY_BOB - FLY_H;
    return { type: "flyer", x: x + o, a: A, b: B, vx, tier: 1, hoverY, floorTop };
  });
  // Checkpoints: start spawn + one near each CP_FRACTIONS point, searched outward for safe ground:
  // solid ground under [x-2, x+3], nothing low overhead, no enemy patrol within CP_ENEMY_CLEAR tiles
  cps.sort((a, b) => a - b);
  const startX = cps.length ? cps[0] : 2;
  const endX = goalX != null ? goalX : width - 4;
  const safeCp = x => plats.some(p => p.y === GROUND_Y && p.x <= x - 2 && p.x + p.w >= x + 3) &&
    !plats.some(p => p.y < GROUND_Y && p.y >= GROUND_Y - 4 && p.x < x + 3 && p.x + p.w > x - 1) &&
    !chosen.concat(flyers).some(e => x >= e.a - CP_ENEMY_CLEAR && x <= e.b + CP_ENEMY_CLEAR) &&
    !keptPicks.some(([px]) => Math.abs(px - x) < 2);
  const keptCps = [startX];
  if (def.boss) {
    // Arena entrance: prefer the second section's cp; fall back to the first tile of ground past the run-in
    let mid = cps.find(c => c > startX + 8);
    if (mid == null) mid = Math.round(width * 0.4);
    // Snap onto solid ground (boss arenas start mid-level so the usual ±2 pad can miss the seam)
    for (let d = 0; d < 40; d++) {
      const tryX = [mid + d, mid - d].find(x => x > startX + 4 &&
        plats.some(p => p.y === GROUND_Y && p.x <= x && p.x + p.w >= x + 2));
      if (tryX != null) { keptCps.push(tryX); break; }
    }
  } else {
    for (const f of CP_FRACTIONS) {
      const target = Math.round(startX + (endX - startX) * f);
      for (let d = 0; d < 80; d++) {
        const x = [target + d, target - d].find(safeCp);
        if (x != null) { keptCps.push(x); break; }
      }
    }
  }
  // Pits: cut a 2-tile gap into a share of the marked ground spots (never under a pickup/enemy/flag)
  const blocked = x => keptPicks.some(([px]) => Math.abs(px - x) < 3) || chosen.some(e => Math.abs(e.x - x) < 3) ||
    keptCps.some(c => Math.abs(c - x) < 4) || (goalX != null && Math.abs(goalX - x) < 4);
  const freeSpots = cutSpots.filter(x => !blocked(x) && !blocked(x + 1));
  const nCuts = Math.round(freeSpots.length * Math.min(1, 0.35 * diff.pitFreq));
  let cuts = 0;
  for (const cx of spreadPick(freeSpots, nCuts)) {
    const i = plats.findIndex(p => p.y === GROUND_Y && p.x + 1 < cx && p.x + p.w > cx + 3);
    if (i < 0) continue;
    const p = plats[i];
    plats.splice(i, 1, { x: p.x, y: p.y, w: cx - p.x, h: p.h }, { x: cx + 2, y: p.y, w: p.x + p.w - (cx + 2), h: p.h });
    cuts++;
  }
  return {
    id: def.id, name: def.name, theme: LEVEL_THEMES[def.theme] || LEVEL_THEMES.dusk, diff,
    width, plats, picks: keptPicks, enemySlots: chosen.concat(flyers), pits: cuts, boss: !!def.boss,
    checkpoints: keptCps.map(x => ({ x: x * TILE, y: GROUND_Y * TILE })),
    // Boss levels: the goal starts inactive (unlocked after the fight); arenaLeft = second checkpoint
    goal: { x: (goalX != null ? goalX : width - 4) * TILE, y: 12 * TILE, w: 20, h: 96, active: !def.boss },
    arenaLeft: def.boss && keptCps.length > 1 ? keptCps[1] * TILE : null,
  };
}

// Enemies: type 'walker' | 'hopper'
function enemyOnPlat(type, xTile, platY, w, h, extra) {
  const top = platY * TILE;
  return Object.assign({
    type, x: xTile * TILE, y: top - h, w, h,
    vx: 0, vy: 0, dir: 1, alive: true,
    prevX: xTile * TILE, prevY: top - h,
  }, extra || {});
}

function makeEnemies() {
  const sp = level.diff.enemySpeed;
  return level.enemySlots.map((e, i) => {
    if (e.type === "flyer") {
      return { type: "flyer", x: e.x * TILE, y: e.hoverY, w: FLY_W, h: FLY_H, vx: e.vx * sp, vy: 0, dir: i % 2 ? -1 : 1,
        alive: true, minX: e.a * TILE, maxX: e.b * TILE, baseY: e.hoverY, t: i * 1.3, flap: i * 0.7,
        mode: "patrol", modeT: 0, swoop: 0, cool: 0, prevX: e.x * TILE, prevY: e.hoverY };
    }
    const hop = e.type === "hopper";
    return enemyOnPlat(e.type, e.x, e.y, hop ? 26 : 28, hop ? 26 : 28, {
      vx: e.vx * sp, dir: i % 2 ? -1 : 1, minX: e.a * TILE, maxX: e.b * TILE,
      hopT: e.hopT || 0, hopEvery: 1.1 / sp,
    });
  });
}
