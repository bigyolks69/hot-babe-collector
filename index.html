<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1020;
    font-family: "Segoe UI", system-ui, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex;

    justify-content: center;

  #touch {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;

  #touch.show { display: block; }
  .tbtn {
    position: absolute;
    pointer-events: auto;
    width: 78px; height: 78px;

    border: 3px solid rgba(255,255,255,0.30); /* ~70% transparent outline */
    color: rgba(255,255,255,0.30); /* ~70% transparent glyph */
    font-size: 26px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: none;
    -webkit-user-select: none;

    touch-action: none;

  .tbtn:active, .tbtn.active {
    background: rgba(255,120,180,0.28);
    border-color: rgba(255,255,255,0.45);

    transform: scale(0.96);

  #tLeft  { left: max(16px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom)); }
  #tRight { left: calc(max(16px, env(safe-area-inset-left)) + 90px); bottom: max(24px, env(safe-area-inset-bottom)); }

    right: max(16px, env(safe-area-inset-right));

  }
  /* Collection — top-left pill, below heart row so it clears HUD */
  #tColl  {
    left: max(12px, env(safe-area-inset-left));
    top: max(52px, calc(env(safe-area-inset-top) + 44px));
    width: auto;
    min-width: 108px;
    height: 40px;
    padding: 0 14px;
    border-radius: 20px;

<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="touch">

<script>
"use strict";

// ============================================================
// Hot Babe Collector — Big Salty Gaming Studio
// Prototype: self-contained Canvas 2D platformer
// ============================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

// ---------- Pixel-art hero (32×48, faces right; flip for left) ----------
// Set true to use hero_idle_side.png for idle instead of front-facing breath cycle
const HERO_IDLE_USE_SIDE = false;
const HERO_SW = 32;
const HERO_SH = 48;
// Opaque idle ≈ (1,0)–(28,47). Slim collision inset; feet = sprite bottom.
const HERO_INSET_X = 7;  // → hitbox width 18
const HERO_INSET_TOP = 4; // → hitbox height 44
const PLAYER_W = HERO_SW - HERO_INSET_X * 2; // 18
const PLAYER_H = HERO_SH - HERO_INSET_TOP;   // 44
const HERO_IDLE_MS = 500;
const HERO_RUN_MS = 90;
const HERO_DEAD_MS = 260;
const DEATH_CRY_SCALE = 6; // 32×48 → 192×288
const DEATH_FLASH_HOLD = 0.08; // full white before black cry
const DEATH_FLASH_FADE = 0.10; // white → black+cry

const heroSprites = {
  ready: false,
  failed: false,
  idle: [null, null],      // front breath
  idleSide: null,
  runSheet: null,          // 192×48, 6 frames
  jumpUp: null,
  jumpFall: null,
  hurt: null,
  dead: [null, null],
};

function loadImg(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

async function preloadHeroSprites() {
  const base = "art/hero/pixel/";
  const [
    idle0, idle1, idleSide, runSheet,
    jumpUp, jumpFall, hurt, dead0, dead1,
  ] = await Promise.all([
    loadImg(base + "hero_idle.png"),
    loadImg(base + "hero_idle_1.png"),
    loadImg(base + "hero_idle_side.png"),
    loadImg(base + "hero_run_sheet.png"),
    loadImg(base + "hero_jump_up.png"),
    loadImg(base + "hero_jump_fall.png"),
    loadImg(base + "hero_hurt.png"),
    loadImg(base + "hero_dead_0.png"),
    loadImg(base + "hero_dead_1.png"),
  ]);
  heroSprites.idle = [idle0, idle1];
  heroSprites.idleSide = idleSide;
  heroSprites.runSheet = runSheet;
  heroSprites.jumpUp = jumpUp;
  heroSprites.jumpFall = jumpFall;
  heroSprites.hurt = hurt;
  heroSprites.dead = [dead0, dead1];
  const need = [idle0, idle1, runSheet, jumpUp, jumpFall, hurt, dead0, dead1];
  heroSprites.failed = need.some(im => !im);
  heroSprites.ready = !heroSprites.failed;
  return heroSprites.ready;
}

// Test/screenshot pose override: "idle"|"run"|"jumpUp"|"jumpFall"|"hurt"|"dead"|null
let debugHeroPose = null;

function heroFrameForState() {
  const pose = debugHeroPose || (
    (state === "dead" || state === "dying") ? "dead" :
    player.stun > 0 ? "hurt" :
    !player.onGround ? (player.vy < 0 ? "jumpUp" : "jumpFall") :
    Math.abs(player.vx) > 30 ? "run" : "idle"
  );
  if (pose === "dead") {
    // When dying: animT reset to 0 as black cry (+audio) starts — synced to 260ms beats
    const ms = (state === "dying" && deathCry && deathCry.animStarted)
      ? deathCry.animT * 1000
      : performance.now();
    const fi = Math.floor((ms / HERO_DEAD_MS) % 2);
    return { img: heroSprites.dead[fi], sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  if (pose === "hurt") {
    return { img: heroSprites.hurt, sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  if (pose === "jumpUp") {
    return { img: heroSprites.jumpUp, sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  if (pose === "jumpFall") {
    return { img: heroSprites.jumpFall, sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  if (pose === "run") {
    const fi = Math.floor((performance.now() / HERO_RUN_MS) % 6);
    return { img: heroSprites.runSheet, sx: fi * HERO_SW, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  // idle
  if (HERO_IDLE_USE_SIDE && heroSprites.idleSide) {
    return { img: heroSprites.idleSide, sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
  }
  const fi = Math.floor((performance.now() / HERO_IDLE_MS) % 2);
  return { img: heroSprites.idle[fi], sx: 0, sy: 0, sw: HERO_SW, sh: HERO_SH };
}

function drawHeroSprite() {
  const fr = heroFrameForState();
  if (!fr.img) return false;
  const px = Math.floor(player.x + player.w / 2);
  const py = Math.floor(player.y + player.h);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(px, py);
  if (player.facing < 0) ctx.scale(-1, 1);
  ctx.drawImage(fr.img, fr.sx, fr.sy, fr.sw, fr.sh, -Math.floor(HERO_SW / 2), -HERO_SH, HERO_SW, HERO_SH);
  ctx.restore();
  return true;
}

function drawPlayerFallback() {
  const px = player.x, py = player.y;
  ctx.fillStyle = "#6ec8ff";
  roundRect(px, py + 8, player.w, player.h - 8, 4);
  ctx.fill();
  ctx.fillStyle = "#ffdbb0";
  ctx.fillRect(px + 2, py, player.w - 4, 14);
  ctx.fillStyle = "#ff5a9a";
  ctx.fillRect(px + 1, py - 2, player.w - 2, 6);
  ctx.fillStyle = "#222";
  const ex = player.facing >= 0 ? px + player.w - 8 : px + 4;
  ctx.fillRect(ex, py + 5, 3, 3);
  const leg = Math.sin(player.anim) * (player.onGround && Math.abs(player.vx) > 30 ? 4 : 0);
  ctx.fillStyle = "#3a6a9a";
  ctx.fillRect(px + 2, py + player.h - 8, 5, 8 + leg);
  ctx.fillRect(px + player.w - 7, py + player.h - 8, 5, 8 - leg);
}

function drawPlayer() {
  // Invulnerability flash (also during death we still draw)
  if (state !== "dead" && state !== "dying" && player.flash > 0 && Math.floor(player.flash * 12) % 2 !== 0) return;
  if (heroSprites.ready && drawHeroSprite()) return;
  drawPlayerFallback();
}


// ---------- WebAudio SFX + Music Macky death cry ----------
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
let masterGain = null;
const MUTE_KEY = "hbc_muted";
let muted = false;
try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (_) {}

function ensureAudio() {
  if (!actx) {
    actx = new AudioCtx();
    masterGain = actx.createGain();
    masterGain.gain.value = muted ? 0 : 1;
    masterGain.connect(actx.destination);
  }
  if (actx.state === "suspended") actx.resume();
  if (masterGain) masterGain.gain.value = muted ? 0 : 1;
}

function setMuted(v) {
  muted = !!v;
  try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch (_) {}
  if (masterGain) masterGain.gain.value = muted ? 0 : 1;
  if (cryHtmlAudio) cryHtmlAudio.muted = muted;
  if (cryLoopHtmlAudio) cryLoopHtmlAudio.muted = muted;
  const btn = document.getElementById("muteBtn");
  if (btn) {
    btn.textContent = muted ? "🔇" : "🔊";
    btn.setAttribute("aria-label", muted ? "Unmute" : "Mute");
  }
}

function beep(freq, dur, type, vol, slide) {
  try {
    ensureAudio();
    if (muted) return;
    const t0 = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(masterGain || actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (_) {}
}
const sfx = {
  jump:  () => beep(420, 0.12, "square", 0.07, 280),
  coin:  () => { beep(880, 0.08, "square", 0.06); setTimeout(() => beep(1175, 0.12, "square", 0.05), 60); },
  tick:  () => beep(600 + Math.random() * 400, 0.03, "triangle", 0.035),
  hit:   () => beep(160, 0.25, "sawtooth", 0.09, 60),
  stomp: () => beep(200, 0.1, "square", 0.07, 80),
  lose:  () => { beep(300, 0.2, "sawtooth", 0.08, 100); setTimeout(() => beep(150, 0.3, "sawtooth", 0.07, 50), 180); },
  win:   () => { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.18, "square", 0.06), i*120)); },
  new:   () => { beep(700, 0.1, "square", 0.06); setTimeout(() => beep(1050, 0.2, "square", 0.06), 100); },
};

// Death cry (Music Macky): 1.500s one-shot, sobs on 260ms beats
const CRY_VOLUME = 0.25; // relative to prior full-level cry (other SFX unchanged)
const cryAudio = {
  oneshotBuf: null,
  loopBuf: null,       // available; only if dying ever exceeds 1.5s
  oneshotUrl: null,
  loopUrl: null,
  ready: false,
  source: null,        // active BufferSource
  loopSource: null,
  startedAt: null,     // actx.currentTime or performance when started
  playing: false,
};
let cryHtmlAudio = null;
let cryLoopHtmlAudio = null;

function pickAudioUrl(baseNoExt) {
  const probe = document.createElement("audio");
  const ogg = probe.canPlayType('audio/ogg; codecs="vorbis"') || probe.canPlayType("audio/ogg");
  if (ogg && ogg !== "no") return baseNoExt + ".ogg";
  return baseNoExt + ".mp3";
}

async function fetchDecode(url) {
  ensureAudio();
  const res = await fetch(url);
  if (!res.ok) throw new Error("fetch " + url + " " + res.status);
  const ab = await res.arrayBuffer();
  return await actx.decodeAudioData(ab.slice(0));
}

async function preloadCryAudio() {
  cryAudio.oneshotUrl = pickAudioUrl("audio/cry_death");
  cryAudio.loopUrl = pickAudioUrl("audio/cry_death_loop");
  // Prefer OGG path when supported; pickAudioUrl already chose
  try {
    ensureAudio();
    cryAudio.oneshotBuf = await fetchDecode(cryAudio.oneshotUrl);
    try { cryAudio.loopBuf = await fetchDecode(cryAudio.loopUrl); } catch (_) { cryAudio.loopBuf = null; }
    cryAudio.ready = true;
  } catch (e) {
    // file:// or decode failure → HTMLAudioElement fallback
    console.warn("[HBC] WebAudio cry decode failed, using HTMLAudioElement", e && e.message);
    cryHtmlAudio = new Audio(cryAudio.oneshotUrl);
    cryHtmlAudio.preload = "auto";
    cryLoopHtmlAudio = new Audio(cryAudio.loopUrl);
    cryLoopHtmlAudio.preload = "auto";
    cryLoopHtmlAudio.loop = true;
    cryAudio.ready = true;
  }
}

function stopDeathCry() {
  try {
    if (cryAudio.source) {
      try { cryAudio.source.stop(0); } catch (_) {}
      cryAudio.source.disconnect();
      cryAudio.source = null;
    }
    if (cryAudio.loopSource) {
      try { cryAudio.loopSource.stop(0); } catch (_) {}
      cryAudio.loopSource.disconnect();
      cryAudio.loopSource = null;
    }
  } catch (_) {}
  if (cryHtmlAudio) { try { cryHtmlAudio.pause(); cryHtmlAudio.currentTime = 0; } catch (_) {} }
  if (cryLoopHtmlAudio) { try { cryLoopHtmlAudio.pause(); cryLoopHtmlAudio.currentTime = 0; } catch (_) {} }
  cryAudio.playing = false;
  cryAudio.startedAt = null;
}

/** Start one-shot once; no stack. Syncs with dead-anim frame 0. */
function playDeathCry() {
  if (cryAudio.playing) return; // no double-play
  ensureAudio();
  stopDeathCry(); // clear any stray
  cryAudio.playing = true;
  const wall = performance.now();
  try {
    if (cryAudio.oneshotBuf && actx) {
      const src = actx.createBufferSource();
      src.buffer = cryAudio.oneshotBuf;
      const cryGain = actx.createGain();
      cryGain.gain.value = CRY_VOLUME;
      src.connect(cryGain);
      cryGain.connect(masterGain || actx.destination);
      src.onended = () => {
        if (cryAudio.source === src) {
          cryAudio.source = null;
          cryAudio.playing = false;
        }
      };
      cryAudio.source = src;
      cryAudio.startedAt = actx.currentTime;
      src.start(0);
      console.log("[HBC] cry_death start (WebAudio)", { wallMs: wall, ctxT: cryAudio.startedAt, animT: 0 });
      return;
    }
  } catch (e) {
    console.warn("[HBC] cry BufferSource failed", e);
  }
  // HTMLAudio fallback
  if (!cryHtmlAudio) cryHtmlAudio = new Audio(cryAudio.oneshotUrl || "audio/cry_death.mp3");
  cryHtmlAudio.muted = muted;
  cryHtmlAudio.volume = CRY_VOLUME;
  cryHtmlAudio.currentTime = 0;
  cryAudio.startedAt = wall / 1000;
  const p = cryHtmlAudio.play();
  if (p && p.catch) p.catch(() => {});
  console.log("[HBC] cry_death start (HTMLAudio)", { wallMs: wall, animT: 0 });
}

function maybeStartCryLoop() {
  // Only if dying somehow exceeds one-shot length
  if (!deathCry || deathCry.t < 1.5 || cryAudio.loopSource || (cryLoopHtmlAudio && !cryLoopHtmlAudio.paused)) return;
  ensureAudio();
  try {
    if (cryAudio.loopBuf && actx) {
      const src = actx.createBufferSource();
      src.buffer = cryAudio.loopBuf;
      src.loop = true;
      const cryGain = actx.createGain();
      cryGain.gain.value = CRY_VOLUME;
      src.connect(cryGain);
      cryGain.connect(masterGain || actx.destination);
      cryAudio.loopSource = src;
      src.start(0);
      console.log("[HBC] cry_death_loop start (overflow)");
      return;
    }
  } catch (_) {}
  if (cryLoopHtmlAudio) {
    cryLoopHtmlAudio.muted = muted;
    cryLoopHtmlAudio.volume = CRY_VOLUME;
    cryLoopHtmlAudio.currentTime = 0;
    const p = cryLoopHtmlAudio.play();
    if (p && p.catch) p.catch(() => {});
  }
}

// ---------- Babe pool (data-driven; grow by appending entries) ----------
const RARITIES = [
  // Pull odds: roll tier first (weights), then uniform within tier
  { id: "common", label: "Common",     color: "#9aa0a6", weight: 88, order: 0 },
  { id: "rare",   label: "Rare",       color: "#7ec8ff", weight: 10, order: 1 },
  { id: "ultra",  label: "Ultra Rare", color: "#ffd24a", weight: 2,  order: 2 },
];
const RARITY_ORDER = Object.fromEntries(RARITIES.map(r => [r.id, r.order]));

// Babe defs — ids stable; rarities: 22 Common / 6 Rare / 2 Ultra Rare.
// Rarity is per-babe data. Named girls (Mika, Sora, Rin, Kaede, Yuki) are always Common;
// Rare/Ultra live only on anonymous placeholder slots until real tiers are decided.
// `front`: Iris v3 card front (frame + name banner baked in) → art/cards/v3/card_<front>_<size>.png
const BABE_POOL = [
  // —— Common (22): 5 real girls + 17 placeholders ——
  { id: "mika",    name: "Mika",    rarity: "common", hue: 330, shape: "heart",     front: "mika" },
  { id: "sora",    name: "Sora",    rarity: "common", hue: 55,  shape: "star",      front: "sora" },

const BABE_ID_MIGRATE = {

function babeById(id) { return BABE_POOL.find(b => b.id === id) || null; }
function rarityOf(id) {
  const c = babeById(id);
  return RARITIES.find(r => r.id === (c ? c.rarity : "common"));
}
function rarityRank(id) { return RARITY_ORDER[(babeById(id) || {}).rarity] || 0; }

// Debug-only pull forcing (never changes tier data):
//   ?debugPull=<id>[,<id>…]  — next pulls land on these babes, in order
//   ?debugRarity=rare|ultra — every pull rolls this tier
//   console: __HBC.forcePull(id), __HBC.setDebugRarity(tier|null)
const debugPulls = [];
let debugRarity = null;
try {
  const qs = new URLSearchParams(location.search);
  if (qs.get("debugPull")) debugPulls.push(...qs.get("debugPull").split(",").map(x => x.trim()).filter(Boolean));
  if (qs.get("debugRarity")) debugRarity = qs.get("debugRarity");
} catch (e) {}

function rollCharacter() {
  while (debugPulls.length) {
    const forced = babeById(debugPulls.shift());
    if (forced) return forced;
  }
  if (debugRarity) {
    const tierPool = BABE_POOL.filter(c => c.rarity === debugRarity);
    if (tierPool.length) return tierPool[Math.floor(Math.random() * tierPool.length)];
  }
  // Tier first (88% / 10% / 2%), then uniform within that tier
  const total = RARITIES.reduce((s, r) => s + r.weight, 0);
  let n = Math.random() * total;
  let rarity = RARITIES[0];
  for (const r of RARITIES) { n -= r.weight; if (n <= 0) { rarity = r; break; } }
  const pool = BABE_POOL.filter(c => c.rarity === rarity.id);
  if (!pool.length) return BABE_POOL[0];
  return pool[Math.floor(Math.random() * pool.length)];
}

function ownedUniqueCount(col) {
  return Object.keys(col).filter(k => col[k] > 0 && babeById(k)).length;

const SAVE_KEY = "hbc_collection_v1";
const SAVE_KEY_V2 = "hbc_collection_v2";
function migrateCollectionCounts(col) {
  if (!col || typeof col !== "object") return {};
  const out = {};
  for (const [k, v] of Object.entries(col)) {
    const n = +v || 0;
    if (n <= 0) continue;
    const id = BABE_ID_MIGRATE[k] || k;
    if (!babeById(id)) continue; // drop unknown / removed placeholders
    out[id] = (out[id] || 0) + n;
  }
  return out;
}
function loadCollection() {
  try {
    let counts = null;
    const v2 = localStorage.getItem(SAVE_KEY_V2);
    if (v2) {
      const obj = JSON.parse(v2);
      if (obj && typeof obj === "object" && obj.counts && typeof obj.counts === "object") counts = obj.counts;
    }
    if (!counts) {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return {};
      const obj = JSON.parse(raw);
      if (obj && typeof obj === "object") counts = obj;
    }
    if (!counts) return {};
    const migrated = migrateCollectionCounts(counts);
    // Persist cleaned map so removed ids don't linger
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(migrated));
      localStorage.setItem(SAVE_KEY_V2, JSON.stringify({ v: 2, counts: migrated }));
    } catch {}
    return migrated;
  } catch { return {}; }
}

    localStorage.setItem(SAVE_KEY_V2, JSON.stringify({ v: 2, counts: col }));

}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawSilhouette(cx, cy, size, shape, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  ctx.translate(cx, cy);
  const s = size;
  if (shape === "hourglass") {
    // stylized figure: head + torso
    ctx.beginPath();
    ctx.arc(0, -s*0.38, s*0.16, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s*0.12, -s*0.2);
    ctx.lineTo(s*0.12, -s*0.2);
    ctx.lineTo(s*0.22, s*0.15);
    ctx.lineTo(s*0.1, s*0.15);
    ctx.lineTo(s*0.14, s*0.45);
    ctx.lineTo(-s*0.14, s*0.45);
    ctx.lineTo(-s*0.1, s*0.15);
    ctx.lineTo(-s*0.22, s*0.15);
    ctx.closePath();
    ctx.fill();
  } else if (shape === "star") {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI/2 + i * Math.PI*2/5;
      const a2 = a + Math.PI/5;
      ctx.lineTo(Math.cos(a)*s*0.45, Math.sin(a)*s*0.45);
      ctx.lineTo(Math.cos(a2)*s*0.18, Math.sin(a2)*s*0.18);
    }
    ctx.closePath();
    ctx.fill();
  } else if (shape === "diamond") {
    ctx.beginPath();
    ctx.moveTo(0, -s*0.45); ctx.lineTo(s*0.35, 0); ctx.lineTo(0, s*0.45); ctx.lineTo(-s*0.35, 0);
    ctx.closePath(); ctx.fill();
  } else if (shape === "heart") {
    ctx.beginPath();
    ctx.moveTo(0, s*0.3);
    ctx.bezierCurveTo(s*0.45, s*0.05, s*0.4, -s*0.3, 0, -s*0.15);
    ctx.bezierCurveTo(-s*0.4, -s*0.3, -s*0.45, s*0.05, 0, s*0.3);
    ctx.fill();
  } else { // circle
    ctx.beginPath();
    ctx.arc(0, 0, s*0.38, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawCardBitmap(img, x, y, w, h, smooth) {

// Artist Iris rarity frames (art/cards/rarity/README_rarity.md).
// Layering @110/440: art (inset 4 units) → ultra holo → frame → name in banner → anim overlay.
// @15x20: face → anim_15x20 frame (includes the frame).
const RARITY_ART = {
  rare:  { frame: {}, holo: {}, anim: { sm: [], md: [], lg: [] } },
  ultra: { frame: {}, holo: {}, anim: { sm: [], md: [], lg: [] } },
};
const RARITY_ANIM = {
  rare:  { big: { n: 8,  ms: 110, holdMs: 0 },    sm: { n: 4, ms: 180 } },
  ultra: { big: { n: 12, ms: 70,  holdMs: 1000 }, sm: { n: 4, ms: 180 } }, // hold on frame 11 between sweeps
};
function rarityAnimFrame(tier, sizeKey) {
  const a = RARITY_ANIM[tier];
  const now = performance.now();
  if (sizeKey === "sm") return Math.floor(now / a.sm.ms) % a.sm.n;
  const sweep = a.big.n * a.big.ms;
  const t = now % (sweep + a.big.holdMs);
  return Math.min(a.big.n - 1, Math.floor(t / a.big.ms));
}
function preloadRarityArt() {
  const files = { sm: "15x20", md: "110x147", lg: "440x588" };
  const jobs = [];
  for (const tier of ["rare", "ultra"]) {
    const base = "art/cards/rarity/" + tier + "/";
    const T = RARITY_ART[tier];
    for (const [key, file] of Object.entries(files)) {
      jobs.push(loadImg(base + "frame_" + file + ".png").then(im => { T.frame[key] = im; }));
      const a = RARITY_ANIM[tier];
      const n = key === "sm" ? a.sm.n : a.big.n;
      for (let i = 0; i < n; i++) {
        const nn = String(i).padStart(2, "0");
        jobs.push(loadImg(base + "anim_" + file + "_" + nn + ".png").then(im => { T.anim[key][i] = im; }));
      }
      if (tier === "ultra" && key !== "sm") {
        jobs.push(loadImg(base + "holo_" + file + ".png").then(im => { T.holo[key] = im; }));
      }
    }
  }
  return Promise.all(jobs);
}
function imgOk(im) { return !!(im && im.complete && im.naturalWidth > 0); }

const FRONT_FILES = { sm: "15x20", md: "110x147", lg: "440x588" };
const frontImgs = {}; // id -> { sm, md, lg } (Image | "loading" | null)
function requestFront(babe, key) {
  const slotObj = frontImgs[babe.id] || (frontImgs[babe.id] = {});
  if (slotObj[key] === undefined) {

  }
  const im = slotObj[key];
  return imgOk(im) ? im : null;
}
function preloadFronts() {

/** Draw a v3 front as-is (no extra frame). Returns false if not loaded yet. */
function drawFrontCard(babe, x, y, w, h, sizeKey) {
  // Painted fronts: never upscale the 110 — anything wider than 110px uses the 440
  if (sizeKey !== "sm") sizeKey = Math.floor(w) <= 110 ? "md" : "lg";
  let im = requestFront(babe, sizeKey);
  if (!im && sizeKey === "lg") im = requestFront(babe, "md"); // while 440 streams in
  if (!im) return false;
  // 15x20 face crop: nearest-neighbour; bigger: smooth only when downscaling
  const smooth = sizeKey !== "sm" && Math.floor(w) < im.naturalWidth;
  return drawCardBitmap(im, x, y, w, h, smooth);

async function preloadCardArt() {
  const sizes = [
    ["sm", "15x20"],

/** Procedural placeholder art (gradient + silhouette) — the "front" until real art. */
function drawPlaceholderArt(char, x, y, w, h, iconOnly) {
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, `hsl(${char.hue}, 70%, 55%)`);
  g.addColorStop(0.55, `hsl(${char.hue + 20}, 65%, 35%)`);
  g.addColorStop(1, `hsl(${char.hue}, 50%, 18%)`);
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);

/**
 * Rare / Ultra card: Iris frame assets, closest size, uniform 3:4 scale.
 * Returns false if the assets aren't loaded yet (caller falls back).
 */
function drawRarityFramedCard(char, x, y, w, h, opts, sizeKey) {
  const tier = char.rarity;
  const A = RARITY_ART[tier];
  if (!A) return false;
  const anim = A.anim[sizeKey][rarityAnimFrame(tier, sizeKey)];
  const frame = A.frame[sizeKey];
  if (!imgOk(frame)) return false;
  const ix = Math.floor(x), iy = Math.floor(y);
  const iw = Math.max(1, Math.floor(w)), ih = Math.max(1, Math.floor(h));
  const iconOnly = !!opts.iconOnly;

  if (sizeKey === "sm") {
    // 15x20: face, then animated frame (frame 00 = static frame). Nearest-neighbour.
    const px = iw / 15;
    ctx.save();
    drawPlaceholderArt(char, ix + px, iy + px, iw - 2 * px, ih - 2 * px);
    drawSilhouette(ix + iw / 2, iy + ih * 0.5, Math.min(iw, ih) * 0.6, char.shape, "rgba(255,255,255,0.92)");
    ctx.restore();
    drawCardBitmap(imgOk(anim) ? anim : frame, ix, iy, iw, ih, false);
    return true;
  }

  // 110 / 440: smooth only when downscaling
  const smooth = iw < frame.naturalWidth;
  const u = iw / 110; // canvas px per frame unit (110-wide basis)
  // 1) art fitted to the art window (inset 4 units)
  ctx.save();
  ctx.beginPath();
  ctx.rect(ix + 4 * u, iy + 4 * u, iw - 8 * u, ih - 8 * u);
  ctx.clip();
  drawPlaceholderArt(char, ix, iy, iw, ih);
  drawSilhouette(ix + iw / 2, iy + ih * 0.42, Math.min(iw, ih) * 0.55, char.shape, "rgba(255,255,255,0.92)");
  ctx.restore();
  // 2) ultra holo (over art, under frame)
  if (tier === "ultra" && imgOk(A.holo[sizeKey])) drawCardBitmap(A.holo[sizeKey], ix, iy, iw, ih, smooth);
  // 3) frame
  drawCardBitmap(frame, ix, iy, iw, ih, smooth);
  // 4) name in banner (banner rows ≈124–140 of 147 units)
  if (!iconOnly) {
    const fs = Math.max(7, Math.round(10 * u));
    const by = iy + ih * (135.5 / 147);
    ctx.save();
    ctx.font = `bold ${fs}px sans-serif`;
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(20,10,30,0.9)";
    ctx.fillText(char.name, ix + iw / 2 + Math.max(1, u), by + Math.max(1, u));
    ctx.fillStyle = "#fff";
    ctx.fillText(char.name, ix + iw / 2, by);
    ctx.restore();
  }
  // 5) animated overlay on top
  if (imgOk(anim)) drawCardBitmap(anim, ix, iy, iw, ih, smooth);
  return true;
}

function drawCard(char, x, y, w, h, opts) {
  opts = opts || {};
  // Uniform scale only — height always derived from width via CARD_ASPECT
  w = +w;
  h = cardHeight(w);
  const rar = rarityOf(char.id);
  const locked = !!opts.locked;
  const glow = opts.glow || 0;
  const iconOnly = !!opts.iconOnly;
  const sizeKey = pickCardSizeKey(w);
  // Smooth only when downscaling large (440) art into big UI views
  const useSmooth = sizeKey === "lg";

  if (glow > 0) {
    ctx.save();
    ctx.shadowColor = rar.color;
    ctx.shadowBlur = 18 * glow;
    roundRect(x, y, w, h, 8);
    ctx.fillStyle = rar.color;
    ctx.fill();
    ctx.restore();
  }

  // Locked / missing: regular cardback (Iris) instead of grey ??? silhouette
  if (locked) {
    const back = cardImgs.normal[sizeKey];
    if (drawCardBitmap(back, x, y, w, h, useSmooth)) {
      // light frame
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 2;
      roundRect(x + 1, y + 1, w - 2, h - 2, 6);
      ctx.stroke();
    } else {
      // procedural fallback
      const g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, "#2a2a32");
      g.addColorStop(1, "#1a1a22");
      roundRect(x, y, w, h, 8);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 3;
      roundRect(x + 1.5, y + 1.5, w - 3, h - 3, 7);
      ctx.stroke();
      drawSilhouette(x + w / 2, y + h * (iconOnly ? 0.52 : 0.42), Math.min(w, h) * 0.55, char.shape, "#3a3a44");
    }
    if (!iconOnly) {
      ctx.textAlign = "center";
      ctx.font = `bold ${Math.max(10, Math.floor(w * 0.12))}px sans-serif`;
      ctx.fillStyle = "#666";
      ctx.fillText("???", x + w / 2, y + h - 12);
    }
    return;
  }

  // Owned real girl: v3 front as-is (frame + name banner baked in)
  if (char.front && drawFrontCard(char, x, y, w, h, sizeKey)) {
    drawCardBadges(char, x, y, w, h, opts, iconOnly);
    return;
  }

  // Owned Rare / Ultra: Iris rarity frames (Common keeps the look below)
  if ((char.rarity === "rare" || char.rarity === "ultra") &&
      drawRarityFramedCard(char, x, y, w, h, opts, sizeKey)) {
    drawCardBadges(char, x, y, w, h, opts, iconOnly);
    return;
  }

  // Owned: procedural placeholder (Iris fronts deferred)
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, `hsl(${char.hue}, 70%, 55%)`);
  g.addColorStop(0.55, `hsl(${char.hue + 20}, 65%, 35%)`);
  g.addColorStop(1, `hsl(${char.hue}, 50%, 18%)`);
  roundRect(x, y, w, h, 8);
  ctx.fillStyle = g;
  ctx.fill();
  // Base border (common; also rare/ultra fallback while frames load)
  ctx.strokeStyle = rar.color;
  ctx.lineWidth = 3;
  roundRect(x + 1.5, y + 1.5, w - 3, h - 3, 7);
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1;
  if (iconOnly) roundRect(x + 3, y + 3, w - 6, h - 6, 4);
  else roundRect(x + 8, y + 8, w - 16, h - 28, 4);
  ctx.stroke();
  drawSilhouette(
    x + w / 2,
    y + h * (iconOnly ? 0.52 : 0.42),
    Math.min(w, h) * (iconOnly ? 0.62 : 0.55),
    char.shape,
    "rgba(255,255,255,0.92)"
  );

  if (!iconOnly) {
    ctx.textAlign = "center";
    ctx.font = `bold ${Math.max(10, Math.floor(w * 0.12))}px sans-serif`;
    ctx.fillStyle = "#fff";
    ctx.fillText(char.name, x + w / 2, y + h - 12);
    if (opts.showRarity !== false) {
      ctx.font = `${Math.max(8, Math.floor(w * 0.08))}px sans-serif`;
      ctx.fillStyle = rar.color;
      ctx.fillText(rar.label, x + w / 2, y + 14);
    }
  }

  drawCardBadges(char, x, y, w, h, opts, iconOnly);
}

function drawCardBadges(char, x, y, w, h, opts, iconOnly) {
  // Dupe badge
  if (opts.count != null && opts.count > 1) {
    if (iconOnly) {
      if (w >= 22) {
        const r = Math.max(5, Math.min(7, w * 0.22));
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.beginPath();
        ctx.arc(x + w - r - 2, y + r + 2, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffe66d";
        ctx.font = "bold " + Math.max(7, Math.floor(r * 1.35)) + "px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(opts.count), x + w - r - 2, y + r + 2.5);
        ctx.textBaseline = "alphabetic";
      }
    } else {
      const bw = Math.max(16, Math.min(22, w * 0.35));
      const bh = Math.max(12, Math.min(16, h * 0.14));
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      roundRect(x + w - bw - 4, y + 4, bw, bh, 3);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold " + Math.max(8, Math.floor(bh * 0.75)) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("x" + opts.count, x + w - bw / 2 - 4, y + 4 + bh * 0.78);
    }
  } else if (!iconOnly && opts.count != null && opts.count > 0) {
    const bw = Math.max(16, Math.min(22, w * 0.35));
    const bh = Math.max(12, Math.min(16, h * 0.14));
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(x + w - bw - 4, y + 4, bw, bh, 3);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold " + Math.max(8, Math.floor(bh * 0.75)) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("x" + opts.count, x + w - bw / 2 - 4, y + 4 + bh * 0.78);
  }
}

function resetLevel(full) {

  enemies = makeEnemies();

  loseAnim = null;

function solidAt(px, py, pw, ph) {
  // AABB vs platform rects
  for (const p of platforms) {
    const x = p.x*TILE, y = p.y*TILE, w = p.w*TILE, h = p.h*TILE;
    if (px < x+w && px+pw > x && py < y+h && py+ph > y) return {x,y,w,h};
  }
  return null;
}

function resolvePlayer(dt) {
  // horizontal
  player.x += player.vx * dt;
  let hit = solidAt(player.x, player.y, player.w, player.h);
  if (hit) {
    if (player.vx > 0) player.x = hit.x - player.w;
    else if (player.vx < 0) player.x = hit.x + hit.w;
    player.vx = 0;
  }
  // vertical
  player.y += player.vy * dt;
  player.onGround = false;
  hit = solidAt(player.x, player.y, player.w, player.h);
  if (hit) {
    if (player.vy > 0) {
      player.y = hit.y - player.h;
      player.vy = 0;
      player.onGround = true;
    } else if (player.vy < 0) {
      player.y = hit.y + hit.h;
      player.vy = 0;
    }
  }
  // world bounds
  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > LEVEL_W * TILE) { player.x = LEVEL_W*TILE - player.w; player.vx = 0; }
}

function groundUnder(px, feetY) {
  // Thin probe just below feet — true if a platform would catch a landing
  return !!solidAt(px, feetY, player.w, 6);
}

/** Platform top near feet supporting [x,x+w]; prefers the highest (smallest Y) match. */
function platformTopNear(x, w, feetY) {
  let best = null;
  for (const p of platforms) {
    const px = p.x * TILE, py = p.y * TILE, pw = p.w * TILE;
    const overlap = Math.min(x + w, px + pw) - Math.max(x, px);
    if (overlap < 6) continue;
    if (py >= feetY - 4 && py <= feetY + 48) {
      if (best == null || py < best) best = py;
    }
  }
  if (best == null) {
    for (const p of platforms) {
      const px = p.x * TILE, py = p.y * TILE, pw = p.w * TILE;
      const overlap = Math.min(x + w, px + pw) - Math.max(x, px);
      if (overlap < 6) continue;
      if (Math.abs(py - feetY) <= 8) {
        if (best == null || py < best) best = py;
      }
    }
  }
  return best;
}

function hurtPlayer(fromX) {
  if (invuln > 0 || player.stompGrace > 0 || state !== "play") return;
  hearts--;
  invuln = 1.4;
  player.flash = 1.4;
  // Bounce away from the enemy: horizontal knockback + small upward pop
  let dir = (player.x + player.w / 2 < fromX) ? -1 : 1;
  const feet = player.y + player.h;
  const probe = 56; // ~1.75 tiles ahead
  const awayHasGround = groundUnder(player.x + dir * probe, feet) ||
    groundUnder(player.x + dir * probe, feet + TILE);
  const towardHasGround = groundUnder(player.x - dir * probe, feet) ||
    groundUnder(player.x - dir * probe, feet + TILE);
  // Avoid knocking the player straight into a pit (unfair death loop near edges)
  let kb = 290;
  if (!awayHasGround) {
    if (towardHasGround) dir = -dir;
    else { dir = 0; kb = 0; } // pit both ways — just pop up in place
  }
  player.vx = dir * kb;
  player.vy = -280;
  player.onGround = false;
  player.stun = 0.25; // brief loss of control so knockback reads
  player.jumpBuf = 0;
  sfx.hit();
  spawnParticles(player.x + player.w/2, player.y + player.h/2, "#ff4466", 10);
  if (hearts <= 0) {
    onHeartsZero();
  }
}

function seatPlayerForDeathCry() {
  player.vx = 0;
  player.vy = 0;
  player.stun = 0;
  player.flash = 0;
  player.jumpBuf = 0;
  player.fromStomp = false;
  // Snap onto solid ground underfoot so the cry reads clearly (pit path already parked at checkpoint)
  const top = platformTopNear(player.x, player.w, player.y + player.h);
  if (top != null) {
    player.y = top - player.h;
    player.onGround = true;
  }
  // Keep camera locked on him
  cameraX = Math.max(0, Math.min(player.x - W * 0.38, LEVEL_W * TILE - W));
}

function onHeartsZero() {
  // Single clean event — ignore re-entry while already dying or on Ouch screen
  if (state === "dying" || state === "dead") return;
  // Lose one random *already owned* babe now (pending unrevealed roll is not owned yet).
  const owned = Object.keys(collection).filter(k => collection[k] > 0);
  let lostName = null;
  let lostId = null;
  let lostPrevCount = 0;
  if (owned.length) {
    const id = owned[Math.floor(Math.random() * owned.length)];
    lostPrevCount = collection[id];
    collection[id]--;
    if (collection[id] <= 0) delete collection[id];
    saveCollection(collection);
    const ch = CHAR_DEFS.find(c => c.id === id);
    lostName = ch ? ch.name : id;
    lostId = id;
    sfx.lose();
  }
  seatPlayerForDeathCry();
  // ~1.5s black-screen zoomed cry before Ouch; enemies frozen, no input, no re-hit
  deathCry = {
    t: 0, dur: 1.5, lostName, lostId, lostPrevCount,
    animT: 0, animStarted: false, cryStarted: false,
  };
  loseAnim = null;
  invuln = 99; // belt-and-suspenders vs any stray collision
  if (lostId) focusHudOnBabe(lostId);
  deathGridScroll = -1;
  state = "dying";
}

function beginOuchScreen() {
  stopDeathCry();
  if (!deathCry) {
    state = "dead";
    loseAnim = { t: 0, name: null, lostId: null, lostPrevCount: 0, dur: 2.2 };
    return;
  }
  loseAnim = {
    t: 0,
    name: deathCry.lostName,
    lostId: deathCry.lostId,
    lostPrevCount: deathCry.lostPrevCount,
    dur: 2.2,
  };
  deathCry = null;
  state = "dead";
}

function updateDying(dt) {
  if (!deathCry) { beginOuchScreen(); return; }
  deathCry.t += dt;
  player.vx = 0;
  player.vy = 0;
  // Start cry audio + dead-anim frame 0 exactly when black cry screen begins (after white flash hold)
  if (!deathCry.cryStarted && deathCry.t >= DEATH_FLASH_HOLD) {
    deathCry.cryStarted = true;
    deathCry.animStarted = true;
    deathCry.animT = 0;
    playDeathCry();
  }
  if (deathCry.animStarted) deathCry.animT += dt;
  maybeStartCryLoop(); // only if somehow past 1.5s
  // Enemies frozen (no update) — cannot re-hit
  if (deathCry.t >= deathCry.dur) beginOuchScreen();
}

/** Full-screen black + zoomed cry loop (integer scale, crisp). */
function drawDyingCry() {
  const t = deathCry ? deathCry.t : 0;
  // Phase 1: solid white flash (covers everything)
  if (t < DEATH_FLASH_HOLD) {
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, W, H);
    return;
  }
  // Phase 2+: black + cry, with optional white fade overlay
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  const fr = heroFrameForState();
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  const dw = HERO_SW * DEATH_CRY_SCALE;
  const dh = HERO_SH * DEATH_CRY_SCALE;
  const dx = Math.floor((W - dw) / 2);
  const dy = Math.floor((H - dh) / 2);
  if (fr.img) {
    ctx.drawImage(fr.img, fr.sx, fr.sy, fr.sw, fr.sh, dx, dy, dw, dh);
  } else {
    ctx.fillStyle = "#6ec8ff";
    ctx.fillRect(dx + dw * 0.25, dy + dh * 0.2, dw * 0.5, dh * 0.7);
  }
  ctx.restore();
  // White fade into black cry (~0.1s); folded into the same 1.5s window
  const fadeT = t - DEATH_FLASH_HOLD;
  if (fadeT < DEATH_FLASH_FADE) {
    ctx.fillStyle = "#fff";
    ctx.globalAlpha = 1 - fadeT / DEATH_FLASH_FADE;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*220,
      vy: (Math.random()-0.8)*260,
      life: 0.4 + Math.random()*0.5,
      color, size: 2 + Math.random()*3
    });
  }
}

// Post-roll callout ("NEW! <name> · Common", "★ RARE DUPE x2 — <name>", …)
// Pop in, hold at full opacity, then fade smoothly to 0.
const CALLOUT_IN = 0.2;    // pop-in (unchanged)
const CALLOUT_HOLD = 1.4;  // full opacity: old ~0.4s visible time + 1.0s
const CALLOUT_OUT = 0.45;  // smooth fade-out
const CALLOUT_H = 36, CALLOUT_GAP = 6;
// Callouts sit where the roll panel was; if a (queued) roll is on screen they
// slide just below the panel so the next roll never hides them.
function calloutBaseY() {
  return slot ? SLOT_PANEL_Y + SLOT_PANEL_H + 8 : 56;
}
function addCallout(text, color) {
  callouts.push({ text, color, t: 0, dur: CALLOUT_IN + CALLOUT_HOLD + CALLOUT_OUT, y: null });
}
function calloutAlpha(c) {
  if (c.t < CALLOUT_IN) return c.t / CALLOUT_IN;
  const fadeStart = CALLOUT_IN + CALLOUT_HOLD;
  if (c.t <= fadeStart) return 1;
  const u = Math.min(1, (c.t - fadeStart) / CALLOUT_OUT);
  return 1 - u * u * (3 - 2 * u); // smoothstep 1 → 0
}

function beginSlotRoll() {
  // Precompute result and plant it at targetIndex BEFORE spinning.
  // Offset eases exactly to that index — no end snap/swap.
  const result = rollCharacter();
  const targetIndex = 24;
  const strip = [];
  for (let i = 0; i < targetIndex; i++) {
    let pick;
    do {
      pick = CHAR_DEFS[Math.floor(Math.random() * CHAR_DEFS.length)];
    } while (i > targetIndex - 4 && pick.id === result.id); // keep approach cards visually distinct
    strip.push(pick);
  }
  strip.push(result);
  for (let i = 0; i < 4; i++) {
    strip.push(CHAR_DEFS[Math.floor(Math.random() * CHAR_DEFS.length)]);
  }
  slot = {
    strip,
    result,
    targetIndex,
    startOffset: 0,
    offset: 0,
    elapsed: 0,
    duration: 1.2,
    done: false,
    revealT: 0,
  };
  sfx.coin();
}

// Coin pickup: start a roll, or queue if one is already playing. Gameplay never pauses.
function onCoinCollected() {
  if (slot) {
    slotQueue++;
    sfx.coin();
  } else {
    beginSlotRoll();
  }
}

function finishSlot() {
  if (!slot) return;
  const id = slot.result.id;
  const prev = collection[id] || 0;
  collection[id] = prev + 1;
  saveCollection(collection);
  runGained.push(id);
  focusHudOnBabe(id);
  const rar = rarityOf(id);
  const nm = slot.result.name;
  if (prev === 0) {
    if (rar.id === "ultra") {
      addCallout("✦ ULTRA RARE! NEW! " + nm, "#ffd24a");
      spawnParticles(W / 2, 120, "#ffd24a", 24);
      spawnParticles(W / 2, 120, "#ff7ab8", 12);
    } else if (rar.id === "rare") {
      addCallout("★ RARE! NEW! " + nm, "#7ec8ff");
      spawnParticles(W / 2, 120, "#7ec8ff", 14);
    } else {
      addCallout("NEW! " + nm + " · Common", "#ffe66d");
    }
    sfx.new();
  } else {
    if (rar.id === "ultra") addCallout("✦ ULTRA RARE DUPE x" + (prev + 1) + " — " + nm, "#ffd24a");
    else if (rar.id === "rare") addCallout("★ RARE DUPE x" + (prev + 1) + " — " + nm, "#9ad0ff");
    else addCallout("DUPE x" + (prev + 1) + " — " + nm + " · Common", "#9ad0ff");
  }
  slot = null;
  // Chain queued rolls immediately (even over death/win overlays — player earned them)
  if (slotQueue > 0) {
    slotQueue--;
    beginSlotRoll();
  }
}

// ---------- Update ----------
function updatePlay(dt) {
  if (player.stun > 0) player.stun -= dt;
  if (player.stompGrace > 0) player.stompGrace -= dt;

  // movement (disabled briefly while stunned so knockback reads)
  if (player.stun <= 0) {
    let move = 0;
    if (keys["arrowleft"] || keys["a"]) move -= 1;
    if (keys["arrowright"] || keys["d"]) move += 1;
    if (move !== 0) {
      player.vx += move * MOVE_ACC * dt;
      player.facing = move;
    } else {
      const fr = FRICTION * dt;
      if (Math.abs(player.vx) <= fr) player.vx = 0;
      else player.vx -= Math.sign(player.vx) * fr;
    }
    player.vx = Math.max(-MOVE_MAX, Math.min(MOVE_MAX, player.vx));

    // jump buffer / coyote
    if (justPressed[" "] || justPressed["arrowup"] || justPressed["w"]) {
      player.jumpBuf = JUMP_BUF;
    }
    if (player.onGround) player.coyote = COYOTE;
    else player.coyote -= dt;
    player.jumpBuf -= dt;

    if (player.jumpBuf > 0 && player.coyote > 0) {
      player.vy = JUMP_V;
      player.onGround = false;
      player.coyote = 0;
      player.jumpBuf = 0;
      sfx.jump();
    }
    // variable jump height — never cut an active stomp bounce until apex
    const jumpHeld = keys[" "] || keys["arrowup"] || keys["w"];
    if (player.fromStomp && player.vy >= 0) player.fromStomp = false;
    if (!jumpHeld && player.vy < 0 && !player.fromStomp) {
      player.vy *= JUMP_CUT;
    }
  } else {
    // Stunned: light air drag only; do not clamp to MOVE_MAX (preserves knockback)
    player.jumpBuf = 0;
    player.coyote = 0;
    player.vx *= (1 - Math.min(1, 1.2 * dt));
  }

  player.vy += GRAV * dt;
  if (player.vy > 900) player.vy = 900;
  resolvePlayer(dt);

  // Pit / cliff: one deliberate full wipe — all hearts gone, lose one card, then checkpoint respawn.
  // Guarded by state !== "play" inside onHeartsZero path (state flips to "dead" immediately) so no multi-trigger.
  if (player.y > (LEVEL_H + 2) * TILE) {
    hearts = 0;
    player.vx = 0;
    player.vy = 0;
    // Park at checkpoint immediately so we are not still "in the pit" next frame
    const cp = checkpoints[checkpointIdx];
    player.x = cp.x;
    player.y = cp.y - player.h;
    sfx.hit();
    onHeartsZero();
    return;
  }

  // checkpoints
  for (let i = checkpointIdx + 1; i < checkpoints.length; i++) {
    if (player.x + player.w/2 >= checkpoints[i].x) checkpointIdx = i;
  }

  // coins (bob + collect; multiple hits while rolling are queued)
  for (const c of coins) {
    if (c.collected) continue;
    c.bob += dt * 3;
    if (aabb(player, c)) {
      c.collected = true;
      spawnParticles(c.x + 8, c.y + 10, "#ffd24a", 8);
      onCoinCollected();
    }
  }

  // enemies — gravity + ledge turns (never float mid-air)
  for (const e of enemies) {
    if (!e.alive) continue;
    e.prevX = e.x;
    e.prevY = e.y;

    if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
    if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }

    const feetY = e.y + e.h;
    const aheadX = e.dir > 0 ? e.x + e.w - 2 : e.x - 4;
    const aheadTop = platformTopNear(aheadX, 6, feetY);
    if (aheadTop == null || Math.abs(aheadTop - feetY) > 10) e.dir *= -1;

    e.x += e.vx * e.dir * dt;
    if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
    if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }

    e.vy = (e.vy || 0) + GRAV * dt * (e.type === "hopper" ? 0.85 : 1);
    e.y += e.vy * dt;

    const top = platformTopNear(e.x, e.w, e.y + e.h);
    const onGround = top != null && (e.y + e.h) >= top - 1 && (e.y + e.h) <= top + 18 && e.vy >= 0;
    if (onGround) {
      e.y = top - e.h;
      e.vy = 0;
      if (e.type === "hopper") {
        e.hopT = (e.hopT || 0) + dt;
        if (e.hopT > 1.1) { e.vy = -520; e.hopT = 0; }
      }
    }

    if (!aabb(player, e)) continue;

    // Stomp if player was/is above (prev feet vs prev enemy top), even if enemy jumps up
    const STOMP_TOL = 8;
    const prevPlayerBottom = (player.prevY != null ? player.prevY : player.y) + player.h;
    const prevEnemyTop = e.prevY != null ? e.prevY : e.y;
    const fromAbove = prevPlayerBottom <= prevEnemyTop + STOMP_TOL;
    // Vertical-dominant overlap with player clearly above (hopper jump-into-feet)
    const playerAbove = player.y + player.h <= e.y + e.h * 0.55 && player.y < e.y;
    const stomping = fromAbove || playerAbove;

    if (stomping) {
      e.alive = false;
      player.y = e.y - player.h;
      player.onGround = false;
      const jumpHeld = keys[" "] || keys["arrowup"] || keys["w"];
      player.vy = jumpHeld ? STOMP_V_HELD : STOMP_V;
      player.stompGrace = 0.12;
      player.fromStomp = true;
      player.jumpBuf = 0;
      sfx.stomp();
      spawnParticles(e.x + e.w/2, e.y + e.h/2, e.type === "hopper" ? "#7dff9a" : "#ff8a5b", 12);
    } else {
      hurtPlayer(e.x + e.w/2);
    }
  }

  player.prevY = player.y;
  player.prevX = player.x;

  // goal
  if (aabb(player, goal)) {
    state = "win";
    winStats = {
      unique: ownedUniqueCount(collection),
      total: totalPulls(collection),
      coins: coins.filter(c => c.collected).length,
      coinsMax: coins.length,
      gained: runGained.slice(),
    };
    sfx.win();
  }

  if (invuln > 0) invuln -= dt;
  if (player.flash > 0) player.flash -= dt;
  player.anim += dt * (Math.abs(player.vx) > 20 ? 10 : 4);

  // camera
  const target = player.x - W * 0.38;
  cameraX += (target - cameraX) * Math.min(1, 6 * dt);
  cameraX = Math.max(0, Math.min(cameraX, LEVEL_W * TILE - W));
}

function updateSlot(dt) {
  if (!slot) return;
  if (!slot.done) {
    slot.elapsed += dt;
    const t = Math.min(1, slot.elapsed / slot.duration);
    // Ease-out cubic on POSITION so we land exactly on targetIndex (the pre-planted result)
    const ease = 1 - Math.pow(1 - t, 3);
    const prev = Math.floor(slot.offset + 1e-9);
    slot.offset = slot.startOffset + (slot.targetIndex - slot.startOffset) * ease;
    if (Math.floor(slot.offset + 1e-9) !== prev) sfx.tick();
    if (t >= 1) {
      slot.offset = slot.targetIndex;
      slot.done = true;
      slot.revealT = 0;
    }
  } else {
    slot.revealT += dt;
    if (slot.revealT > 0.275) finishSlot(); // half of previous 0.55s reveal hold
  }
}

function updateDead(dt) {
  if (!loseAnim) { state = "play"; resetAfterDeath(); return; }
  loseAnim.t += dt;
  if (loseAnim.t >= loseAnim.dur) {
    loseAnim = null;
    resetAfterDeath();
    state = "play";
  }
}

function resetAfterDeath() {
  hearts = 3;
  invuln = 1.5;
  deathCry = null;
  stopDeathCry();
  const cp = checkpoints[checkpointIdx];
  player.x = cp.x; player.y = cp.y - player.h;
  player.vx = 0; player.vy = 0;
  player.stun = 0;
  player.stompGrace = 0;
  player.fromStomp = false;
  player.prevX = player.x; player.prevY = player.y;
  // Respawn coins AND enemies at original positions/state (same as level start)
  coins = makeCoins();
  enemies = makeEnemies();
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 600*dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = callouts.length - 1; i >= 0; i--) {
    callouts[i].t += dt;
    if (callouts[i].t >= callouts[i].dur) callouts.splice(i, 1);
  }
  // Layout: newest on top, older ones stacked beneath; ease toward target slot
  const baseY = calloutBaseY();
  for (let i = callouts.length - 1, k = 0; i >= 0; i--, k++) {
    const c = callouts[i];
    const ty = baseY + k * (CALLOUT_H + CALLOUT_GAP);
    c.y = c.y == null ? ty : c.y + (ty - c.y) * Math.min(1, 12 * dt);
  }
}

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------- Draw ----------
function drawBackground() {
  // sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#1b0f2e");
  g.addColorStop(0.5, "#3a1a4a");
  g.addColorStop(1, "#6b2d5c");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // parallax hills
  ctx.fillStyle = "#2a1538";
  for (let i = 0; i < 8; i++) {
    const hx = ((i * 280) - cameraX * 0.2) % (W + 300) - 80;
    ctx.beginPath();
    ctx.ellipse(hx + 120, H - 40, 160, 70, 0, 0, Math.PI*2);
    ctx.fill();
  }
  // stars
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  for (let i = 0; i < 40; i++) {
    const sx = ((i * 97) * 13 - cameraX * 0.05) % W;
    const sy = (i * 37) % (H * 0.55);
    ctx.fillRect(sx, sy, 2, 2);
  }
}

function drawWorld() {
  ctx.save();
  ctx.translate(-Math.floor(cameraX), 0);

  // platforms
  for (const p of platforms) {
    const x = p.x*TILE, y = p.y*TILE, w = p.w*TILE, h = p.h*TILE;
    // dirt body
    ctx.fillStyle = "#5c3a28";
    ctx.fillRect(x, y, w, h);
    // grass top
    ctx.fillStyle = "#4ec96a";
    ctx.fillRect(x, y, w, 8);
    // pixel edge
    ctx.fillStyle = "#3a8f4c";
    for (let i = 0; i < w; i += 8) ctx.fillRect(x + i, y + 8, 6, 3);
    // bricks hint on tall
    if (h > TILE) {
      ctx.fillStyle = "rgba(0,0,0,0.15)";
      for (let ty = y + TILE; ty < y + h; ty += TILE) {
        ctx.fillRect(x, ty, w, 2);
        for (let tx = x; tx < x + w; tx += TILE) ctx.fillRect(tx, ty, 2, TILE);
      }
    }
  }

  // checkpoints flags
  for (let i = 0; i < checkpoints.length; i++) {
    const c = checkpoints[i];
    const active = i <= checkpointIdx;
    ctx.fillStyle = "#ddd";
    ctx.fillRect(c.x, c.y - 48, 4, 48);
    ctx.fillStyle = active ? "#ff5a9a" : "#888";
    ctx.beginPath();
    ctx.moveTo(c.x + 4, c.y - 48);
    ctx.lineTo(c.x + 28, c.y - 36);
    ctx.lineTo(c.x + 4, c.y - 24);
    ctx.fill();
  }

  // coins — mystery cardback (Iris A5), bob + sparkle
  for (const c of coins) {
    if (c.collected) continue;
    const by = c.y + Math.sin(c.bob) * 4;
    const cx = Math.floor(c.x), cy = Math.floor(by);
    const cw = Math.floor(c.w), ch = Math.floor(c.h);
    const back = cardImgs.mystery.sm || cardImgs.mystery.md;
    if (!drawCardBitmap(back, cx, cy, cw, ch, false)) {
      const g = ctx.createLinearGradient(cx, cy, cx, cy + ch);
      g.addColorStop(0, "#6b3a8a");
      g.addColorStop(1, "#2a1040");
      roundRect(cx, cy, cw, ch, 3);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.fillStyle = "#ffd24a";
      ctx.font = "bold 9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("?", cx + cw / 2, cy + ch / 2 + 3);
    }
    // sparkle
    const sp = (Math.sin(c.bob * 2) + 1) * 0.5;
    ctx.globalAlpha = 0.35 + sp * 0.55;
    ctx.fillStyle = "#fff";
    ctx.fillRect(cx + cw - 4, cy + 2, 2, 2);
    ctx.fillRect(cx + 2, cy + ch * 0.4, 2, 2);
    ctx.globalAlpha = 1;
  }

  // enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.type === "walker") {
      ctx.fillStyle = "#e85d4c";
      roundRect(e.x, e.y, e.w, e.h, 4);
      ctx.fill();
      // eyes
      ctx.fillStyle = "#fff";
      ctx.fillRect(e.x + 6 + (e.dir>0?8:0), e.y + 8, 6, 6);
      ctx.fillRect(e.x + 16 + (e.dir>0?8:0), e.y + 8, 6, 6);
      ctx.fillStyle = "#111";
      ctx.fillRect(e.x + 8 + (e.dir>0?8:0), e.y + 10, 3, 3);
      ctx.fillRect(e.x + 18 + (e.dir>0?8:0), e.y + 10, 3, 3);
      // feet
      ctx.fillStyle = "#a03028";
      ctx.fillRect(e.x + 2, e.y + e.h - 4, 8, 4);
      ctx.fillRect(e.x + e.w - 10, e.y + e.h - 4, 8, 4);
    } else {
      // hopper — green blob with spring
      ctx.fillStyle = "#5dcf6a";
      ctx.beginPath();
      ctx.ellipse(e.x + e.w/2, e.y + e.h/2, e.w/2, e.h/2 * (e.vy < -50 ? 1.15 : 0.9), 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(e.x + 8, e.y + 10, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x + 18, e.y + 10, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#111";
      ctx.fillRect(e.x + 8, e.y + 10, 3, 3);
      ctx.fillRect(e.x + 18, e.y + 10, 3, 3);
    }
  }

  // goal flag
  ctx.fillStyle = "#eee";
  ctx.fillRect(goal.x, goal.y, 5, goal.h);
  ctx.fillStyle = "#ffd24a";
  ctx.beginPath();
  ctx.moveTo(goal.x + 5, goal.y);
  ctx.lineTo(goal.x + 40, goal.y + 16);
  ctx.lineTo(goal.x + 5, goal.y + 32);
  ctx.fill();
  ctx.fillStyle = "#ff5a9a";
  ctx.beginPath();
  ctx.arc(goal.x + 2, goal.y, 6, 0, Math.PI*2);
  ctx.fill();

  // player (pixel hero or fallback shapes)
  drawPlayer();

  // particles in world space
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}


function drawHudLiveBabes() {
  if (state !== "play" && state !== "dead" && state !== "dying") return;

  const list = sortedBabeList();
  const cw = HUD_CW, ch = cardHeight(cw), gap = HUD_GAP;
  const pad = 8, counterH = 16;
  const panelW = pad * 2 + HUD_SLOTS * cw + (HUD_SLOTS - 1) * gap;
  const panelH = pad + counterH + ch + pad;
  const margin = 10;
  // Touch: lift tray above on-screen jump; portrait needs less canvas-space lift (letterbox absorbs chrome)
  const portrait = window.innerHeight > window.innerWidth;
  const lift = isTouch ? (portrait ? 78 : 130) : 18;
  const panelX = W - panelW - margin;
  const panelY = H - panelH - lift;
  const step = cw + gap;
  const maxScroll = Math.max(0, (list.length - HUD_SLOTS) * step);
  hudTray.scroll = Math.max(0, Math.min(maxScroll, hudTray.scroll));
  hudTray.targetScroll = Math.max(0, Math.min(maxScroll, hudTray.targetScroll));

  ctx.save();
  ctx.globalAlpha = 0.78;
  ctx.fillStyle = "rgba(12,8,22,0.78)";
  roundRect(panelX, panelY, panelW, panelH, 8);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,90,154,0.45)";
  ctx.lineWidth = 1.5;
  roundRect(panelX, panelY, panelW, panelH, 8);
  ctx.stroke();

  const unique = ownedUniqueCount(collection);
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = "#ffb0d0";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Babes " + unique + "/" + BABE_POOL.length, panelX + pad, panelY + 13);

  const viewX = panelX + pad;
  const viewY = panelY + pad + counterH;
  const viewW = HUD_SLOTS * cw + (HUD_SLOTS - 1) * gap;
  ctx.save();
  ctx.beginPath();
  ctx.rect(viewX - 1, viewY - 1, viewW + 2, ch + 2);
  ctx.clip();

  const startIdx = Math.floor(hudTray.scroll / step);
  const frac = hudTray.scroll - startIdx * step;
  for (let i = 0; i <= HUD_SLOTS; i++) {
    const idx = startIdx + i;
    if (idx < 0 || idx >= list.length) continue;
    const babe = list[idx];
    const x = viewX + i * step - frac;
    const y = viewY;
    const count = collection[babe.id] || 0;
    const isLost = state === "dead" && loseAnim && loseAnim.lostId === babe.id;
    const isHL = hudTray.highlightId === babe.id && hudTray.highlightT > 0;
    ctx.globalAlpha = count > 0 || isLost ? 0.95 : 0.5;
    if (isLost) {
      const displayCount = count > 0 ? count : (loseAnim.lostPrevCount > 1 ? loseAnim.lostPrevCount - 1 : null);
      drawCard(babe, x, y, cw, ch, {
        locked: false,
        count: displayCount && displayCount > 1 ? displayCount : null,
        iconOnly: true,
      });
      drawLostBabeX(x, y, cw, ch, loseAnim.t);
    } else {
      drawCard(babe, x, y, cw, ch, {
        locked: count === 0,
        iconOnly: true,
        count: count > 1 ? count : null,
      });
    }
    if (isHL) {
      const pulse = 0.5 + 0.5 * Math.sin((0.55 - hudTray.highlightT) * 20);
      ctx.strokeStyle = `rgba(255,230,109,${0.55 + 0.45 * pulse})`;
      ctx.lineWidth = 2;
      roundRect(x - 1, y - 1, cw + 2, ch + 2, 5);
      ctx.stroke();
    }
  }
  ctx.restore();
  ctx.restore();
}

function drawSlot() {
  // Overlay only — no screen dimming; world keeps rendering underneath
  // Panel height is 70% of the original 150px; cards scale uniformly (3:4)
  const panelY = SLOT_PANEL_Y;
  const panelH = SLOT_PANEL_H; // 105
  const scale = 0.7;
  ctx.fillStyle = "rgba(20,10,30,0.92)";
  roundRect(40, panelY, W - 80, panelH, 12);
  ctx.fill();
  ctx.strokeStyle = "#ff5a9a";
  ctx.lineWidth = 2.5;
  roundRect(40, panelY, W - 80, panelH, 12);
  ctx.stroke();

  ctx.fillStyle = "#ffb0d0";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(slot.done ? "★ YOU GOT ★" : "✦ ROLLING… ✦", W/2, panelY + 18);

  if (slotQueue > 0) {
    ctx.fillStyle = "#ffe66d";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("Queue +" + slotQueue, W - 56, panelY + 18);
  }

  // card window — width derived from height via CARD_ASPECT
  const cw = 72 * scale;           // 50.4
  const ch = cardHeight(cw);       // exact 3:4
  const gap = 14 * scale;
  const centerX = W/2;
  const cy = panelY + 26;
  const viewW = cw * 5 + gap * 4;
  const vx = centerX - viewW/2;

  ctx.save();
  ctx.beginPath();
  ctx.rect(vx - 3, cy - 3, viewW + 6, ch + 6);
  ctx.clip();

  const base = slot.offset;
  for (let i = -3; i <= 3; i++) {
    const idx = Math.floor(base) + i;
    if (idx < 0 || idx >= slot.strip.length) continue;
    const frac = base - Math.floor(base);
    const cx = centerX + (i - frac) * (cw + gap) - cw/2;
    const char = slot.strip[idx];
    drawCard(char, cx, cy, cw, ch, { glow: slot.done && idx === slot.targetIndex ? 1 : 0 });
  }
  ctx.restore();

  // center highlight frame
  ctx.strokeStyle = "#ffe66d";
  ctx.lineWidth = 2.5;
  roundRect(centerX - cw/2 - 3, cy - 3, cw + 6, ch + 6, 8);
  ctx.stroke();

  if (slot.done) {
    const rar = rarityOf(slot.result.id);
    ctx.fillStyle = rar.color;
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(slot.result.name + " — " + rar.label, W/2, panelY + panelH - 8);
  }
}

function sortedBabeList() {
  return BABE_POOL.slice().sort((a, b) => {
    const rd = rarityRank(a.id) - rarityRank(b.id);
    if (rd !== 0) return rd;
    return a.name.localeCompare(b.name);
  });
}

function focusHudOnBabe(id) {
  if (!id) return;
  const list = sortedBabeList();
  const idx = list.findIndex(b => b.id === id);
  if (idx < 0) return;
  const step = HUD_CW + HUD_GAP;
  let scroll = (idx - Math.floor(HUD_SLOTS / 2)) * step;
  const maxScroll = Math.max(0, (list.length - HUD_SLOTS) * step);
  hudTray.targetScroll = Math.max(0, Math.min(maxScroll, scroll));
  hudTray.highlightId = id;
  hudTray.highlightT = 0.55;
}

function updateHudTray(dt) {
  const d = hudTray.targetScroll - hudTray.scroll;
  hudTray.scroll += d * Math.min(1, 14 * dt);
  if (Math.abs(d) < 0.4) hudTray.scroll = hudTray.targetScroll;
  if (hudTray.highlightT > 0) hudTray.highlightT -= dt;
}

function galleryFilteredList() {
  let list = BABE_POOL.slice();
  const f = gallery.filter;
  if (f === "owned") list = list.filter(b => (collection[b.id] || 0) > 0);
  else if (f === "missing") list = list.filter(b => !(collection[b.id] > 0));
  else if (f === "common" || f === "rare" || f === "ultra") {
    list = list.filter(b => b.rarity === f);
  }
  list.sort((a, b) => {
    const rd = rarityRank(a.id) - rarityRank(b.id);
    if (rd !== 0) return rd;
    return a.name.localeCompare(b.name);
  });
  return list;
}

function handleGalleryClick(sx, sy) {
  // Filter tabs
  const tabY = 56, tabH = 28, tabGap = 6;
  const labels = GALLERY_FILTERS;
  let tx = 40;
  for (const lab of labels) {
    const label = galleryFilterLabel(lab);
    ctx.font = "bold 11px sans-serif";
    const tw = Math.max(54, ctx.measureText(label).width + 16);
    if (sx >= tx && sx <= tx + tw && sy >= tabY && sy <= tabY + tabH) {
      gallery.filter = lab;
      gallery.scroll = 0;
      gallery.selected = null;
      return;
    }
    tx += tw + tabGap;
  }
  // Page buttons
  if (sx >= W - 120 && sx <= W - 70 && sy >= H - 42 && sy <= H - 14) {
    gallery.scroll = Math.max(0, gallery.scroll - 160);
    return;
  }
  if (sx >= W - 60 && sx <= W - 10 && sy >= H - 42 && sy <= H - 14) {
    gallery.scroll += 160;
    return;
  }
  // Detail close
  if (gallery.selected) {
    if (sx >= W / 2 - 40 && sx <= W / 2 + 40 && sy >= H - 50 && sy <= H - 22) {
      gallery.selected = null;
      return;
    }
  }
  // Grid hit
  const list = galleryFilteredList();
  const cols = 5;
  const cw = 100, ch = cardHeight(cw), gapX = 16, gapY = 14;
  const gridW = cols * cw + (cols - 1) * gapX;
  const startX = (W - gridW) / 2;
  const startY = 100 - gallery.scroll;
  for (let i = 0; i < list.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = startX + col * (cw + gapX);
    const y = startY + row * (ch + gapY);
    if (sx >= x && sx <= x + cw && sy >= y && sy <= y + ch) {
      gallery.selected = list[i].id;
      return;
    }
  }
}

function updateGalleryInput() {
  if (justPressed["arrowleft"] || justPressed["a"]) gallery.scroll = Math.max(0, gallery.scroll - 120);
  if (justPressed["arrowright"] || justPressed["d"]) gallery.scroll += 120;
  if (justPressed["arrowup"] || justPressed["w"]) gallery.scroll = Math.max(0, gallery.scroll - 80);
  if (justPressed["arrowdown"] || justPressed["s"]) gallery.scroll += 80;
  if (justPressed["pageup"]) gallery.scroll = Math.max(0, gallery.scroll - 220);
  if (justPressed["pagedown"]) gallery.scroll += 220;
  // number keys 1-7 for filters
  for (let i = 0; i < GALLERY_FILTERS.length; i++) {
    if (justPressed[String(i + 1)]) {
      gallery.filter = GALLERY_FILTERS[i];
      gallery.scroll = 0;
      gallery.selected = null;
    }
  }
  if (justPressed["escape"] && gallery.selected) {
    gallery.selected = null;
    justPressed["escape"] = false; // consume so we don't close gallery
  }
}

// Compact collection strip for death / win overlays
// Bold red X: pen-stroke draw — stroke1 then stroke2, ~0.15s each, no delay, then hold
const LOST_X_STROKE = 0.15;
function drawLostBabeX(x, y, w, h, t) {
  const inset = Math.max(3, w * 0.12);
  const x0 = x + inset, y0 = y + inset;
  const x1 = x + w - inset, y1 = y + h - inset;
  ctx.save();
  ctx.strokeStyle = "#ff2030";
  ctx.lineWidth = Math.max(3, Math.min(8, w * 0.14));
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  // Stroke 1 grows TL → BR
  const a = Math.max(0, Math.min(1, t / LOST_X_STROKE));
  if (a > 0) {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0 + (x1 - x0) * a, y0 + (y1 - y0) * a);
    ctx.stroke();
  }
  // Stroke 2 grows TR → BL after stroke 1 finishes
  const b = Math.max(0, Math.min(1, (t - LOST_X_STROKE) / LOST_X_STROKE));
  if (b > 0) {
    ctx.beginPath();
    ctx.moveTo(x1, y0);
    ctx.lineTo(x1 + (x0 - x1) * b, y0 + (y1 - y0) * b);
    ctx.stroke();
  }
  ctx.restore();
}

function layoutMiniCollection(panelW, maxPanelH) {
  const cols = 6, rows = 2;
  const gapX = 8, gapY = 8;
  const padX = 14, padTop = 28, padBot = 12;
  const gridW = panelW - padX * 2;
  let cw = (gridW - gapX * (cols - 1)) / cols;
  let ch = cardHeight(cw);
  let contentH = padTop + rows * ch + (rows - 1) * gapY + padBot;
  if (maxPanelH && contentH > maxPanelH) {
    // Shrink uniformly so 2 rows fit without squashing
    const maxCh = (maxPanelH - padTop - padBot - (rows - 1) * gapY) / rows;
    ch = maxCh;
    cw = cardWidth(ch);
    contentH = padTop + rows * ch + (rows - 1) * gapY + padBot;
  }
  return { cols, rows, gapX, gapY, padX, padTop, padBot, cw, ch, contentH };
}

function drawMiniCollection(opts) {
  opts = opts || {};
  const panelX = opts.x != null ? opts.x : 100;
  const panelY = opts.y != null ? opts.y : 175;
  const panelW = opts.w != null ? opts.w : W - 200;
  const maxH = opts.maxH != null ? opts.maxH : (H - panelY - 20);
  const lostId = opts.lostId || null;
  const lostPrevCount = opts.lostPrevCount || 0;
  const animT = opts.animT != null ? opts.animT : 0;
  const animDur = opts.animDur != null ? opts.animDur : 2.2;

  const L = layoutMiniCollection(panelW, maxH);
  const panelH = L.contentH;

  // Center grid horizontally if cards shrank below full width
  const gridW = L.cols * L.cw + (L.cols - 1) * L.gapX;
  const gridOriginX = panelX + (panelW - gridW) / 2;

  ctx.fillStyle = "rgba(12,8,22,0.88)";
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,90,154,0.55)";
  ctx.lineWidth = 2;
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.stroke();

  const unique = Object.keys(collection).filter(k => collection[k] > 0).length;
  ctx.fillStyle = "#ffb0d0";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Babes", panelX + 14, panelY + 20);
  ctx.fillStyle = "#fff";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText(unique + " / " + CHAR_DEFS.length + " owned", panelX + panelW - 14, panelY + 20);

  for (let i = 0; i < CHAR_DEFS.length; i++) {
    const col = i % L.cols, row = Math.floor(i / L.cols);
    const x = gridOriginX + col * (L.cw + L.gapX);
    const y = panelY + L.padTop + row * (L.ch + L.gapY);
    const char = CHAR_DEFS[i];
    const count = collection[char.id] || 0;
    const isLost = lostId && char.id === lostId;
    const cw = L.cw, ch = L.ch;

    ctx.save();
    if (isLost) {
      // Keep babe colored as pre-loss; pen-stroke red X draws in (~0.15s × 2)
      const displayCount = count > 0 ? count : (lostPrevCount > 1 ? lostPrevCount - 1 : null);
      drawCard(char, x, y, cw, ch, {
        locked: false,
        count: displayCount,
        showRarity: false,
      });
      drawLostBabeX(x, y, cw, ch, animT);
    } else {
      drawCard(char, x, y, cw, ch, {
        locked: count === 0,
        count: count > 0 ? count : null,
        showRarity: false,
      });
    }
    ctx.restore();
  }
  return { panelH, cw: L.cw, ch: L.ch, ratio: L.cw / L.ch };
}

function drawDead() {
  // Solid black — same stage as the cry beat; layout unchanged on top
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ff6b8a";
  ctx.font = "bold 32px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Ouch!", W / 2, 48);
  const unique = ownedUniqueCount(collection);
  ctx.fillStyle = "#ffb0d0";
  ctx.font = "13px sans-serif";
  ctx.fillText("Babes owned: " + unique + "/" + BABE_POOL.length, W / 2, 72);

  if (loseAnim && loseAnim.name) {
    ctx.fillStyle = "#ffe66d";
    ctx.font = "bold 20px sans-serif";
    ctx.fillText("LOST: " + loseAnim.name, W / 2, 98);
    ctx.fillStyle = "#bbb";
    ctx.font = "12px sans-serif";
    ctx.fillText("A random babe was taken from your collection", W / 2, 118);
  } else {
    ctx.fillStyle = "#ccc";
    ctx.font = "14px sans-serif";
    ctx.fillText("No babes to lose… this time.", W / 2, 100);
  }

  // Gallery-style grid (rarity→name), auto-scrolled to lost babe
  const list = sortedBabeList();
  const cols = 6;
  const cw = 92, ch = cardHeight(cw), gapX = 12, gapY = 10;
  const panelX = 48, panelY = 132;
  const panelW = W - 96;
  const panelH = H - panelY - 40;
  const gridW = cols * cw + (cols - 1) * gapX;
  const startX = panelX + (panelW - gridW) / 2;
  const rows = Math.ceil(list.length / cols);
  const contentH = rows * ch + (rows - 1) * gapY;
  const maxScroll = Math.max(0, contentH - panelH + 8);

  let focusIdx = loseAnim && loseAnim.lostId
    ? list.findIndex(b => b.id === loseAnim.lostId) : -1;
  if (deathGridScroll < 0) {
    if (focusIdx >= 0) {
      const row = Math.floor(focusIdx / cols);
      const rowY = row * (ch + gapY);
      deathGridScroll = Math.max(0, Math.min(maxScroll, rowY - (panelH - ch) / 2));
    } else {
      deathGridScroll = 0;
    }
  }
  deathGridScroll = Math.max(0, Math.min(maxScroll, deathGridScroll));

  ctx.fillStyle = "rgba(12,8,22,0.88)";
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,90,154,0.5)";
  ctx.lineWidth = 2;
  roundRect(panelX, panelY, panelW, panelH, 12);
  ctx.stroke();

  ctx.save();
  ctx.beginPath();
  ctx.rect(panelX + 4, panelY + 4, panelW - 8, panelH - 8);
  ctx.clip();

  for (let i = 0; i < list.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = startX + col * (cw + gapX);
    const y = panelY + 10 + row * (ch + gapY) - deathGridScroll;
    if (y + ch < panelY || y > panelY + panelH) continue;
    const babe = list[i];
    const count = collection[babe.id] || 0;
    const isLost = loseAnim && loseAnim.lostId === babe.id;
    if (isLost) {
      const displayCount = count > 0 ? count : (loseAnim.lostPrevCount > 1 ? loseAnim.lostPrevCount - 1 : null);
      drawCard(babe, x, y, cw, ch, {
        locked: false,
        count: displayCount,
      });
      drawLostBabeX(x, y, cw, ch, loseAnim.t);
    } else {
      drawCard(babe, x, y, cw, ch, {
        locked: count === 0,
        count: count > 0 ? count : null,
      });
    }
  }
  ctx.restore();

  ctx.fillStyle = "#aaa";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Respawning at checkpoint…", W / 2, H - 14);
}

function drawWin() {
  ctx.fillStyle = "rgba(10,5,30,0.85)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ffe66d";
  ctx.font = "bold 36px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Level Complete!", W / 2, 48);
  ctx.fillStyle = "#ff8ec8";
  ctx.font = "15px sans-serif";
  ctx.fillText("Big Salty Gaming Studio thanks you", W / 2, 74);

  if (winStats) {
    ctx.fillStyle = "#fff";
    ctx.font = "14px sans-serif";
    ctx.fillText(
      "Coins " + winStats.coins + "/" + winStats.coinsMax +
      "   ·   Babes " + winStats.unique + "/" + BABE_POOL.length +
      "   ·   Pulls " + winStats.total,
      W / 2, 102
    );
  }

  ctx.fillStyle = "#ffb0d0";
  ctx.font = "bold 16px sans-serif";
  ctx.fillText("Babes gained this run", W / 2, 140);

  const gained = (winStats && winStats.gained) ? winStats.gained : [];
  if (!gained.length) {
    ctx.fillStyle = "#888";
    ctx.font = "14px sans-serif";
    ctx.fillText("No babes collected this run — next time!", W / 2, 220);
  } else {
    const cw = 72, ch = cardHeight(cw), gap = 12;
    const totalW = gained.length * cw + (gained.length - 1) * gap;
    // Scrollable row if too wide
    const maxW = W - 80;
    const scrollMax = Math.max(0, totalW - maxW);
    if (winStats._gScroll == null) winStats._gScroll = 0;
    if (justPressed["arrowleft"] || justPressed["a"]) winStats._gScroll = Math.max(0, winStats._gScroll - 80);
    if (justPressed["arrowright"] || justPressed["d"]) winStats._gScroll = Math.min(scrollMax, winStats._gScroll + 80);
    const origin = (W - Math.min(totalW, maxW)) / 2 - winStats._gScroll;
    ctx.save();
    ctx.beginPath();
    ctx.rect(40, 160, W - 80, ch + 40);
    ctx.clip();
    for (let i = 0; i < gained.length; i++) {
      const babe = babeById(gained[i]);
      if (!babe) continue;
      const x = origin + i * (cw + gap);
      drawCard(babe, x, 168, cw, ch, { showRarity: false });
    }
    ctx.restore();
    if (scrollMax > 0) {
      ctx.fillStyle = "#888";
      ctx.font = "11px sans-serif";
      ctx.fillText("← → scroll", W / 2, 168 + ch + 28);
    }
  }

  ctx.fillStyle = "#ffe66d";
  ctx.font = "bold 16px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(isTouch ? "Tap to Restart" : "Press R or Enter to Restart", W / 2, H - 48);
  ctx.fillStyle = "#aaa";
  ctx.font = "13px sans-serif";
  ctx.fillText(isTouch ? "Open Collection to view your babes" : "Press C to view full babe gallery", W / 2, H - 26);
}

function frame(dt) {
  if (justPressed["m"]) { ensureAudio(); setMuted(!muted); }
  if (state === "title") {
    drawTitle();
    if ((justPressed[" "] || justPressed["enter"]) && (heroSprites.ready || heroSprites.failed)) {
      resetLevel(true);
      state = "play";
      ensureAudio();
    }
    return;
  }

  if (state === "collection") {
    if (slot) updateSlot(dt);
    updateParticles(dt);
    drawBackground();
    drawWorld();
    drawHUD();
    if (slot) drawSlot();
    drawCollection();
    if (justPressed["c"] || (justPressed["escape"] && !gallery.selected)) {
      gallery.selected = null;
      state = "play";
    }
    return;
  }

  if (state === "win") {
    if (slot) updateSlot(dt);
    updateParticles(dt);
    drawBackground();
    drawWorld();
    drawHUD();
    if (slot) drawSlot();
    drawWin();
    if (justPressed["r"] || justPressed["enter"]) {
      resetLevel(true);
      state = "play";
    }
    if (justPressed["c"]) state = "collection";
    return;
  }

  // update — gameplay + slot overlay run together
  updateParticles(dt);
  updateHudTray(dt);
  if (slot) updateSlot(dt);
  if (state === "play") {
    updatePlay(dt);
    if (justPressed["c"]) state = "collection";
  } else if (state === "dying") {
    updateDying(dt);
  } else if (state === "dead") {
    updateDead(dt);
  }

  // draw
  if (state === "dying") {
    drawDyingCry(); // black + zoomed cry; hide world/HUD
  } else if (state === "dead") {
    drawDead(); // black stage + Ouch layout
  } else {
    drawBackground();
    drawWorld();
    drawHUD();
  }
  // Slot overlay stays on top (including over death) so the roll remains visible
  if (slot) drawSlot();
}

// ---------- Main loop ----------
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  frame(dt);
  // clear justPressed at end of frame
  for (const k in justPressed) delete justPressed[k];
  requestAnimationFrame(loop);
}

// Fit canvas
function fit() {
  // Letterbox: scale canvas to fit while keeping 16:9 game aspect
  const r = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cssW = Math.max(1, Math.floor(W * r));
  const cssH = Math.max(1, Math.floor(H * r));
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  positionMuteBtn();
}
window.addEventListener("resize", () => { fit(); });
fit();

resetLevel(true);
state = "title";
preloadHeroSprites().then(ok => {
  if (!ok) console.warn("[HBC] Hero sprites failed to load — using drawn fallback");
});
preloadCardArt().then(() => {
  console.log("[HBC] card art ready");
}).catch(e => console.warn("[HBC] card art preload", e));
preloadCryAudio().then(() => {
  console.log("[HBC] cry audio ready", { oneshot: cryAudio.oneshotUrl, loop: cryAudio.loopUrl, webaudio: !!cryAudio.oneshotBuf });
}).catch(e => console.warn("[HBC] cry audio preload", e));
requestAnimationFrame(loop);

// Expose for headless testing
window.__HBC = {
  getHero: () => heroSprites,
  getPlayerSize: () => ({ w: player.w, h: player.h, sw: HERO_SW, sh: HERO_SH }),
  setDebugHeroPose: (p) => { debugHeroPose = p; },
  getState: () => state,
  setState: (s) => { state = s; },
  getPlayer: () => player,
  getCoins: () => coins,
  getEnemies: () => enemies,
  getHearts: () => hearts,
  getCollection: () => collection,
  getSlot: () => slot,
  getSlotQueue: () => slotQueue,
  getCallouts: () => callouts.map(c => ({ text: c.text, t: c.t, dur: c.dur, y: c.y, alpha: calloutAlpha(c) })),
  getCalloutTiming: () => ({ fadeIn: CALLOUT_IN, hold: CALLOUT_HOLD, fadeOut: CALLOUT_OUT }),
  // Debug: force the next pull(s) to a specific babe / tier (tier data is untouched)
  forcePull: (id) => { if (!babeById(id)) return false; debugPulls.push(id); return true; },
  setDebugRarity: (tier) => { debugRarity = tier || null; },
  grantBabe: (id, n) => { if (!babeById(id)) return false; collection[id] = (collection[id] || 0) + (n || 1); saveCollection(collection); return true; },
  getRarityArt: () => RARITY_ART,
  getTierCounts: () => BABE_POOL.reduce((m, b) => (m[b.rarity] = (m[b.rarity] || 0) + 1, m), {}),
  getCardAspect: () => CARD_ASPECT,
  getCardImgs: () => cardImgs,
  forceSlotResult: (id) => {
    const babe = babeById(id);
    if (!babe) return false;
    // Plant a finished-looking roll that awards this babe
    const strip = [];
    for (let i = 0; i < 24; i++) strip.push(CHAR_DEFS[i % CHAR_DEFS.length]);
    strip.push(babe);
    for (let i = 0; i < 4; i++) strip.push(CHAR_DEFS[i % CHAR_DEFS.length]);
    slot = {
      strip, result: babe, targetIndex: 24,
      startOffset: 0, offset: 24, elapsed: 1.2, duration: 1.2,
      done: true, revealT: 0,
    };
    return true;
  },
  getCardLayouts: () => {
    const slot = { w: 72 * 0.7, h: cardHeight(72 * 0.7) };
    const collection = { w: 100, h: cardHeight(100) };
    const title = { w: 90, h: cardHeight(90) };
    const world = { w: 15, h: cardHeight(15) };
    const death = { w: 140, h: cardHeight(140) };
    const win = { w: 72, h: cardHeight(72) };
    const hud = { w: 28, h: cardHeight(28) };
    return {
      aspect: CARD_ASPECT,
      poolSize: BABE_POOL.length,
      slot: { ...slot, ratio: slot.w / slot.h },
      collection: { ...collection, ratio: collection.w / collection.h },
      title: { ...title, ratio: title.w / title.h },
      worldPickup: { ...world, ratio: world.w / world.h },
      miniDeath: { ...death, ratio: death.w / death.h },
      miniWin: { ...win, ratio: win.w / win.h },
      hudLive: { w: HUD_CW, h: cardHeight(HUD_CW), ratio: HUD_CW / cardHeight(HUD_CW) },
    };
  },
  getLoseAnim: () => loseAnim,
  getDeathCry: () => deathCry,
  getCryAudio: () => ({
    playing: cryAudio.playing,
    startedAt: cryAudio.startedAt,
    ready: cryAudio.ready,
    oneshotUrl: cryAudio.oneshotUrl,
    hasBuf: !!cryAudio.oneshotBuf,
    muted,
  }),
  stopDeathCry,
  playDeathCry,
  setMuted,
  setLoseAnimT: (v) => { if (loseAnim) loseAnim.t = v; },
  getLostXStroke: () => LOST_X_STROKE,
  getCenteredCard: () => {
    if (!slot) return null;
    const idx = Math.round(slot.offset);
    return slot.strip[idx] || null;
  },
  startPlay: () => { resetLevel(true); state = "play"; },
  forceCoin: () => {
    const c = coins.find(x => !x.collected);
    if (c) { player.x = c.x - 4; player.y = c.y - player.h + 4; }
  },
  triggerCoin: () => {
    const c = coins.find(x => !x.collected);
    if (!c) return false;
    c.collected = true;
    onCoinCollected();
    return true;
  },
  openCollection: () => { state = "collection"; gallery.selected = null; },
  setGallerySelected: (id) => { gallery.selected = id; state = "collection"; },
  setGalleryFilter: (f) => { gallery.filter = f; gallery.scroll = 0; },
  getGallery: () => gallery,
  getBabePool: () => BABE_POOL,
  getRunGained: () => runGained,
  getHudTray: () => hudTray,
  focusHudOnBabe: (id) => focusHudOnBabe(id),
};
</script>
</body>
</html>
